<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>New API Black Hole — color controls + wheel zoom</title>
<style>
  :root { color-scheme: dark; }
  html,body,#app { width:100%; height:100%; margin:0; overflow:hidden; background:#000; }
  body { font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  #app { position:fixed; inset:0; }
  canvas { display:block; position:absolute; inset:0; opacity:0; }
  #controls {
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 10;
    width: min(320px, calc(100vw - 32px));
    box-sizing: border-box;
    padding: 14px 14px 12px;
    border-radius: 14px;
    background: rgba(10, 10, 14, 0.62);
    border: 1px solid rgba(255,255,255,0.12);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    color: #f5f7fb;
    user-select: none;
  }
  #controls h1 {
    margin: 0 0 10px;
    font-size: 15px;
    font-weight: 650;
    line-height: 1.2;
  }
  #controls p {
    margin: 0 0 12px;
    font-size: 12px;
    line-height: 1.45;
    color: rgba(245,247,251,0.78);
  }
  .row {
    display: grid;
    grid-template-columns: 84px 1fr auto;
    align-items: center;
    gap: 10px;
    margin: 10px 0;
  }
  .row label, .slider-row label {
    font-size: 12px;
    color: rgba(245,247,251,0.92);
  }
  input[type="color"] {
    width: 100%;
    min-width: 0;
    height: 34px;
    padding: 0;
    border: 1px solid rgba(255,255,255,0.16);
    border-radius: 9px;
    background: transparent;
    cursor: pointer;
  }
  .hex {
    font-variant-numeric: tabular-nums;
    font-size: 12px;
    color: rgba(245,247,251,0.72);
    min-width: 64px;
    text-align: right;
  }
  .slider-row { margin: 12px 0 8px; }
  .slider-head {
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 12px;
    margin-bottom: 6px;
  }
  .slider-value {
    font-size: 12px;
    color: rgba(245,247,251,0.72);
    font-variant-numeric: tabular-nums;
  }
  input[type="range"] {
    width: 100%;
    margin: 0;
  }
  .actions {
    display:flex;
    gap:10px;
    margin-top: 12px;
  }
  button {
    appearance: none;
    border: 1px solid rgba(255,255,255,0.14);
    background: rgba(255,255,255,0.08);
    color: #fff;
    padding: 8px 12px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 12px;
  }
  button:hover { background: rgba(255,255,255,0.14); }
  #hint {
    position: fixed;
    right: 14px;
    bottom: 14px;
    z-index: 10;
    font-size: 12px;
    line-height: 1.35;
    color: rgba(245,247,251,0.84);
    background: rgba(10,10,14,0.45);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 10px;
    padding: 8px 10px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  @media (max-width: 640px) {
    #controls { top: 10px; left: 10px; width: min(320px, calc(100vw - 20px)); }
    #hint { left: 10px; right: 10px; bottom: 10px; }
  }
</style>
</head>
<body>
<div id="app" aria-hidden="true"></div>
<section id="controls" aria-label="Black hole controls">
  <h1>Black Hole Controls</h1>
  <p>可调品牌色 + 鼠标滚轮缩放。上下移动仍支持 180° 视角切换。</p>
  <div class="row">
    <label for="tintA">颜色 A</label>
    <input id="tintA" type="color" value="#59dbee">
    <div class="hex" id="tintAHex">#59DBEE</div>
  </div>
  <div class="row">
    <label for="tintB">颜色 B</label>
    <input id="tintB" type="color" value="#fc73bf">
    <div class="hex" id="tintBHex">#FC73BF</div>
  </div>
  <div class="row">
    <label for="tintC">颜色 C</label>
    <input id="tintC" type="color" value="#6b4cff">
    <div class="hex" id="tintCHex">#6B4CFF</div>
  </div>
  <div class="slider-row">
    <div class="slider-head">
      <label for="zoom">缩放 / 相机距离</label>
      <div class="slider-value" id="zoomValue">26.0</div>
    </div>
    <input id="zoom" type="range" min="12" max="42" step="0.1" value="26">
  </div>
  <div class="actions">
    <button id="resetColors" type="button">重置颜色</button>
    <button id="resetView" type="button">重置视角/缩放</button>
  </div>
</section>
<div id="hint">滚轮缩放 · 鼠标移动控制视角 · 颜色面板实时生效</div>
<script>
(() => {
  'use strict';

  const VERTEX_SHADER = `
attribute vec2 position;
attribute vec2 uv;

varying vec2 vUv;

void main() {
  vUv = uv;
  gl_Position = vec4(position, 0.0, 1.0);
}
`;

  const FRAGMENT_SHADER = `
precision highp float;

uniform float uTime;
uniform vec2 uResolution;
uniform vec2 uMouse;    // damped pointer, [-1, 1], +y up
uniform vec2 uCenter;   // hole center offset from screen center (scene units)
uniform float uSeed;
uniform vec3 uTintA;    // customizable tint A
uniform vec3 uTintB;    // customizable tint B
uniform vec3 uTintC;    // customizable tint C
uniform float uCamDist; // wheel-adjustable orbit radius

varying vec2 vUv;

const float DISK_IN = 2.6;
const float DISK_OUT = 10.0;
const float FOCAL = 1.4;
const int STEPS = 110;

vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec4 permute(vec4 x) { return mod289(((x * 34.0) + 1.0) * x); }
vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }

float snoise(vec3 v) {
  const vec2 C = vec2(1.0 / 6.0, 1.0 / 3.0);
  const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
  vec3 i = floor(v + dot(v, C.yyy));
  vec3 x0 = v - i + dot(i, C.xxx);
  vec3 g = step(x0.yzx, x0.xyz);
  vec3 l = 1.0 - g;
  vec3 i1 = min(g.xyz, l.zxy);
  vec3 i2 = max(g.xyz, l.zxy);
  vec3 x1 = x0 - i1 + C.xxx;
  vec3 x2 = x0 - i2 + C.yyy;
  vec3 x3 = x0 - D.yyy;
  i = mod289(i);
  vec4 p = permute(permute(permute(
      i.z + vec4(0.0, i1.z, i2.z, 1.0))
    + i.y + vec4(0.0, i1.y, i2.y, 1.0))
    + i.x + vec4(0.0, i1.x, i2.x, 1.0));
  float n_ = 0.142857142857;
  vec3 ns = n_ * D.wyz - D.xzx;
  vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
  vec4 x_ = floor(j * ns.z);
  vec4 y_ = floor(j - 7.0 * x_);
  vec4 x = x_ * ns.x + ns.yyyy;
  vec4 y = y_ * ns.x + ns.yyyy;
  vec4 h = 1.0 - abs(x) - abs(y);
  vec4 b0 = vec4(x.xy, y.xy);
  vec4 b1 = vec4(x.zw, y.zw);
  vec4 s0 = floor(b0) * 2.0 + 1.0;
  vec4 s1 = floor(b1) * 2.0 + 1.0;
  vec4 sh = -step(h, vec4(0.0));
  vec4 a0 = b0.xzyw + s0.xzyw * sh.xxyy;
  vec4 a1 = b1.xzyw + s1.xzyw * sh.zzww;
  vec3 p0 = vec3(a0.xy, h.x);
  vec3 p1 = vec3(a0.zw, h.y);
  vec3 p2 = vec3(a1.xy, h.z);
  vec3 p3 = vec3(a1.zw, h.w);
  vec4 norm = taylorInvSqrt(vec4(dot(p0, p0), dot(p1, p1), dot(p2, p2), dot(p3, p3)));
  p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
  vec4 m = max(0.6 - vec4(dot(x0, x0), dot(x1, x1), dot(x2, x2), dot(x3, x3)), 0.0);
  m = m * m;
  return 42.0 * dot(m * m, vec4(dot(p0, x0), dot(p1, x1), dot(p2, x2), dot(p3, x3)));
}

float hash21(vec2 p) {
  p = fract(p * vec2(234.34, 435.345));
  p += dot(p, p + 34.23);
  return fract(p.x * p.y);
}

vec4 diskShade(vec3 hit, vec3 rd) {
  float hr = length(hit.xz);
  float ang = atan(hit.z, hit.x);
  float omega = 2.8 * pow(hr, -1.5);
  float sa = ang + uTime * omega;
  vec3 np = vec3(cos(sa) * 1.15, sin(sa) * 1.15, log(hr) * 4.6 + uSeed);
  float n = 0.52 * snoise(np)
          + 0.31 * snoise(np * vec3(2.3, 2.3, 2.7))
          + 0.17 * snoise(np * vec3(5.1, 5.1, 5.6));
  n = 0.5 + 0.5 * n;
  float streak = 0.25 + 0.75 * pow(n, 2.2);
  float clump = smoothstep(0.74, 0.95, n);
  float fade = smoothstep(DISK_IN, DISK_IN + 1.0, hr)
             * (1.0 - smoothstep(6.0, DISK_OUT, hr));
  float density = fade * pow(DISK_IN / hr, 1.7);
  float t = clamp((hr - DISK_IN) / (DISK_OUT - DISK_IN), 0.0, 1.0);
  vec3 brand = mix(uTintA, uTintB, 0.54 + 0.46 * sin(ang - uTime * 0.05));
  vec3 inner = vec3(1.0, 0.97, 1.0);
  vec3 outer = mix(brand, uTintC, 0.70);
  vec3 base = mix(inner, brand, smoothstep(0.02, 0.35, t));
  base = mix(base, outer, smoothstep(0.40, 0.95, t));
  vec3 tangent = normalize(vec3(-hit.z, 0.0, hit.x));
  float dop = dot(tangent, normalize(rd));
  float beam = pow(clamp(1.0 - 0.16 * dop, 0.84, 1.16), 1.4);
  base = mix(base, uTintA, clamp(-dop * 0.16, 0.0, 0.16));
  base = mix(base, mix(uTintB, uTintC, 0.35), clamp(dop * 0.16, 0.0, 0.16));
  float flick = 0.93 + 0.07 * sin(uTime * 0.9 + sin(uTime * 0.37) * 2.2);
  float eBase = density * streak * flick * (1.0 + 0.9 * clump);
  float eLight = eBase * beam;
  return vec4(base * eLight * 1.4, clamp(eBase * 1.5, 0.0, 1.0));
}

vec3 starLayer(vec2 sc, float scale, float threshold, float sharp) {
  vec2 cell = floor(sc * scale);
  vec2 cuv = fract(sc * scale);
  float sh = hash21(cell + floor(uSeed));
  vec2 spos = vec2(hash21(cell + 7.13), hash21(cell + 3.71));
  float sd = length(cuv - spos);
  float star = step(threshold, sh) * exp(-sd * sd * sharp);
  float tw = 0.6 + 0.4 * sin(uTime * (0.3 + sh * 2.0) + sh * 41.0);
  vec3 tintC = mix(uTintA, uTintB, 0.15 + hash21(cell + 11.7) * 0.55);
  tintC = mix(vec3(0.86, 0.90, 1.0), tintC, 0.45);
  return tintC * star * tw;
}

vec3 background(vec3 dir) {
  vec3 d = normalize(dir);
  vec2 sc = vec2(atan(d.z, d.x) * 3.2, asin(clamp(d.y, -1.0, 1.0)) * 6.4);
  vec3 col = starLayer(sc, 14.0, 0.92, 380.0) * 0.6;
  col += starLayer(sc + 17.3, 31.0, 0.80, 520.0) * 0.22;
  float nn = snoise(d * 2.3 + uSeed) * 0.5 + 0.5;
  float nn2 = snoise(d * 5.9 - uSeed) * 0.5 + 0.5;
  vec3 nebula = mix(uTintA, uTintB, clamp(0.54 + 0.76 * d.x, 0.0, 1.0));
  nebula = mix(nebula, uTintC, 0.18);
  col += nebula * 0.050 * nn * nn * (0.5 + 0.5 * nn2);
  return col;
}

void main() {
  float aspect = uResolution.x / max(uResolution.y, 1.0);
  vec2 sp = (vUv - 0.5) * vec2(aspect, 1.0) - uCenter;
  const float HALF_PI = 1.5707963267948966;
  float az = uMouse.x * 0.20;
  float el = uMouse.y * HALF_PI;
  vec3 ro = uCamDist * vec3(cos(el) * sin(az), sin(el), -cos(el) * cos(az));
  vec3 fwd = normalize(-ro);
  vec3 right = vec3(-cos(az), 0.0, -sin(az));
  vec3 up = normalize(cross(right, fwd));
  vec3 rd = normalize(fwd * FOCAL + right * sp.x + up * sp.y);

  vec3 pos = ro;
  float b = dot(ro, rd);
  float disc = b * b - (dot(ro, ro) - 225.0);
  if (disc > 0.0) {
    float tEnter = -b - sqrt(disc);
    if (tEnter > 0.0) pos = ro + rd * tEnter;
  }

  vec3 hv = cross(pos, rd);
  float h2 = dot(hv, hv);
  vec3 vel = rd;
  vec3 col = vec3(0.0);
  float through = 1.0;
  bool captured = false;

  for (int i = 0; i < STEPS; i++) {
    float r2 = dot(pos, pos);
    float r = sqrt(r2);
    if (r < 1.0) { captured = true; break; }
    if (r > 15.5 && dot(pos, vel) > 0.0) break;
    float dt = clamp(0.30 * (r - 1.0), 0.04, 0.8);
    vel += (-1.5 * h2 * pos / (r2 * r2 * r)) * dt;
    vec3 next = pos + vel * dt;
    if (pos.y * next.y < 0.0) {
      vec3 hit = mix(pos, next, pos.y / (pos.y - next.y));
      float hr = length(hit.xz);
      if (hr > DISK_IN && hr < DISK_OUT) {
        vec4 e = diskShade(hit, vel);
        col += e.rgb * through;
        through *= 1.0 - e.a;
        if (through < 0.03) break;
      }
    }
    pos = next;
  }

  if (!captured) col += background(vel) * through;
  vec2 hp = sp * vec2(1.0, 1.9);
  float halo = exp(-length(hp) * 3.2) * 0.10 + exp(-length(hp) * 7.5) * 0.09;
  vec3 brandHalo = mix(mix(uTintA, uTintB, 0.55), uTintC, 0.18);
  col += brandHalo * halo * smoothstep(0.10, 0.17, length(sp));
  col = 1.0 - exp(-col * 1.7);
  col *= 0.94 + 0.12 * hash21(gl_FragCoord.xy * 0.71);
  col += (hash21(gl_FragCoord.xy) - 0.5) * 0.004;
  gl_FragColor = vec4(col, 1.0);
}
`;

  const DEFAULT_TINTS = {
    a: '#59dbee',
    b: '#fc73bf',
    c: '#6b4cff'
  };
  const DEFAULT_CAM_DIST = 26.0;
  const MIN_CAM_DIST = 12.0;
  const MAX_CAM_DIST = 42.0;
  const CENTER = [0.0, 0.0];

  const host = document.getElementById('app');
  const canvas = document.createElement('canvas');
  const tintAInput = document.getElementById('tintA');
  const tintBInput = document.getElementById('tintB');
  const tintCInput = document.getElementById('tintC');
  const tintAHex = document.getElementById('tintAHex');
  const tintBHex = document.getElementById('tintBHex');
  const tintCHex = document.getElementById('tintCHex');
  const zoomInput = document.getElementById('zoom');
  const zoomValue = document.getElementById('zoomValue');
  const resetColorsBtn = document.getElementById('resetColors');
  const resetViewBtn = document.getElementById('resetView');

  const attrs = {
    alpha:false,
    depth:false,
    stencil:false,
    antialias:false,
    premultipliedAlpha:false,
    preserveDrawingBuffer:false,
    powerPreference:'high-performance'
  };

  const gl = canvas.getContext('webgl2', attrs) || canvas.getContext('webgl', attrs);
  if (!gl) {
    host.textContent = 'WebGL is unavailable in this browser.';
    host.style.color = '#fff';
    host.style.display = 'grid';
    host.style.placeItems = 'center';
    return;
  }

  function hexToRgb01(hex) {
    const clean = hex.replace('#', '');
    const n = parseInt(clean, 16);
    return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255];
  }

  function setHexLabel(el, value) {
    el.textContent = value.toUpperCase();
  }

  function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

  function compile(type, source) {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, source);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(sh) || 'shader compile failed';
      gl.deleteShader(sh);
      throw new Error(log);
    }
    return sh;
  }

  function makeProgram() {
    const vs = compile(gl.VERTEX_SHADER, VERTEX_SHADER);
    const fs = compile(gl.FRAGMENT_SHADER, FRAGMENT_SHADER);
    const program = gl.createProgram();
    gl.attachShader(program, vs);
    gl.attachShader(program, fs);
    gl.linkProgram(program);
    gl.deleteShader(vs);
    gl.deleteShader(fs);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
      const log = gl.getProgramInfoLog(program) || 'program link failed';
      gl.deleteProgram(program);
      throw new Error(log);
    }
    return program;
  }

  function waitForParallelCompile(done) {
    const ext = gl.getExtension('KHR_parallel_shader_compile');
    let raf = 0;
    if (!ext) {
      raf = requestAnimationFrame(() => { raf = requestAnimationFrame(done); });
      return () => cancelAnimationFrame(raf);
    }
    const vs = compile(gl.VERTEX_SHADER, VERTEX_SHADER);
    const fs = compile(gl.FRAGMENT_SHADER, FRAGMENT_SHADER);
    const pre = gl.createProgram();
    gl.attachShader(pre, vs);
    gl.attachShader(pre, fs);
    gl.linkProgram(pre);
    const deadline = performance.now() + 8000;
    let disposed = false;
    const cleanup = () => {
      if (disposed) return;
      disposed = true;
      gl.deleteProgram(pre);
      gl.deleteShader(vs);
      gl.deleteShader(fs);
    };
    const poll = () => {
      if (!gl.getProgramParameter(pre, ext.COMPLETION_STATUS_KHR) && performance.now() < deadline) {
        raf = requestAnimationFrame(poll);
        return;
      }
      cleanup();
      done();
    };
    raf = requestAnimationFrame(poll);
    return () => { cancelAnimationFrame(raf); cleanup(); };
  }

  let disposePrecompile = waitForParallelCompile(start);

  function start() {
    let program;
    try { program = makeProgram(); }
    catch (err) {
      console.error(err);
      host.textContent = 'Shader compilation failed. See console.';
      host.style.color = '#fff';
      host.style.display = 'grid';
      host.style.placeItems = 'center';
      return;
    }

    gl.useProgram(program);

    function bindAttribute(name, data) {
      const loc = gl.getAttribLocation(program, name);
      const buffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(data), gl.STATIC_DRAW);
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
      return buffer;
    }

    const positionBuffer = bindAttribute('position', [-1,-1, 3,-1, -1,3]);
    const uvBuffer = bindAttribute('uv', [0,0, 2,0, 0,2]);

    const U = {};
    for (const name of ['uTime','uResolution','uMouse','uCenter','uSeed','uTintA','uTintB','uTintC','uCamDist']) {
      U[name] = gl.getUniformLocation(program, name);
    }

    const uniforms = {
      tintA: hexToRgb01(DEFAULT_TINTS.a),
      tintB: hexToRgb01(DEFAULT_TINTS.b),
      tintC: hexToRgb01(DEFAULT_TINTS.c),
      camDist: DEFAULT_CAM_DIST
    };
    let targetCamDist = DEFAULT_CAM_DIST;

    function syncControlLabels() {
      setHexLabel(tintAHex, tintAInput.value);
      setHexLabel(tintBHex, tintBInput.value);
      setHexLabel(tintCHex, tintCInput.value);
      zoomInput.value = targetCamDist.toFixed(1);
      zoomValue.textContent = targetCamDist.toFixed(1);
    }

    function applyTints() {
      uniforms.tintA = hexToRgb01(tintAInput.value);
      uniforms.tintB = hexToRgb01(tintBInput.value);
      uniforms.tintC = hexToRgb01(tintCInput.value);
      syncControlLabels();
      render();
    }

    gl.uniform1f(U.uSeed, 100 * Math.random());
    gl.uniform2fv(U.uCenter, CENTER);

    host.appendChild(canvas);
    canvas.style.transition = 'opacity 900ms ease';

    const reduced = matchMedia('(prefers-reduced-motion: reduce)');
    let time = 0;
    let previous = 0;
    let animRaf = 0;
    let fadeRaf = 0;
    let running = false;
    let visible = true;
    const mouse = {x:0, y:0};
    const target = {x:0, y:0};

    function render() {
      gl.useProgram(program);
      gl.uniform1f(U.uTime, reduced.matches ? 8 : time);
      gl.uniform2f(U.uResolution, gl.drawingBufferWidth, gl.drawingBufferHeight);
      gl.uniform2f(U.uMouse, mouse.x, mouse.y);
      gl.uniform2fv(U.uCenter, CENTER);
      gl.uniform3fv(U.uTintA, uniforms.tintA);
      gl.uniform3fv(U.uTintB, uniforms.tintB);
      gl.uniform3fv(U.uTintC, uniforms.tintC);
      gl.uniform1f(U.uCamDist, uniforms.camDist);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }

    function frame(now) {
      animRaf = requestAnimationFrame(frame);
      const dt = Math.min((now - previous) / 1000, 0.05);
      previous = now;
      time += dt;
      mouse.x += (target.x - mouse.x) * 0.045;
      mouse.y += (target.y - mouse.y) * 0.045;
      uniforms.camDist += (targetCamDist - uniforms.camDist) * 0.14;
      render();
    }

    function updateRunning() {
      const shouldRun = visible && !document.hidden && !reduced.matches;
      if (shouldRun && !running) {
        running = true;
        previous = performance.now();
        animRaf = requestAnimationFrame(frame);
      } else if (!shouldRun && running) {
        running = false;
        cancelAnimationFrame(animRaf);
        if (reduced.matches) {
          uniforms.camDist = targetCamDist;
          render();
        }
      }
    }

    function resize() {
      const dpr = Math.min(devicePixelRatio || 1, 1.5);
      const w = Math.max(1, host.clientWidth);
      const h = Math.max(1, host.clientHeight);
      const bw = Math.max(1, Math.round(w * dpr));
      const bh = Math.max(1, Math.round(h * dpr));
      if (canvas.width !== bw || canvas.height !== bh) {
        canvas.width = bw;
        canvas.height = bh;
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';
        gl.viewport(0, 0, bw, bh);
      }
      render();
    }

    function onPointerMove(ev) {
      target.x = ev.clientX / innerWidth * 2 - 1;
      target.y = -(ev.clientY / innerHeight * 2 - 1);
    }

    function onWheel(ev) {
      ev.preventDefault();
      const delta = ev.deltaY;
      const zoomStep = 0.06;
      targetCamDist = clamp(targetCamDist + delta * zoomStep, MIN_CAM_DIST, MAX_CAM_DIST);
      syncControlLabels();
      if (reduced.matches) {
        uniforms.camDist = targetCamDist;
        render();
      }
    }

    function onZoomInput() {
      targetCamDist = clamp(parseFloat(zoomInput.value) || DEFAULT_CAM_DIST, MIN_CAM_DIST, MAX_CAM_DIST);
      syncControlLabels();
      if (reduced.matches) {
        uniforms.camDist = targetCamDist;
        render();
      }
    }

    function resetColors() {
      tintAInput.value = DEFAULT_TINTS.a;
      tintBInput.value = DEFAULT_TINTS.b;
      tintCInput.value = DEFAULT_TINTS.c;
      applyTints();
    }

    function resetView() {
      target.x = 0;
      target.y = 0;
      mouse.x = 0;
      mouse.y = 0;
      targetCamDist = DEFAULT_CAM_DIST;
      uniforms.camDist = DEFAULT_CAM_DIST;
      syncControlLabels();
      render();
    }

    tintAInput.addEventListener('input', applyTints);
    tintBInput.addEventListener('input', applyTints);
    tintCInput.addEventListener('input', applyTints);
    zoomInput.addEventListener('input', onZoomInput);
    resetColorsBtn.addEventListener('click', resetColors);
    resetViewBtn.addEventListener('click', resetView);

    const resizeObserver = new ResizeObserver(resize);
    resizeObserver.observe(host);
    resize();

    applyTints();
    syncControlLabels();

    if (reduced.matches) {
      canvas.style.opacity = '1';
    } else {
      fadeRaf = requestAnimationFrame(() => {
        fadeRaf = requestAnimationFrame(() => { canvas.style.opacity = '1'; });
      });
    }

    addEventListener('pointermove', onPointerMove, {passive:true});
    addEventListener('wheel', onWheel, {passive:false});

    const intersectionObserver = new IntersectionObserver(([entry]) => {
      visible = entry.isIntersecting;
      updateRunning();
    });
    intersectionObserver.observe(host);
    document.addEventListener('visibilitychange', updateRunning);
    reduced.addEventListener('change', updateRunning);
    updateRunning();

    addEventListener('beforeunload', () => {
      cancelAnimationFrame(animRaf);
      cancelAnimationFrame(fadeRaf);
      resizeObserver.disconnect();
      intersectionObserver.disconnect();
      removeEventListener('pointermove', onPointerMove);
      removeEventListener('wheel', onWheel);
      document.removeEventListener('visibilitychange', updateRunning);
      reduced.removeEventListener('change', updateRunning);
      tintAInput.removeEventListener('input', applyTints);
      tintBInput.removeEventListener('input', applyTints);
      tintCInput.removeEventListener('input', applyTints);
      zoomInput.removeEventListener('input', onZoomInput);
      resetColorsBtn.removeEventListener('click', resetColors);
      resetViewBtn.removeEventListener('click', resetView);
      gl.deleteBuffer(positionBuffer);
      gl.deleteBuffer(uvBuffer);
      gl.deleteProgram(program);
    }, {once:true});
  }
})();
</script>
</body>
</html>
