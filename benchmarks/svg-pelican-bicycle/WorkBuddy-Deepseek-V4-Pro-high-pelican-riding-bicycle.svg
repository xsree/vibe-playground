<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img" aria-label="A pelican riding a bicycle">
  <title>鹈鹕骑自行车</title>
  <desc>一只鹈鹕骑在自行车上：大喙与喉囊、两轮、车架、踏板、翅膀搭在车把附近。</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe8ff"/>
      <stop offset="1" stop-color="#eef7ff"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6e0d8"/>
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff8c42"/>
    </linearGradient>
    <radialGradient id="pouch" cx="0.4" cy="0.4" r="0.9">
      <stop offset="0" stop-color="#ffc97a"/>
      <stop offset="1" stop-color="#f58a3c"/>
    </radialGradient>
  </defs>

  <!-- 天空背景 -->
  <rect x="0" y="0" width="640" height="480" fill="url(#sky)"/>

  <!-- 地面 -->
  <rect x="0" y="392" width="640" height="88" fill="#9fd28f"/>
  <rect x="0" y="392" width="640" height="6" fill="#7cbf73"/>

  <!-- 远景山丘与太阳 -->
  <circle cx="548" cy="86" r="40" fill="#ffe08a" opacity="0.9"/>
  <ellipse cx="150" cy="400" rx="200" ry="34" fill="#8cc97f" opacity="0.6"/>
  <ellipse cx="520" cy="404" rx="170" ry="26" fill="#8cc97f" opacity="0.6"/>

  <!-- ================= 自行车 ================= -->
  <g id="bicycle" stroke="#3a3a3a" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- 后轮 -->
    <circle cx="235" cy="360" r="58" stroke="#444" stroke-width="6"/>
    <circle cx="235" cy="360" r="50" stroke="#dcdcdc" stroke-width="1.5"/>
    <!-- 前轮 -->
    <circle cx="455" cy="360" r="58" stroke="#444" stroke-width="6"/>
    <circle cx="455" cy="360" r="50" stroke="#dcdcdc" stroke-width="1.5"/>
    <!-- 后轮辐条 -->
    <g stroke="#999" stroke-width="1.5">
      <line x1="235" y1="302" x2="235" y2="418"/>
      <line x1="177" y1="360" x2="293" y2="360"/>
      <line x1="194" y1="319" x2="276" y2="401"/>
      <line x1="276" y1="319" x2="194" y2="401"/>
    </g>
    <!-- 前轮辐条 -->
    <g stroke="#999" stroke-width="1.5">
      <line x1="455" y1="302" x2="455" y2="418"/>
      <line x1="397" y1="360" x2="513" y2="360"/>
      <line x1="414" y1="319" x2="496" y2="401"/>
      <line x1="496" y1="319" x2="414" y2="401"/>
    </g>
    <!-- 车架：中轴 -> 后轴 -> 座管顶 -> 中轴，及前叉 -->
    <g stroke="#3a3a3a" stroke-width="6">
      <line x1="235" y1="360" x2="335" y2="360"/>
      <line x1="335" y1="360" x2="345" y2="255"/>
      <line x1="345" y1="255" x2="235" y2="360"/>
      <line x1="335" y1="360" x2="455" y2="360"/>
      <line x1="455" y1="360" x2="455" y2="300"/>
      <line x1="345" y1="255" x2="455" y2="300"/>
    </g>
    <!-- 座垫 -->
    <rect x="325" y="238" width="46" height="14" rx="7" fill="#2c2c2c"/>
    <!-- 车把 -->
    <g stroke="#3a3a3a" stroke-width="6">
      <line x1="455" y1="300" x2="475" y2="270"/>
    </g>
    <path d="M470 272 Q490 260 500 275" stroke="#3a3a3a" stroke-width="6" fill="none"/>
    <!-- 中轴与曲柄 -->
    <circle cx="335" cy="360" r="9" fill="#3a3a3a"/>
    <g stroke="#3a3a3a" stroke-width="6">
      <line x1="335" y1="360" x2="355" y2="385"/>
      <line x1="335" y1="360" x2="315" y2="335"/>
    </g>
    <!-- 踏板 -->
    <rect x="347" y="380" width="26" height="8" rx="3" fill="#555"/>
    <rect x="303" y="330" width="26" height="8" rx="3" fill="#555"/>
  </g>

  <!-- ================= 鹈鹕 ================= -->
  <g id="pelican">
    <!-- 尾羽 -->
    <path d="M300 240 Q272 224 260 200 Q276 214 292 230 Z" fill="#d8d2c8"/>
    <!-- 身体 -->
    <ellipse cx="350" cy="245" rx="72" ry="58" fill="url(#body)" stroke="#c9c2b6" stroke-width="2"/>
    <!-- 翅膀（搭在车把附近） -->
    <path d="M395 235 Q455 220 492 240 Q470 262 420 268 Z" fill="#efe9df" stroke="#c9c2b6" stroke-width="2"/>
    <path d="M405 243 Q450 235 480 248" fill="none" stroke="#d3cbbd" stroke-width="2"/>
    <!-- 脖子 -->
    <path d="M368 205 Q372 160 390 140 Q408 150 400 186 Q395 210 388 225 Z" fill="url(#body)" stroke="#c9c2b6" stroke-width="2"/>
    <!-- 头 -->
    <ellipse cx="398" cy="136" rx="34" ry="30" fill="url(#body)" stroke="#c9c2b6" stroke-width="2"/>
    <!-- 眼睛 -->
    <circle cx="410" cy="128" r="5" fill="#1d1d1d"/>
    <circle cx="412" cy="126" r="1.6" fill="#ffffff"/>
    <!-- 大喙（上喙） -->
    <path d="M430 132 Q476 126 506 140 L506 146 Q478 140 430 144 Z" fill="url(#beak)" stroke="#e0762f" stroke-width="1.5"/>
    <!-- 喉囊 -->
    <path d="M430 144 Q470 150 502 148 Q480 180 448 176 Q434 168 430 144 Z" fill="url(#pouch)" stroke="#e07a32" stroke-width="1.5"/>
    <!-- 头顶小羽冠 -->
    <path d="M390 108 Q398 96 410 104" fill="none" stroke="#e2dcd0" stroke-width="3" stroke-linecap="round"/>
    <!-- 腿（够到踏板） -->
    <g stroke="#f08c3a" stroke-width="7" stroke-linecap="round">
      <line x1="345" y1="290" x2="342" y2="330"/>
      <line x1="365" y1="288" x2="362" y2="332"/>
    </g>
    <g stroke="#e0762f" stroke-width="5" stroke-linecap="round">
      <line x1="342" y1="330" x2="315" y2="335"/>
      <line x1="362" y1="332" x2="355" y2="385"/>
    </g>
  </g>

  <!-- 速度线 -->
  <g stroke="#b8cfe0" stroke-width="3" stroke-linecap="round">
    <line x1="120" y1="250" x2="180" y2="250"/>
    <line x1="100" y1="272" x2="175" y2="272"/>
    <line x1="130" y1="228" x2="178" y2="228"/>
  </g>
</svg>
