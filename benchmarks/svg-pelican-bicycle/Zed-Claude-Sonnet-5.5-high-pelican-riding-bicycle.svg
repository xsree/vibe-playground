<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t d">
  <title id="t">Pelican riding a bicycle</title>
  <desc id="d">A white pelican with a red helmet and a big orange bill pedals a teal bicycle along a sunny road.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc6f2"/>
      <stop offset="0.7" stop-color="#cdeefb"/>
      <stop offset="1" stop-color="#fff4d6"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b7280"/>
      <stop offset="1" stop-color="#4b5563"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff7b0"/>
      <stop offset="0.55" stop-color="#ffe066"/>
      <stop offset="1" stop-color="#ffe066" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#f59e3b"/>
    </linearGradient>
    <g id="wheel">
      <circle r="70" fill="none" stroke="#1f2937" stroke-width="8"/>
      <circle r="63" fill="none" stroke="#9ca3af" stroke-width="2"/>
      <g stroke="#cbd5e1" stroke-width="1.3">
        <line x1="-63" y1="0" x2="63" y2="0"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(30)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(60)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(90)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(120)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(150)"/>
      </g>
      <circle r="8" fill="#374151"/>
      <circle r="3" fill="#e5e7eb"/>
    </g>
  </defs>

  <!-- background -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="660" cy="110" r="95" fill="url(#sun)"/>
  <circle cx="660" cy="110" r="38" fill="#ffe27a"/>

  <g fill="#fff" opacity="0.92">
    <ellipse cx="150" cy="95" rx="55" ry="17"/>
    <ellipse cx="190" cy="82" rx="38" ry="19"/>
    <ellipse cx="118" cy="86" rx="28" ry="14"/>
    <ellipse cx="470" cy="65" rx="45" ry="13"/>
    <ellipse cx="500" cy="55" rx="30" ry="14"/>
  </g>

  <!-- hills -->
  <path d="M0 430 Q120 340 260 410 T520 400 T800 395 L800 520 L0 520 Z" fill="#a7d8a0"/>
  <path d="M0 470 Q150 410 320 460 T620 450 T800 455 L800 520 L0 520 Z" fill="#7fc47a"/>

  <!-- road -->
  <rect x="0" y="500" width="800" height="100" fill="url(#road)"/>
  <rect x="0" y="496" width="800" height="7" fill="#9ca3af"/>
  <g stroke="#f9fafb" stroke-width="5" stroke-linecap="round" opacity="0.85">
    <line x1="30" y1="555" x2="110" y2="555"/>
    <line x1="210" y1="555" x2="290" y2="555"/>
    <line x1="390" y1="555" x2="470" y2="555"/>
    <line x1="570" y1="555" x2="650" y2="555"/>
    <line x1="750" y1="555" x2="830" y2="555"/>
  </g>

  <!-- speed lines -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8">
    <line x1="60" y1="300" x2="150" y2="300"/>
    <line x1="30" y1="340" x2="130" y2="340"/>
    <line x1="80" y1="380" x2="160" y2="380"/>
  </g>

  <!-- shadows -->
  <ellipse cx="260" cy="506" rx="78" ry="8" fill="#111827" opacity="0.28"/>
  <ellipse cx="550" cy="506" rx="78" ry="8" fill="#111827" opacity="0.28"/>

  <!-- wheels -->
  <use href="#wheel" x="260" y="430"/>
  <use href="#wheel" x="550" y="430"/>

  <!-- far leg (behind frame) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M352 326 L415 357 L354 418" stroke="#b9650f" stroke-width="9"/>
  </g>
  <path d="M338 420 L372 414 L364 428 L342 430 Z" fill="#c9751a" stroke="#8a4a0b" stroke-width="2" stroke-linejoin="round"/>

  <!-- frame -->
  <g fill="none" stroke="#0e9f9a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M260 430 L385 435"/>
    <path d="M260 430 L350 346"/>
    <path d="M350 346 L385 435"/>
    <path d="M350 346 L500 336"/>
    <path d="M385 435 L504 352"/>
    <path d="M500 332 L510 364"/>
    <path d="M510 364 L550 430"/>
  </g>
  <!-- seat post & saddle -->
  <path d="M350 346 L346 328" stroke="#374151" stroke-width="6" stroke-linecap="round"/>
  <path d="M322 326 Q346 316 372 324 Q370 332 346 332 Q326 333 322 326 Z" fill="#1f2937"/>
  <!-- stem & handlebar -->
  <path d="M500 332 L498 316" stroke="#374151" stroke-width="6" stroke-linecap="round"/>
  <path d="M486 314 Q500 308 516 312 Q530 316 534 326" fill="none" stroke="#374151" stroke-width="6" stroke-linecap="round"/>
  <!-- chainring & crank -->
  <circle cx="385" cy="435" r="19" fill="none" stroke="#6b7280" stroke-width="4"/>
  <circle cx="385" cy="435" r="12" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="3 3"/>
  <path d="M352 418 L418 452" stroke="#4b5563" stroke-width="6" stroke-linecap="round"/>
  <circle cx="385" cy="435" r="6" fill="#374151"/>
  <rect x="340" y="414" width="26" height="7" rx="3" fill="#374151" transform="rotate(-4 353 418)"/>
  <rect x="404" y="450" width="30" height="8" rx="3" fill="#374151"/>

  <!-- near leg -->
  <path d="M345 326 L425 372 L418 448" fill="none" stroke="#f08a1c" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="425" cy="372" r="6" fill="#f5a03a"/>
  <path d="M404 444 L446 444 Q452 452 440 456 L406 456 Q398 450 404 444 Z" fill="#f59a2b" stroke="#a85a0c" stroke-width="2" stroke-linejoin="round"/>
  <path d="M440 446 L440 455 M431 446 L431 455 M422 446 L422 455" stroke="#a85a0c" stroke-width="1.5"/>

  <!-- tail feathers -->
  <path d="M290 296 L228 276 Q222 281 232 288 L222 296 Q219 302 230 304 L224 314 Q224 320 234 320 L292 316 Z" fill="#e5e7eb" stroke="#374151" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M232 288 L286 300 M230 304 L286 308" stroke="#9ca3af" stroke-width="1.6" fill="none"/>

  <!-- body -->
  <ellipse cx="342" cy="292" rx="68" ry="43" transform="rotate(-18 342 292)" fill="#ffffff" stroke="#374151" stroke-width="2.5"/>
  <!-- folded wing hint on body -->
  <path d="M290 292 Q330 270 376 292 Q352 318 306 314 Q286 308 290 292 Z" fill="#eef0f3" stroke="#9ca3af" stroke-width="1.8"/>
  <path d="M302 304 Q330 296 358 302 M300 296 Q334 286 366 294" stroke="#c4c9d1" stroke-width="1.5" fill="none"/>

  <!-- neck (S-curve) -->
  <path d="M366 272 C405 268 392 224 430 212" fill="none" stroke="#374151" stroke-width="26" stroke-linecap="round"/>
  <path d="M366 272 C405 268 392 224 430 212" fill="none" stroke="#ffffff" stroke-width="21" stroke-linecap="round"/>

  <!-- pouch + bill -->
  <path d="M460 206 C500 276 585 272 626 222 Z" fill="url(#pouch)" stroke="#8a4a0b" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M488 222 Q530 262 592 240" fill="none" stroke="#c9751a" stroke-width="1.5" opacity="0.7"/>
  <path d="M456 184 Q545 184 630 208 Q638 216 626 222 L458 207 Z" fill="#f7b538" stroke="#8a4a0b" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M458 207 L626 222" stroke="#8a4a0b" stroke-width="2"/>
  <circle cx="500" cy="196" r="2.2" fill="#8a4a0b"/>

  <!-- head -->
  <circle cx="442" cy="197" r="22" fill="#ffffff" stroke="#374151" stroke-width="2.5"/>
  <!-- crest -->
  <path d="M422 190 Q408 186 404 194 Q412 196 420 200 Q408 204 408 212 Q418 210 424 208" fill="#ffffff" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
  <!-- eye -->
  <circle cx="453" cy="193" r="5" fill="#111827"/>
  <circle cx="454.8" cy="191.2" r="1.6" fill="#fff"/>
  <!-- helmet -->
  <path d="M419 191 Q420 168 444 168 Q467 170 465 188 Q440 182 419 191 Z" fill="#e11d48" stroke="#7f1d1d" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M434 170 Q430 178 430 185 M448 169 Q446 177 447 184" stroke="#fda4af" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M424 192 Q420 204 428 214" fill="none" stroke="#7f1d1d" stroke-width="2"/>

  <!-- arm / wing reaching handlebar -->
  <path d="M372 268 C420 268 480 292 524 312 L520 324 C470 322 410 322 374 300 Z" fill="#ffffff" stroke="#374151" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M410 290 Q460 302 508 316 M400 300 Q450 312 500 322" stroke="#c4c9d1" stroke-width="1.6" fill="none"/>
  <path d="M490 306 L534 312 L534 328 L494 324 Q482 316 490 306 Z" fill="#374151" stroke="#1f2937" stroke-width="2" stroke-linejoin="round"/>

  <!-- ground sparkles -->
  <g fill="#ffffff" opacity="0.7">
    <circle cx="190" cy="470" r="2"/>
    <circle cx="640" cy="470" r="2.4"/>
    <circle cx="700" cy="440" r="1.8"/>
  </g>
</svg>
