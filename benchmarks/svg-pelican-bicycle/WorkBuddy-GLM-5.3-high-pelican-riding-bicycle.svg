<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- ===== 背景：天空、太阳、云、地面 ===== -->
  <g id="background">
    <rect x="0" y="0" width="800" height="600" fill="#EAF4FB"/>
    <circle cx="690" cy="90" r="42" fill="#FFD666"/>
    <g fill="#FFFFFF" opacity="0.9">
      <ellipse cx="140" cy="90" rx="55" ry="20"/>
      <ellipse cx="175" cy="78" rx="40" ry="16"/>
      <ellipse cx="470" cy="60" rx="45" ry="15"/>
    </g>
    <rect x="0" y="530" width="800" height="70" fill="#C8E6C9"/>
    <line x1="0" y1="530" x2="800" y2="530" stroke="#9BBF9C" stroke-width="4"/>
  </g>

  <!-- ===== 自行车 ===== -->
  <g id="bicycle">
    <!-- 车轮 -->
    <g id="wheels" fill="none" stroke="#333" stroke-width="9">
      <circle cx="210" cy="450" r="85"/>
      <circle cx="565" cy="450" r="85"/>
    </g>
    <!-- 辐条 -->
    <g id="spokes" stroke="#888" stroke-width="2.5">
      <g>
        <line x1="210" y1="365" x2="210" y2="535"/>
        <line x1="125" y1="450" x2="295" y2="450"/>
        <line x1="150" y1="390" x2="270" y2="510"/>
        <line x1="150" y1="510" x2="270" y2="390"/>
      </g>
      <g>
        <line x1="565" y1="365" x2="565" y2="535"/>
        <line x1="480" y1="450" x2="650" y2="450"/>
        <line x1="505" y1="390" x2="625" y2="510"/>
        <line x1="505" y1="510" x2="625" y2="390"/>
      </g>
    </g>
    <!-- 轮毂 -->
    <circle cx="210" cy="450" r="10" fill="#555"/>
    <circle cx="565" cy="450" r="10" fill="#555"/>

    <!-- 车架 -->
    <g id="frame" stroke="#D94F3D" stroke-width="11" stroke-linecap="round" fill="none">
      <line x1="365" y1="460" x2="330" y2="318"/>              <!-- 座管 -->
      <line x1="365" y1="460" x2="520" y2="352"/>              <!-- 下管 -->
      <line x1="338" y1="332" x2="515" y2="338"/>              <!-- 上管 -->
      <line x1="210" y1="450" x2="365" y2="460"/>              <!-- 后下叉 -->
      <line x1="210" y1="450" x2="338" y2="332"/>              <!-- 后上叉 -->
      <line x1="515" y1="338" x2="565" y2="450"/>              <!-- 前叉 -->
    </g>

    <!-- 车把 -->
    <g id="handlebar" stroke="#444" stroke-width="8" stroke-linecap="round" fill="none">
      <line x1="515" y1="338" x2="505" y2="288"/>
      <line x1="505" y1="288" x2="545" y2="280"/>
    </g>
    <circle cx="547" cy="280" r="8" fill="#222"/>              <!-- 握把 -->

    <!-- 车座 -->
    <path d="M 295 315 Q 325 300 360 315 Q 325 328 295 315 Z" fill="#4A3728"/>

    <!-- 传动：牙盘、曲柄、踏板、链条 -->
    <g id="drivetrain">
      <circle cx="365" cy="460" r="24" fill="none" stroke="#666" stroke-width="6"/>
      <line x1="365" y1="460" x2="398" y2="490" stroke="#333" stroke-width="7" stroke-linecap="round"/>
      <line x1="365" y1="460" x2="332" y2="430" stroke="#333" stroke-width="7" stroke-linecap="round"/>
      <rect x="384" y="484" width="30" height="9" rx="3" fill="#222"/>
      <rect x="318" y="424" width="30" height="9" rx="3" fill="#222"/>
      <line x1="356" y1="443" x2="215" y2="443" stroke="#555" stroke-width="3.5"/>
      <line x1="356" y1="477" x2="215" y2="477" stroke="#555" stroke-width="3.5"/>
      <circle cx="210" cy="450" r="26" fill="none" stroke="#555" stroke-width="3.5"/>
    </g>
  </g>

  <!-- ===== 鹈鹕 ===== -->
  <g id="pelican">
    <!-- 远侧腿（后踏板） -->
    <g id="far-leg" stroke="#E8963A" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.75">
      <path d="M 330 295 Q 310 360 330 430"/>
      <path d="M 330 430 L 333 428"/>
    </g>
    <path d="M 322 424 L 346 424 L 336 434 Z" fill="#E8963A" opacity="0.75"/>

    <!-- 尾羽 -->
    <path d="M 262 255 Q 215 245 195 275 Q 235 285 265 280 Z" fill="#D9D2C3"/>

    <!-- 身体 -->
    <ellipse id="body" cx="330" cy="252" rx="88" ry="62" fill="#F7F3E9" stroke="#D9D2C3" stroke-width="2.5"/>

    <!-- 脖子 -->
    <path id="neck" d="M 368 215 Q 400 185 415 135 L 445 150 Q 425 205 388 240 Z" fill="#F7F3E9" stroke="#D9D2C3" stroke-width="2.5"/>

    <!-- 头 -->
    <circle id="head" cx="450" cy="118" r="30" fill="#F7F3E9" stroke="#D9D2C3" stroke-width="2.5"/>
    <circle cx="459" cy="108" r="5" fill="#222"/>              <!-- 眼睛 -->
    <circle cx="461" cy="106" r="1.8" fill="#FFF"/>

    <!-- 大喙：上喙 + 喉囊 -->
    <g id="beak">
      <path d="M 470 105 L 598 132 Q 600 140 592 142 L 470 128 Z" fill="#F2A33C" stroke="#D68A22" stroke-width="2"/>
      <path d="M 472 126 Q 560 138 592 143 Q 585 190 530 185 Q 485 178 472 126 Z"
            fill="#F5C07A" stroke="#D68A22" stroke-width="2"/>  <!-- 喉囊 -->
      <path d="M 592 143 Q 588 158 560 160" fill="none" stroke="#D68A22" stroke-width="1.5"/>
    </g>

    <!-- 翅膀：伸向车把 -->
    <g id="wing">
      <path d="M 348 232 Q 430 235 512 278 Q 470 292 430 288 Q 380 282 350 262 Z"
            fill="#E9E2D2" stroke="#C9C0AC" stroke-width="2"/>
      <g stroke="#C9C0AC" stroke-width="2" fill="none">
        <path d="M 380 244 Q 450 252 505 280"/>
        <path d="M 372 254 Q 440 262 492 285"/>
      </g>
    </g>

    <!-- 近侧腿（前踏板） -->
    <g id="near-leg" stroke="#E8963A" stroke-width="9" stroke-linecap="round" fill="none">
      <path d="M 352 300 Q 385 380 398 486"/>
    </g>
    <path d="M 386 482 L 416 484 L 402 496 Z" fill="#E8963A"/>  <!-- 脚蹼踩踏板 -->
  </g>

  <!-- 运动线条 -->
  <g id="motion" stroke="#B7CFE0" stroke-width="4" stroke-linecap="round">
    <line x1="60" y1="400" x2="110" y2="400"/>
    <line x1="45" y1="430" x2="95" y2="430"/>
    <line x1="70" y1="460" x2="115" y2="460"/>
  </g>
</svg>
