<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <style>
    .pelican { fill: #FFF; stroke: #222; stroke-width: 1.5; }
    .bike { fill: #8B4513; stroke: #222; stroke-width: 1.5; }
    .grass { fill: #7CFC00; }
  </style>
  <rect width="400" height="400" fill="#E0F7FA"/>
  <!-- Ground -->
  <rect x="0" y="340" width="400" height="60" fill="#7CFC00"/>
  <!-- Bike frame -->
  <path d="M60 280 Q120 220 180 280 L180 340 L60 340 Z" class="bike"/>
  <!-- Front wheel -->
  <circle cx="180" cy="340" r="35" class="bike"/>
  <!-- Rear wheel -->
  <circle cx="60" cy="340" r="35" class="bike"/>
  <!-- Pedals -->
  <line x1="90" y1="340" x2="90" y2="300" stroke="brown" stroke-width="8"/>
  <circle cx="90" cy="300" r="12" fill="brown"/>
  <circle cx="110" cy="300" r="12" fill="brown"/>
  <!-- Bike seat -->
  <path d="M150 270 Q160 260 170 270" class="bike"/>
  <!-- Pelican body -->
  <ellipse cx="200" cy="220" rx="60" ry="40" fill="#FFF" stroke="#222" stroke-width="1.5"/>
  <!-- Pelican head (with big beak) -->
  <path d="M260 210 Q300 180 340 210 Q320 240 260 210" fill="#FFF" stroke="#222" stroke-width="1.5"/>
  <!-- Beak -->
  <path d="M330 210 Q350 190 360 210" fill="orange" stroke="none"/>
  <!-- Eye -->
  <circle cx="300" cy="215" r="4" fill="#222"/>
  <!-- Pelican wings -->
  <path d="M200 220 Q150 200 130 230 L130 280 Q150 300 180 280 Z" class="bike"/>
  <path d="M200 220 Q250 200 270 230 L270 280 Q250 300 220 280 Z" class="bike"/>
  <!-- Pelican legs -->
  <path d="M65 340 Q80 360 95 340 L95 350" class="bike"/>
  <path d="M55 340 Q70 360 85 340 L85 350" class="bike"/>
</svg>