<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 630" role="img" aria-label="一只鹈鹕正在骑自行车">
  <title>Pelican riding a bicycle — WorkBuddy / Qwen3.8-27B / medium</title>
  <desc>纯手写 SVG：一只白色鹈鹕坐在橙色自行车上向前骑行，背景为草地、太阳与云朵。</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfeef8"/>
      <stop offset="1" stop-color="#eef8fd"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fce67"/>
      <stop offset="1" stop-color="#5ba03d"/>
    </linearGradient>
  </defs>

  <!-- 背景：天空与太阳 -->
  <rect x="0" y="0" width="800" height="630" fill="url(#sky)"/>
  <circle cx="120" cy="95" r="34" fill="#ffd94d" stroke="#ffbf00" stroke-width="4"/>
  <g stroke="#ffbf00" stroke-width="4" stroke-linecap="round">
    <line x1="120" y1="138" x2="120" y2="214"/>
    <line x1="120" y1="70" x2="120" y2="14"/>
    <line x1="77" y1="95" x2="1" y2="95"/>
    <line x1="163" y1="95" x2="239" y2="95"/>
    <line x1="89" y1="64" x2="31" y2="6"/>
    <line x1="151" y1="64" x2="209" y2="6"/>
    <line x1="89" y1="126" x2="31" y2="184"/>
    <line x1="151" y1="126" x2="209" y2="184"/>
  </g>
  <g fill="#ffffff" opacity="0.95">
