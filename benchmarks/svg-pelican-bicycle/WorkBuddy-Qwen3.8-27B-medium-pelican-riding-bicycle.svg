    <ellipse cx="515" cy="99" rx="22" ry="13"/>
    <ellipse cx="575" cy="99" rx="26" ry="14"/>
    <ellipse cx="690" cy="165" rx="30" ry="14"/>
    <ellipse cx="666" cy="172" rx="18" ry="10"/>
    <ellipse cx="716" cy="172" rx="20" ry="11"/>
  </g>

  <!-- 背景：草地、灌木、速度线、终点旗 -->
  <rect x="0" y="552" width="800" height="78" fill="url(#grass)"/>
  <g fill="#4f9a33">
    <ellipse cx="58" cy="552" rx="42" ry="24"/>
    <ellipse cx="103" cy="558" rx="32" ry="19"/>
    <ellipse cx="748" cy="552" rx="46" ry="26"/>
  </g>
  <g stroke="#fff" stroke-width="4" stroke-linecap="round" opacity="0.8">
    <line x1="198" y1="300" x2="238" y2="300"/>
    <line x1="188" y1="330" x2="244" y2="330"/>
    <line x1="198" y1="360" x2="234" y2="360"/>
  </g>
  <line x1="60" y1="552" x2="60" y2="472" stroke="#d96c2c" stroke-width="3" stroke-linecap="round"/>
  <path d="M60 472 L30 482 L60 492 Z" fill="#e63946" stroke="#c1121f" stroke-width="1.5"/>
  <circle cx="60" cy="472" r="4" fill="#e63946"/>
  <g stroke="#3f7d2a" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M150 552 q4 -14 8 0"/>
    <path d="M162 552 q-4 -12 6 0"/>
    <path d="M250 552 q4 -14 8 0"/>
    <path d="M262 552 q-4 -12 6 0"/>
    <path d="M700 552 q4 -14 8 0"/>
    <path d="M712 552 q-4 -12 6 0"/>
    <path d="M764 552 q4 -13 7 0"/>
  </g>
  <!-- 车轮下的阴影 -->
  <ellipse cx="420" cy="568" rx="262" ry="13" fill="#2f6b1e" opacity="0.35"/>

  <!-- ============ 自行车（后轮） ============ -->
  <!-- 辐条 + 后轮 -->
  <g stroke="#8a8f98" stroke-width="2.5">
    <line x1="280" y1="490" x2="360" y2="490"/>
    <line x1="280" y1="490" x2="200" y2="490"/>
    <line x1="280" y1="490" x2="325" y2="550"/>
    <line x1="280" y1="490" x2="235" y2="550"/>
    <line x1="280" y1="490" x2="325" y2="430"/>
    <line x1="280" y1="490" x2="235" y2="430"/>
  </g>
  <circle cx="280" cy="490" r="78" fill="#f4f6f8" stroke="#2f3640" stroke-width="8"/>
  <circle cx="280" cy="490" r="60" fill="none" stroke="#c2c8d0" stroke-width="2"/>
  <circle cx="280" cy="490" r="7" fill="#2f3640"/>
  <!-- 前车杠 -->
  <path d="M280 508 L247 468" stroke="#2b2f36" stroke-width="6" stroke-linecap="round"/>
  <path d="M240 470 L254 466" stroke="#2b2f36" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- 链条（后轴—大齿盘） -->
  <path d="M272 481 L453 483 L489 490 L454 499 L272 499 Z" fill="none" stroke="#4b515b" stroke-width="4"/>
  <line x1="272" y1="484" x2="456" y2="486" stroke="#7c828c" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="272" y1="496" x2="456" y2="496" stroke="#7c828c" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- ============ 车架（橙色） ============ -->
  <g stroke="#e2572b" stroke-width="8" stroke-linecap="round" fill="none">
    <line x1="460" y1="490" x2="430" y2="330"/> <!-- 立管 -->
    <line x1="460" y1="490" x2="542" y2="340"/> <!-- 下管 -->
    <line x1="459" y1="372" x2="542" y2="340"/> <!-- 上管 -->
    <line x1="430" y1="335" x2="280" y2="490"/> <!-- 上叉 -->
    <line x1="459" y1="372" x2="280" y2="490"/> <!-- 后下叉 -->
    <line x1="542" y1="340" x2="562" y2="490"/> <!-- 前叉 -->
  </g>
  <!-- 头管（稍粗） -->
  <line x1="542" y1="340" x2="552" y2="300" stroke="#c9411b" stroke-width="10" stroke-linecap="round"/>
  <!-- 尾灯 -->
  <circle cx="288" cy="483" r="6" fill="#e63946" stroke="#b1001f" stroke-width="1.5"/>

