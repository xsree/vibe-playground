  <line x1="552" y1="300" x2="546" y2="286" stroke="#2b2f36" stroke-width="7" stroke-linecap="round"/>
  <path d="M546 286 Q520 280 507 300" fill="none" stroke="#2b2f36" stroke-width="7" stroke-linecap="round"/>
  <ellipse cx="505" cy="302" rx="7" ry="9" fill="#7a4a21"/>
  <!-- 头管前灯 -->
  <circle cx="534" cy="318" r="8" fill="#ffd23e" stroke="#e0a400" stroke-width="2.5"/>
  <path d="M542 314 L550 310 M543 322 L551 325" stroke="#ffd23e" stroke-width="2" stroke-linecap="round"/>

  <!-- 车筐与鲜花 -->
  <rect x="478" y="292" width="60" height="32" rx="6" fill="#b07a45" stroke="#7a4a21" stroke-width="3"/>
  <g stroke="#7a4a21" stroke-width="2">
    <line x1="490" y1="292" x2="490" y2="324"/>
    <line x1="503" y1="292" x2="503" y2="324"/>
    <line x1="516" y1="292" x2="516" y2="324"/>
    <line x1="478" y1="302" x2="538" y2="302"/>
    <line x1="478" y1="314" x2="538" y2="314"/>
  </g>
  <g stroke="#3f7d2a" stroke-width="2.5">
    <line x1="508" y1="292" x2="510" y2="280"/>
    <line x1="528" y1="292" x2="533" y2="280"/>
  </g>
  <circle cx="511" cy="276" r="6" fill="#e63946" stroke="#b1001f" stroke-width="1.5"/>
  <circle cx="511" cy="276" r="2" fill="#ffd23e"/>
  <circle cx="535" cy="278" r="5.5" fill="#ffb703" stroke="#e0a400" stroke-width="1.5"/>
  <circle cx="535" cy="278" r="2" fill="#fff"/>

  <!-- 大齿盘 + 曲柄 + 踏板 -->
  <circle cx="460" cy="490" r="20" fill="none" stroke="#2b2f36" stroke-width="3.5"/>
  <circle cx="460" cy="490" r="17" fill="none" stroke="#8a8f98" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="460" y1="490" x2="439" y2="444" stroke="#2b2f36" stroke-width="5" stroke-linecap="round"/>
  <line x1="460" y1="490" x2="483" y2="532" stroke="#2b2f36" stroke-width="5" stroke-linecap="round"/>
  <rect x="421" y="439" width="38" height="10" rx="4" fill="#2b2f36"/>
  <rect x="469" y="528" width="38" height="10" rx="4" fill="#2b2f36"/>
  <circle cx="460" cy="490" r="6" fill="#2b2f36"/>

  <!-- ============ 鹈鹕 ============ -->
  <!-- 尾巴 -->
  <polygon points="298,328 236,362 264,374 250,392 300,360" fill="#cfd6dd" stroke="#4a5058" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- 身体 -->
  <ellipse cx="362" cy="306" rx="80" ry="52" transform="rotate(-22 362 306)" fill="#ffffff" stroke="#4a5058" stroke-width="2.5"/>
  <!-- 远侧腿（上提的脚） -->
  <path d="M424 366 L446 410" fill="none" stroke="#e08a3c" stroke-width="11" stroke-linecap="round"/>
  <ellipse cx="457" cy="421" rx="13" ry="6.5" transform="rotate(-12 457 421)" fill="#e08a3c" stroke="#a5651f" stroke-width="1.5"/>
  <!-- 翅膀（羽毛） -->
  <polygon points="380,295 346,282 312,290 282,308 258,332 276,346 316,344 352,332 380,318" fill="#c9d0d8" stroke="#4a5058" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="352,300 322,300 300,314 284,330 300,338 328,332 352,320" fill="#e2e7ec" stroke="#8a9099" stroke-width="1.5" stroke-linejoin="round"/>
  <g stroke="#9aa1ab" stroke-width="1.5" fill="none">
    <path d="M340 296 Q318 312 306 330"/>
    <path d="M362 306 Q338 320 326 336"/>
    <path d="M320 292 Q300 306 290 322"/>
  </g>
  <!-- 颈部（先深后白两次描边形成管状颈） -->
  <path d="M416 262 Q430 238 450 226" fill="none" stroke="#4a5058" stroke-width="27" stroke-linecap="round"/>
  <path d="M416 262 Q430 238 450 226" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round"/>
  <!-- 头 -->
  <circle cx="458" cy="232" r="27" fill="#ffffff" stroke="#4a5058" stroke-width="2.5"/>
  <!-- 头顶羽 -->
  <path d="M448 208 Q444 196 434 194 Q442 202 440 210 Z" fill="#ffffff" stroke="#4a5058" stroke-width="2" stroke-linejoin="round"/>
  <!-- 眼睛 -->
  <circle cx="446" cy="226" r="6" fill="#ffffff" stroke="#4a5058" stroke-width="2"/>
  <circle cx="448" cy="227" r="2.6" fill="#1b1e24"/>
  <!-- 上喙 -->
  <polygon points="473,214 588,247 580,257 471,233" fill="#f5a524" stroke="#a8641a" stroke-width="2" stroke-linejoin="round"/>
  <path d="M566 251 L576 259" stroke="#a8641a" stroke-width="2" fill="none"/>
  <!-- 喉囊（下喙） -->
  <path d="M470 235 L585 257 Q570 286 526 292 Q498 294 480 276 Q466 257 470 235 Z" fill="#efa53f" stroke="#a8641a" stroke-width="2" stroke-linejoin="round"/>
  <path d="M492 258 Q508 284 534 288" fill="none" stroke="#c9821f" stroke-width="2"/>
  <line x1="471" y1="233" x2="584" y2="256" stroke="#a8641a" stroke-width="1.5"/>
  <!-- 红色头带 -->
  <polygon points="477,215 528,225 526,233 476,223" fill="#e63946"/>
  <!-- 近侧腿 + 脚（踏在上方踏板上） -->
  <path d="M398 360 L414 402 L439 442" fill="none" stroke="#e08a3c" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="414" y1="402" x2="424" y2="406" stroke="#c06a24" stroke-width="2"/>
  <ellipse cx="444" cy="447" rx="15" ry="7" transform="rotate(-4 444 447)" fill="#e08a3c" stroke="#a5651f" stroke-width="1.5"/>
  <path d="M450 450 L462 454" stroke="#a5651f" stroke-width="2"/>

  <!-- 前轮（置于最前以制造把手在前、轮在后错觉） -->
  <g stroke="#8a8f98" stroke-width="2.5">
    <line x1="562" y1="490" x2="642" y2="490"/>
    <line x1="562" y1="490" x2="482" y2="490"/>
    <line x1="562" y1="490" x2="607" y2="550"/>
    <line x1="562" y1="490" x2="517" y2="550"/>
    <line x1="562" y1="490" x2="607" y2="430"/>
    <line x1="562" y1="490" x2="517" y2="430"/>
  </g>
  <circle cx="562" cy="490" r="78" fill="#f4f6f8" stroke="#2f3640" stroke-width="8"/>
  <circle cx="562" cy="490" r="60" fill="none" stroke="#c2c8d0" stroke-width="2"/>
  <circle cx="562" cy="490" r="7" fill="#2f3640"/>

  <!-- 署名角标 -->
  <text x="790" y="622" text-anchor="end" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#3f7d2a" opacity="0.85">WorkBuddy · Qwen3.8-27B · medium</text>
</svg>