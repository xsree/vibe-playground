<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ec8f7"/>
      <stop offset="1" stop-color="#e8f6ff"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fce6e"/>
      <stop offset="1" stop-color="#5da849"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="1" stop-color="#ffd93b"/>
    </radialGradient>
    <linearGradient id="beakGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff8c42"/>
    </linearGradient>
  </defs>

  <!-- Sky & sun -->
  <rect x="0" y="0" width="800" height="480" fill="url(#sky)"/>
  <circle cx="660" cy="100" r="46" fill="url(#sunGlow)">
    <animate attributeName="r" values="46;50;46" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Clouds -->
  <g fill="#ffffff" opacity="0.9">
    <g>
      <ellipse cx="0" cy="90" rx="42" ry="18"/>
      <ellipse cx="34" cy="82" rx="30" ry="15"/>
      <ellipse cx="-34" cy="84" rx="28" ry="14"/>
      <animateTransform attributeName="transform" type="translate" from="-140 0" to="940 0" dur="26s" repeatCount="indefinite"/>
    </g>
    <g opacity="0.75">
      <ellipse cx="0" cy="160" rx="36" ry="14"/>
      <ellipse cx="28" cy="153" rx="26" ry="12"/>
      <animateTransform attributeName="transform" type="translate" from="-140 0" to="940 0" dur="34s" begin="-14s" repeatCount="indefinite"/>
    </g>
    <g opacity="0.6">
      <ellipse cx="0" cy="60" rx="30" ry="12"/>
      <ellipse cx="24" cy="54" rx="22" ry="10"/>
      <animateTransform attributeName="transform" type="translate" from="940 0" to="-140 0" dur="40s" begin="-8s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Ground -->
  <rect x="0" y="480" width="800" height="120" fill="url(#ground)"/>
  <line x1="0" y1="480" x2="800" y2="480" stroke="#3f7d33" stroke-width="4"/>
  <line x1="0" y1="530" x2="800" y2="530" stroke="#ffffff" stroke-width="6" stroke-dasharray="46 34" opacity="0.7">
    <animate attributeName="stroke-dashoffset" from="0" to="-80" dur="0.5s" repeatCount="indefinite"/>
  </line>

  <!-- Whole rider+bike gentle bob -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="0.6s" repeatCount="indefinite"/>

    <!-- ============ BICYCLE ============ -->
    <!-- Rear wheel -->
    <g>
      <circle cx="300" cy="430" r="60" fill="none" stroke="#2b2b2b" stroke-width="9"/>
      <circle cx="300" cy="430" r="52" fill="none" stroke="#9aa4ad" stroke-width="3"/>
      <g stroke="#c8d0d8" stroke-width="3">
        <line x1="300" y1="378" x2="300" y2="482"/>
        <line x1="248" y1="430" x2="352" y2="430"/>
        <line x1="263" y1="393" x2="337" y2="467"/>
        <line x1="263" y1="467" x2="337" y2="393"/>
        <animateTransform attributeName="transform" type="rotate" from="0 300 430" to="360 300 430" dur="0.9s" repeatCount="indefinite"/>
      </g>
      <circle cx="300" cy="430" r="8" fill="#444"/>
    </g>

    <!-- Front wheel -->
    <g>
      <circle cx="540" cy="430" r="60" fill="none" stroke="#2b2b2b" stroke-width="9"/>
      <circle cx="540" cy="430" r="52" fill="none" stroke="#9aa4ad" stroke-width="3"/>
      <g stroke="#c8d0d8" stroke-width="3">
        <line x1="540" y1="378" x2="540" y2="482"/>
        <line x1="488" y1="430" x2="592" y2="430"/>
        <line x1="503" y1="393" x2="577" y2="467"/>
        <line x1="503" y1="467" x2="577" y2="393"/>
        <animateTransform attributeName="transform" type="rotate" from="0 540 430" to="360 540 430" dur="0.9s" repeatCount="indefinite"/>
      </g>
      <circle cx="540" cy="430" r="8" fill="#444"/>
    </g>

    <!-- Frame -->
    <g stroke="#e0455a" stroke-width="9" stroke-linecap="round" fill="none">
      <line x1="300" y1="430" x2="412" y2="438"/>   <!-- chainstay -->
      <line x1="412" y1="438" x2="540" y2="430"/>   <!-- downtube-ish to fork -->
      <line x1="300" y1="430" x2="352" y2="322"/>   <!-- seat tube -->
      <line x1="352" y1="322" x2="412" y2="438"/>   <!-- seat stay to BB -->
      <line x1="352" y1="322" x2="528" y2="318"/>   <!-- top tube -->
      <line x1="528" y1="318" x2="540" y2="430"/>   <!-- fork -->
    </g>
    <!-- Chain -->
    <path d="M300 430 L412 438 M300 430 L412 438" stroke="#555" stroke-width="3" fill="none"/>
    <path d="M296 420 Q356 414 414 428 M296 440 Q356 448 414 448" stroke="#666" stroke-width="3" fill="none" stroke-dasharray="6 4">
      <animate attributeName="stroke-dashoffset" from="0" to="-20" dur="0.3s" repeatCount="indefinite"/>
    </path>

    <!-- Handlebar -->
    <path d="M528 318 L522 296 Q520 288 530 286 L552 282" stroke="#333" stroke-width="8" fill="none" stroke-linecap="round"/>
    <circle cx="552" cy="282" r="7" fill="#222"/>

    <!-- Seat -->
    <line x1="352" y1="322" x2="352" y2="308" stroke="#333" stroke-width="7"/>
    <path d="M330 306 Q352 296 378 306 Q372 314 352 314 Q336 314 330 306 Z" fill="#5a3b26"/>

    <!-- Crank + pedals -->
    <g>
      <circle cx="412" cy="438" r="14" fill="#333"/>
      <g stroke="#333" stroke-width="7" stroke-linecap="round">
        <line x1="412" y1="438" x2="412" y2="410"/>
        <line x1="412" y1="438" x2="412" y2="466"/>
        <rect x="398" y="404" width="28" height="8" rx="3" fill="#222" stroke="none"/>
        <rect x="398" y="464" width="28" height="8" rx="3" fill="#222" stroke="none"/>
        <animateTransform attributeName="transform" type="rotate" from="0 412 438" to="360 412 438" dur="1.2s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- ============ PELICAN ============ -->
    <!-- Tail -->
    <g>
      <path d="M312 268 Q286 258 268 268 Q286 276 312 280 Z" fill="#dfe6ec"/>
      <animateTransform attributeName="transform" type="rotate" values="-6 312 274;8 312 274;-6 312 274" dur="0.6s" repeatCount="indefinite"/>
    </g>

    <!-- Far leg (behind body) -->
    <g>
      <path d="M360 330 Q372 372 400 400" stroke="#e8b04b" stroke-width="11" fill="none" stroke-linecap="round" opacity="0.85">
        <animate attributeName="d" values="M360 330 Q372 372 400 400;M360 330 Q382 380 424 440;M360 330 Q372 372 400 400" dur="1.2s" repeatCount="indefinite"/>
      </path>
      <ellipse rx="15" ry="8" fill="#e8b04b" opacity="0.85">
        <animateMotion dur="1.2s" repeatCount="indefinite" path="M412 410 A28 28 0 1 1 412 466 A28 28 0 1 1 412 410" begin="-0.6s"/>
      </ellipse>
    </g>

    <!-- Body -->
    <ellipse cx="360" cy="290" rx="66" ry="52" fill="#ffffff"/>
    <ellipse cx="368" cy="302" rx="46" ry="34" fill="#f2f6f9"/>

    <!-- Neck -->
    <path d="M398 262 Q418 232 412 200 Q408 178 428 168" stroke="#ffffff" stroke-width="34" fill="none" stroke-linecap="round"/>

    <!-- Head -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-3 428 168;4 428 168;-3 428 168" dur="0.6s" repeatCount="indefinite"/>
      <circle cx="432" cy="160" r="26" fill="#ffffff"/>
      <!-- Crest feathers -->
      <path d="M412 142 Q400 128 408 120 Q414 132 422 138 Z" fill="#ffffff"/>
      <!-- Upper beak -->
      <path d="M452 150 Q516 146 566 158 Q516 166 452 166 Z" fill="url(#beakGrad)"/>
      <!-- Pouch -->
      <path d="M452 166 Q508 172 556 162 Q540 204 494 202 Q460 198 452 166 Z" fill="#ffb347">
        <animate attributeName="d" values="M452 166 Q508 172 556 162 Q540 204 494 202 Q460 198 452 166 Z;M452 166 Q508 172 556 162 Q544 212 492 208 Q460 200 452 166 Z;M452 166 Q508 172 556 162 Q540 204 494 202 Q460 198 452 166 Z" dur="1.2s" repeatCount="indefinite"/>
      </path>
      <path d="M452 166 Q508 172 556 162" stroke="#e07f2e" stroke-width="3" fill="none"/>
      <!-- Eye -->
      <circle cx="440" cy="152" r="5.5" fill="#222"/>
      <circle cx="442" cy="150" r="1.8" fill="#fff"/>
    </g>

    <!-- Wing (flapping) -->
    <g>
      <path d="M330 268 Q300 300 306 340 Q346 336 372 306 Q360 278 330 268 Z" fill="#e6edf3" stroke="#c9d5de" stroke-width="2"/>
      <path d="M318 288 Q310 312 316 330 M334 282 Q328 308 334 326" stroke="#c9d5de" stroke-width="2" fill="none"/>
      <animateTransform attributeName="transform" type="rotate" values="10 350 280;-22 350 280;10 350 280" dur="0.6s" repeatCount="indefinite"/>
    </g>

    <!-- Near leg -->
    <g>
      <path d="M348 334 Q360 380 396 408" stroke="#f5c05e" stroke-width="12" fill="none" stroke-linecap="round">
        <animate attributeName="d" values="M348 334 Q360 380 396 408;M348 334 Q368 386 424 446;M348 334 Q360 380 396 408" dur="1.2s" repeatCount="indefinite"/>
      </path>
      <ellipse rx="16" ry="9" fill="#f5c05e">
        <animateMotion dur="1.2s" repeatCount="indefinite" path="M412 410 A28 28 0 1 1 412 466 A28 28 0 1 1 412 410"/>
      </ellipse>
    </g>

    <!-- Wing tip reaching handlebar -->
    <path d="M404 268 Q470 262 548 280" stroke="#ffffff" stroke-width="16" fill="none" stroke-linecap="round">
      <animate attributeName="d" values="M404 268 Q470 262 548 280;M404 268 Q470 258 548 280;M404 268 Q470 262 548 280" dur="0.6s" repeatCount="indefinite"/>
    </path>
    <circle cx="550" cy="281" r="9" fill="#ffffff"/>
  </g>

  <!-- Speed lines -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.55">
    <line x1="120" y1="300" x2="200" y2="300">
      <animate attributeName="x1" values="120;40" dur="0.4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="200;120" dur="0.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0" dur="0.4s" repeatCount="indefinite"/>
    </line>
    <line x1="90" y1="360" x2="170" y2="360">
      <animate attributeName="x1" values="90;10" dur="0.5s" begin="-0.2s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="170;90" dur="0.5s" begin="-0.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0" dur="0.5s" begin="-0.2s" repeatCount="indefinite"/>
    </line>
  </g>
</svg>
