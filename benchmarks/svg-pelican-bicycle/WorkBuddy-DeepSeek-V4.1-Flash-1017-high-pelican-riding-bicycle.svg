<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" role="img" aria-labelledby="ttl desc">
  <title id="ttl">Pelican Riding a Bicycle</title>
  <desc id="desc">A white pelican with a long orange beak and pouch rides a teal bicycle along a road at sunset.</desc>

  <defs>
    <!-- 天空 / 落日 -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#171C3D"/>
      <stop offset="32%"  stop-color="#3A3160"/>
      <stop offset="55%"  stop-color="#7A4569"/>
      <stop offset="72%"  stop-color="#C4655F"/>
      <stop offset="85%"  stop-color="#EC9469"/>
      <stop offset="100%" stop-color="#F8CC93"/>
    </linearGradient>

    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FFF6D6"/>
      <stop offset="55%"  stop-color="#FFCB7E"/>
      <stop offset="100%" stop-color="#F59556"/>
    </radialGradient>

    <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#4A4364"/>
      <stop offset="100%" stop-color="#241F37"/>
    </linearGradient>

    <!-- 鹈鹕身体 -->
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%"   stop-color="#FFFEFB"/>
      <stop offset="50%"  stop-color="#FAF0E0"/>
      <stop offset="100%" stop-color="#DFCEB6"/>
    </linearGradient>

    <linearGradient id="wingGrad" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%"   stop-color="#FDF6EA"/>
      <stop offset="55%"  stop-color="#EFE1CC"/>
      <stop offset="100%" stop-color="#D6C3A9"/>
    </linearGradient>

    <!-- 喙 / 喉囊 -->
    <linearGradient id="beakGrad" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0%"   stop-color="#FFD976"/>
      <stop offset="55%"  stop-color="#F8B243"/>
      <stop offset="100%" stop-color="#E8872C"/>
    </linearGradient>

    <linearGradient id="pouchGrad" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0%"   stop-color="#FBC46B"/>
      <stop offset="45%"  stop-color="#F09B45"/>
      <stop offset="100%" stop-color="#D4682F"/>
    </linearGradient>

    <!-- 车架 -->
    <linearGradient id="frameGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#63E0CF"/>
      <stop offset="55%"  stop-color="#31B3A4"/>
      <stop offset="100%" stop-color="#1B7E76"/>
    </linearGradient>

    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#F2ECFA"/>
      <stop offset="100%" stop-color="#B0A6C4"/>
    </linearGradient>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="soft6" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>

    <!-- 单个车轮（原点在轮心） -->
    <g id="wheel">
      <circle r="82" fill="none" stroke="#221E2E" stroke-width="16"/>
      <circle r="82" fill="none" stroke="#3A3350" stroke-width="16" opacity="0.45"/>
      <circle r="73" fill="none" stroke="#E9E2F3" stroke-width="3.4" opacity="0.9"/>
      <g stroke="#C9C0DB" stroke-width="2" opacity="0.7">
        <line x1="0" y1="-72" x2="0" y2="72"/>
        <line x1="0" y1="-72" x2="0" y2="72" transform="rotate(30)"/>
        <line x1="0" y1="-72" x2="0" y2="72" transform="rotate(60)"/>
        <line x1="0" y1="-72" x2="0" y2="72" transform="rotate(90)"/>
        <line x1="0" y1="-72" x2="0" y2="72" transform="rotate(120)"/>
        <line x1="0" y1="-72" x2="0" y2="72" transform="rotate(150)"/>
      </g>
      <circle r="13" fill="#2E2A42" stroke="#DCD5EC" stroke-width="3"/>
      <circle r="4.5" fill="#DCD5EC"/>
    </g>
  </defs>

  <!-- ================= 背景 ================= -->
  <rect x="0" y="0" width="900" height="620" fill="url(#sky)"/>

  <!-- 太阳与光晕 -->
  <circle cx="722" cy="292" r="146" fill="#FFB874" opacity="0.2" filter="url(#soft)"/>
  <circle cx="722" cy="292" r="82" fill="url(#sunGrad)" opacity="0.92"/>

  <!-- 薄云 -->
  <g fill="#F6B98E" opacity="0.3">
    <path d="M110,168 c26,-14 58,-10 78,4 c22,-10 52,-6 66,6 c-14,8 -40,10 -58,6 c-20,8 -54,8 -72,0 c-10,-2 -16,-8 -14,-16 z"/>
    <path d="M596,222 c20,-12 46,-9 62,3 c18,-8 42,-5 54,5 c-12,7 -32,8 -46,5 c-16,7 -44,7 -58,0 c-9,-2 -14,-7 -12,-13 z"/>
  </g>

  <!-- 远山 -->
  <path d="M0,432 L0,398 C60,374 118,396 168,382 C220,368 262,394 320,386 C382,377 432,398 492,390 C552,382 604,400 664,392 C724,384 806,400 900,386 L900,432 Z"
        fill="#4A3F65" opacity="0.85"/>
  <path d="M0,432 L0,414 C72,398 132,416 196,408 C268,399 320,418 392,412 C468,406 520,422 596,414 C676,406 780,420 900,410 L900,432 Z"
        fill="#332C4E"/>

  <!-- 地面与公路 -->
  <rect x="0" y="430" width="900" height="190" fill="#211C33"/>
  <rect x="0" y="494" width="900" height="126" fill="url(#roadGrad)"/>
  <line x1="0" y1="494" x2="900" y2="494" stroke="#7B7099" stroke-width="3" opacity="0.75"/>
  <line x1="0" y1="586" x2="900" y2="586" stroke="#5A5178" stroke-width="5"
        stroke-dasharray="64 44" opacity="0.75"/>

  <!-- 速度线 -->
  <g stroke="#F7B98F" stroke-linecap="round" opacity="0.4">
    <line x1="34"  y1="300" x2="148" y2="300" stroke-width="4"/>
    <line x1="6"   y1="342" x2="92"  y2="342" stroke-width="3"/>
    <line x1="66"  y1="374" x2="144" y2="374" stroke-width="3"/>
    <line x1="118" y1="260" x2="194" y2="260" stroke-width="2.5"/>
  </g>

  <!-- 地面投影 -->
  <ellipse cx="452" cy="556" rx="252" ry="17" fill="#120F1E" opacity="0.5" filter="url(#soft6)"/>

  <!-- ================= 远侧：曲柄 + 腿 ================= -->
  <path d="M450,440 L478,402" stroke="#7F76A0" stroke-width="7" stroke-linecap="round"/>
  <rect x="466" y="396" width="26" height="9" rx="4" fill="#332F49"/>
  <path d="M422,320 C436,344 452,362 464,378 C472,388 476,394 480,398"
        fill="none" stroke="#B9612A" stroke-width="12" stroke-linecap="round"/>

  <!-- ================= 自行车 ================= -->
  <use href="#wheel" transform="translate(300,470)"/>
  <use href="#wheel" transform="translate(600,470)"/>

  <!-- 挡泥板 -->
  <path d="M235,405 A92,92 0 0 1 365,405" fill="none" stroke="#F6E3C4" stroke-width="8"
        stroke-linecap="round" opacity="0.95"/>
  <path d="M535,405 A92,92 0 0 1 665,405" fill="none" stroke="#F6E3C4" stroke-width="8"
        stroke-linecap="round" opacity="0.95"/>

  <!-- 链条 -->
  <g stroke="#9C93B4" stroke-width="3" fill="none" stroke-dasharray="5 3">
    <path d="M450,416 L300,459"/>
    <path d="M450,464 L300,481"/>
  </g>
  <circle cx="300" cy="470" r="11" fill="none" stroke="url(#metal)" stroke-width="4"/>

  <!-- 车架 -->
  <g stroke="url(#frameGrad)" stroke-width="10" stroke-linecap="round" fill="none">
    <path d="M450,440 L392,348"/>
    <path d="M392,348 L572,356"/>
    <path d="M450,440 L580,392"/>
    <path d="M572,356 L580,392"/>
    <path d="M450,440 L300,470"/>
    <path d="M392,348 L300,470"/>
  </g>
  <path d="M580,392 C588,420 594,446 600,470" fill="none" stroke="url(#frameGrad)"
        stroke-width="9" stroke-linecap="round"/>
  <path d="M584,394 C592,420 598,446 604,468" fill="none" stroke="#1B7E76"
        stroke-width="4" stroke-linecap="round" opacity="0.55"/>

  <!-- 五通 / 牙盘 -->
  <circle cx="450" cy="440" r="24" fill="#2E2A42" stroke="url(#metal)" stroke-width="4"/>
  <circle cx="450" cy="440" r="9"  fill="#DCD5EC" opacity="0.85"/>
  <path d="M450,440 L424,478" stroke="#CFC7DE" stroke-width="7" stroke-linecap="round"/>
  <circle cx="450" cy="440" r="6" fill="#F1EBFA"/>

  <!-- 车座与座管 -->
  <path d="M392,352 L390,340" stroke="#C9C0DB" stroke-width="6" stroke-linecap="round"/>
  <path d="M356,346 C368,332 398,328 420,336 C430,340 430,350 418,352 L366,354 C356,354 352,350 356,346 Z"
        fill="#2B2740"/>
  <path d="M360,346 C372,337 396,334 414,340" fill="none" stroke="#57507A" stroke-width="2.5" opacity="0.8"/>

  <!-- 车把 -->
  <path d="M572,356 L586,340" stroke="#CFC7DE" stroke-width="8" stroke-linecap="round"/>
  <path d="M586,340 C608,330 630,338 628,358" fill="none" stroke="#CFC7DE"
        stroke-width="8" stroke-linecap="round"/>
  <circle cx="628" cy="358" r="8" fill="#2B2740"/>

  <!-- ================= 鹈鹕 ================= -->
  <!-- 近侧腿（踩踏板） -->
  <path d="M414,300 C402,336 392,358 390,382 C390,408 404,442 420,460"
        fill="none" stroke="#E89048" stroke-width="11" stroke-linecap="round"/>
  <path d="M414,300 C402,336 392,358 390,382 C390,408 404,442 420,460"
        fill="none" stroke="#F7B478" stroke-width="3.6" stroke-linecap="round" opacity="0.55"/>
  <circle cx="392" cy="382" r="6" fill="#DC7C36"/>
  <!-- 蹼足 -->
  <path d="M407,447 C417,441 434,446 439,457 C433,467 409,467 403,459 Z" fill="#E89048"/>
  <path d="M414,449 L416,464 M426,448 L428,464" stroke="#C96F2C" stroke-width="2"/>
  <rect x="406" y="470" width="28" height="9" rx="4" fill="#3A3550"/>

  <!-- 尾羽 -->
  <path d="M314,290 C286,300 256,296 230,282 C238,298 256,310 276,316
           C256,314 242,318 232,326 C256,336 292,334 320,316 Z"
        fill="#EADCC7"/>
  <path d="M238,286 L272,306 M244,318 L278,324" stroke="#CFBCA0" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 身体 -->
  <ellipse cx="407" cy="280" rx="93" ry="55" transform="rotate(-12 407 280)" fill="url(#bodyGrad)"/>
  <path d="M322,312 C350,334 420,342 468,312" fill="none" stroke="#DCCAB2" stroke-width="3" opacity="0.5"/>

  <!-- 折叠的翅膀（沿背脊） -->
  <path d="M474,244 C448,220 406,216 372,228 C346,238 330,252 326,268
           C350,256 380,258 402,266 C432,276 458,266 476,254 Z"
        fill="#EFE1CC" opacity="0.95"/>
  <g fill="none" stroke="#CDB89C" stroke-width="2.2" opacity="0.7">
    <path d="M464,246 C440,234 408,232 384,238"/>
    <path d="M456,258 C434,248 404,248 378,256"/>
  </g>

  <!-- 颈部 -->
  <path d="M452,258 C466,206 480,174 508,148 L544,158 C520,194 510,226 508,274 Z"
        fill="url(#bodyGrad)"/>
  <path d="M462,254 C474,212 488,186 512,162" fill="none" stroke="#E7D8C3" stroke-width="3" opacity="0.65"/>

  <!-- 头 -->
  <ellipse cx="548" cy="125" rx="44" ry="37" fill="url(#bodyGrad)"/>
  <path d="M514,96 C504,89 495,91 491,98 M516,110 C503,106 495,108 489,115"
        fill="none" stroke="#EFE2CD" stroke-width="3" stroke-linecap="round"/>

  <!-- 喉囊（先画，喙压在上面） -->
  <path d="M571,118 C572,168 592,202 628,198 C662,194 682,170 692,152 C656,140 615,127 571,118 Z"
        fill="url(#pouchGrad)" stroke="#C25E2E" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M584,142 C590,170 604,184 624,186" fill="none" stroke="#C9662F" stroke-width="2" opacity="0.4"/>

  <!-- 上喙 -->
  <path d="M573,101 C617,101 664,120 702,140 L706,151 C702,157 696,155 692,150
           C658,138 616,126 571,115 Z"
        fill="url(#beakGrad)" stroke="#C97A2E" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M579,108 C619,108 656,124 690,143" fill="none" stroke="#FFE0A0" stroke-width="2.5" opacity="0.75"/>
  <ellipse cx="589" cy="110" rx="4.5" ry="2.8" fill="#B96522" opacity="0.8"/>

  <!-- 眼睛 -->
  <circle cx="553" cy="112" r="6.8" fill="#2A2338"/>
  <circle cx="555" cy="110" r="2.3" fill="#FFFFFF" opacity="0.95"/>
  <path d="M541,99 C549,94 559,95 565,101" fill="none" stroke="#D9C7AE" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 围巾：绕颈 + 迎风飘带 -->
  <path d="M458,218 C464,206 469,195 472,184 L 530,181 C 526,194 522,206 518,220 Z" fill="#E0573D"/>
  <path d="M472,184 L 530,181" stroke="#B93F2A" stroke-width="3" opacity="0.4"/>
  <path d="M468,202 C442,190 414,192 390,184 C366,176 344,180 326,190
           C310,199 298,200 288,196 L 284,206 L 276,200 L 282,216
           C296,218 310,216 326,208 C344,198 366,194 390,202
           C414,210 444,216 466,222 Z" fill="#E0573D"/>
  <path d="M424,196 C400,192 376,194 356,200" fill="none" stroke="#B93F2A" stroke-width="3" opacity="0.35"/>

  <!-- 前伸的翅膀（搭在车把上） -->
  <path d="M492,232 C530,258 574,298 616,332 C624,338 628,347 622,352
           C614,356 606,350 600,344 C592,352 580,347 573,337
           C563,345 551,339 545,327 C531,333 517,321 508,307
           C495,300 482,288 470,274 Z"
        fill="url(#wingGrad)" stroke="#D3C0A6" stroke-width="2.5" stroke-linejoin="round"/>
  <g fill="none" stroke="#CDB89C" stroke-width="2.2" opacity="0.8">
    <path d="M500,254 C540,280 578,310 606,332"/>
    <path d="M512,274 C550,298 582,320 606,338"/>
    <path d="M524,292 C556,312 584,330 600,344"/>
    <path d="M538,308 C562,324 580,336 592,346"/>
  </g>
  <!-- 翼尖覆羽（握住车把） -->
  <path d="M598,334 C612,338 622,344 624,351 C618,357 606,353 594,346 Z" fill="#E3D2B9"/>
  <g fill="none" stroke="#BFA98C" stroke-width="2.4" stroke-linecap="round" opacity="0.9">
    <path d="M614,340 C620,346 622,352 620,357"/>
    <path d="M606,344 C612,350 614,356 612,360"/>
  </g>

  <!-- 落日轮廓光 -->
  <g fill="none" stroke="#FFD9A8" stroke-linecap="round" opacity="0.55">
    <path d="M580,104 C588,116 590,132 584,142" stroke-width="3.2"/>
    <path d="M470,300 C492,318 522,326 548,322" stroke-width="3"/>
  </g>

  <!-- 远处小飞鸟 -->
  <g stroke="#F0C7A5" fill="none" stroke-width="2.5" stroke-linecap="round" opacity="0.6">
    <path d="M150,120 q10,-9 20,0 q10,-9 20,0"/>
  </g>
</svg>
