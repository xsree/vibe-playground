<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Pelican riding a bicycle</title>
  <desc id="desc">A hand-written vector illustration of a white pelican pedaling a teal road bicycle, with detailed wheels, frame, beak pouch, legs, feathers, and a sunny coastal road background.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dff5ff"/>
      <stop offset="0.58" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#fff3d2"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cad2da"/>
      <stop offset="1" stop-color="#939daa"/>
    </linearGradient>
    <linearGradient id="framePaint" x1="420" y1="430" x2="1090" y2="730" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1fbec8"/>
      <stop offset="0.5" stop-color="#1589c7"/>
      <stop offset="1" stop-color="#2454a6"/>
    </linearGradient>
    <linearGradient id="feather" x1="520" y1="300" x2="890" y2="650" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.56" stop-color="#f3f6f2"/>
      <stop offset="1" stop-color="#d7ddd3"/>
    </linearGradient>
    <linearGradient id="wing" x1="580" y1="400" x2="850" y2="635" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f9faf8"/>
      <stop offset="1" stop-color="#bfc8bf"/>
    </linearGradient>
    <linearGradient id="beak" x1="815" y1="200" x2="1185" y2="268" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd35f"/>
      <stop offset="0.55" stop-color="#ffae3f"/>
      <stop offset="1" stop-color="#ee7927"/>
    </linearGradient>
    <linearGradient id="pouch" x1="835" y1="250" x2="1125" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd38e" stop-opacity="0.94"/>
      <stop offset="0.62" stop-color="#f7a66c" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#e56d4c" stop-opacity="0.84"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff8b7"/>
      <stop offset="1" stop-color="#ffd46b" stop-opacity="0.1"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#2a3440" flood-opacity="0.22"/>
    </filter>
    <filter id="lightShadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#233142" flood-opacity="0.16"/>
    </filter>
    <style>
      .outline{stroke:#243244;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
      .fine{stroke:#44546a;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .frame{stroke:url(#framePaint);stroke-width:18;stroke-linecap:round;stroke-linejoin:round;fill:none}
      .frame-hi{stroke:#80ecff;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;fill:none;opacity:.72}
      .metal{stroke:#d8e3ec;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;fill:none}
      .spoke{stroke:#b8c7d4;stroke-width:2.2;stroke-linecap:round;opacity:.82}
      .tire{fill:none;stroke:#202936;stroke-width:28}
      .rim{fill:none;stroke:#e8f0f6;stroke-width:8}
      .hub{fill:#f9fbff;stroke:#263449;stroke-width:6}
      .orange-stroke{stroke:#f0872a;stroke-width:17;stroke-linecap:round;stroke-linejoin:round;fill:none}
      .toe{fill:#f6a236;stroke:#9b4f21;stroke-width:4;stroke-linejoin:round}
    </style>
  </defs>

