<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t d">
  <title id="t">Pelican riding a bicycle</title>
  <desc id="d">A white pelican with a long orange pouched beak pedals a coral bicycle along a country road, wings holding the handlebar.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ec8e8"/>
      <stop offset="0.55" stop-color="#bfe6f7"/>
      <stop offset="1" stop-color="#eaf7ff"/>
    </linearGradient>
  </defs>

  <!-- ======== background ======== -->
  <rect x="0" y="0" width="800" height="600" fill="url(#sky)"/>

  <!-- sun -->
  <g stroke="#ffd93d" stroke-width="5" stroke-linecap="round" opacity="0.85">
    <line x1="726" y1="90" x2="738" y2="90"/>
    <line x1="712.5" y1="57.5" x2="721" y2="49"/>
    <line x1="680" y1="44" x2="680" y2="32"/>
    <line x1="647.5" y1="57.5" x2="639" y2="49"/>
    <line x1="634" y1="90" x2="622" y2="90"/>
    <line x1="647.5" y1="122.5" x2="639" y2="131"/>
    <line x1="680" y1="136" x2="680" y2="148"/>
    <line x1="712.5" y1="122.5" x2="721" y2="131"/>
  </g>
  <circle cx="680" cy="90" r="34" fill="#ffd93d" opacity="0.95"/>

  <!-- clouds -->
  <g fill="#ffffff" opacity="0.92">
    <ellipse cx="150" cy="100" rx="60" ry="20"/>
    <ellipse cx="115" cy="92" rx="30" ry="18"/>
    <ellipse cx="150" cy="84" rx="34" ry="20"/>
    <ellipse cx="188" cy="92" rx="28" ry="16"/>
  </g>
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="420" cy="74" rx="46" ry="16"/>
    <ellipse cx="392" cy="66" rx="24" ry="14"/>
    <ellipse cx="446" cy="64" rx="26" ry="15"/>
  </g>
  <g fill="#ffffff" opacity="0.8">
    <ellipse cx="620" cy="190" rx="34" ry="12"/>
    <ellipse cx="640" cy="182" rx="20" ry="11"/>
  </g>

  <!-- distant birds -->
  <path d="M 236,142 q 7,-8 14,0 q 7,-8 14,0" fill="none" stroke="#5b7c8c" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 292,112 q 6,-7 12,0 q 6,-7 12,0" fill="none" stroke="#5b7c8c" stroke-width="2.2" stroke-linecap="round"/>

  <!-- hills -->
  <path d="M 0,510 C 120,462 240,478 360,506 C 480,532 620,470 800,500 L 800,545 L 0,545 Z" fill="#c4e3ae"/>
  <path d="M 0,524 C 160,498 320,530 480,518 C 640,506 720,518 800,510 L 800,545 L 0,545 Z" fill="#a9d48f"/>

  <!-- road -->
  <rect x="0" y="530" width="800" height="70" fill="#6f7782"/>
  <line x1="0" y1="530" x2="800" y2="530" stroke="#59616b" stroke-width="3"/>
  <line x1="0" y1="566" x2="800" y2="566" stroke="#f4f1de" stroke-width="6" stroke-dasharray="34 26"/>

  <!-- grass tufts -->
  <g stroke="#6ea856" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M 60,530 q 2,-12 6,-16 M 68,530 q 0,-10 -4,-15"/>
    <path d="M 132,530 q 2,-12 6,-16 M 140,530 q 0,-10 -4,-15"/>
    <path d="M 622,530 q 2,-12 6,-16 M 630,530 q 0,-10 -4,-15"/>
    <path d="M 726,530 q 2,-12 6,-16 M 734,530 q 0,-10 -4,-15"/>
  </g>

  <!-- ground shadow -->
  <ellipse cx="400" cy="532" rx="215" ry="10" fill="#000000" opacity="0.12"/>

  <!-- speed lines + dust -->
  <g stroke="#ffffff" stroke-linecap="round" fill="none">
    <line x1="60" y1="384" x2="208" y2="384" stroke-width="7" opacity="0.8"/>
    <line x1="40" y1="420" x2="196" y2="420" stroke-width="9" opacity="0.55"/>
    <line x1="72" y1="458" x2="214" y2="458" stroke-width="6" opacity="0.7"/>
  </g>
  <g fill="#ffffff" opacity="0.55">
    <circle cx="185" cy="505" r="7"/>
    <circle cx="160" cy="515" r="10"/>
    <circle cx="138" cy="508" r="6"/>
  </g>

  <!-- ======== far leg (behind frame) ======== -->
  <path d="M 386,296 C 384,330 381,370 379,404" fill="none" stroke="#e8892a" stroke-width="8" stroke-linecap="round"/>
  <path d="M 368,404 C 373,398 383,396 391,400 C 397,403 399,407 398,410 L 369,412 Z" fill="#e8892a"/>

  <!-- ======== bicycle ======== -->
  <g stroke-linecap="round" fill="none">
    <!-- rear wheel -->
    <circle cx="280" cy="450" r="78" stroke="#2a2a33" stroke-width="15"/>
    <circle cx="280" cy="450" r="62" stroke="#dfe7ee" stroke-width="5"/>
    <g stroke="#c3ccd6" stroke-width="2.5">
      <line x1="289" y1="450" x2="340" y2="450"/>
      <line x1="287.3" y1="455.3" x2="328.5" y2="485.3"/>
      <line x1="282.8" y1="458.6" x2="298.5" y2="507.1"/>
      <line x1="277.2" y1="458.6" x2="261.5" y2="507.1"/>
      <line x1="272.7" y1="455.3" x2="231.5" y2="485.3"/>
      <line x1="271" y1="450" x2="220" y2="450"/>
      <line x1="272.7" y1="444.7" x2="231.5" y2="414.7"/>
      <line x1="277.2" y1="441.4" x2="261.5" y2="392.9"/>
      <line x1="282.8" y1="441.4" x2="298.5" y2="392.9"/>
      <line x1="287.3" y1="444.7" x2="328.5" y2="414.7"/>
    </g>
    <!-- front wheel -->
    <circle cx="520" cy="450" r="78" stroke="#2a2a33" stroke-width="15"/>
    <circle cx="520" cy="450" r="62" stroke="#dfe7ee" stroke-width="5"/>
    <g stroke="#c3ccd6" stroke-width="2.5">
      <line x1="529" y1="450" x2="580" y2="450"/>
      <line x1="527.3" y1="455.3" x2="568.5" y2="485.3"/>
      <line x1="522.8" y1="458.6" x2="538.5" y2="507.1"/>
      <line x1="517.2" y1="458.6" x2="501.5" y2="507.1"/>
      <line x1="512.7" y1="455.3" x2="471.5" y2="485.3"/>
      <line x1="511" y1="450" x2="460" y2="450"/>
      <line x1="512.7" y1="444.7" x2="471.5" y2="414.7"/>
      <line x1="517.2" y1="441.4" x2="501.5" y2="392.9"/>
      <line x1="522.8" y1="441.4" x2="538.5" y2="392.9"/>
      <line x1="527.3" y1="444.7" x2="568.5" y2="414.7"/>
    </g>
    <!-- hubs -->
    <circle cx="280" cy="450" r="10" fill="#ff6b6b" stroke="#d64550" stroke-width="2"/>
    <circle cx="520" cy="450" r="10" fill="#ff6b6b" stroke="#d64550" stroke-width="2"/>
    <!-- chain -->
    <g stroke="#55555f" stroke-width="3.5">
      <line x1="382" y1="438" x2="282" y2="444"/>
      <line x1="380" y1="466" x2="282" y2="456"/>
    </g>
    <circle cx="280" cy="450" r="9" stroke="#55555f" stroke-width="3"/>
    <!-- frame -->
    <g stroke="#ff6b6b">
      <line x1="398" y1="452" x2="280" y2="450" stroke-width="7"/>
      <line x1="280" y1="450" x2="372" y2="312" stroke-width="7"/>
      <line x1="398" y1="452" x2="370" y2="308" stroke-width="9"/>
      <line x1="518" y1="296" x2="374" y2="310" stroke-width="9"/>
      <line x1="504" y1="342" x2="398" y2="452" stroke-width="10"/>
      <line x1="522" y1="288" x2="500" y2="348" stroke-width="11"/>
      <line x1="500" y1="350" x2="520" y2="450" stroke-width="8"/>
    </g>
    <!-- saddle -->
    <path d="M 342,298 Q 368,286 396,296 Q 398,304 388,306 L 350,308 Q 340,306 342,298 Z" fill="#33333d" stroke="none"/>
    <!-- stem + handlebar -->
    <line x1="522" y1="288" x2="534" y2="254" stroke="#ff6b6b" stroke-width="9"/>
    <path d="M 534,254 Q 537,245 528,243 L 494,239" stroke="#4a4a55" stroke-width="7"/>
    <line x1="500" y1="240" x2="486" y2="239" stroke="#33333d" stroke-width="10"/>
    <!-- chainring + cranks + pedals -->
    <circle cx="398" cy="452" r="20" stroke="#3a3a44" stroke-width="6"/>
    <circle cx="398" cy="452" r="5" fill="#3a3a44" stroke="none"/>
    <line x1="398" y1="452" x2="418" y2="484" stroke="#3a3a44" stroke-width="7"/>
    <line x1="398" y1="452" x2="378" y2="420" stroke="#3a3a44" stroke-width="7"/>
    <rect x="406" y="478" width="26" height="10" rx="4" fill="#33333d" stroke="none"/>
    <rect x="364" y="414" width="26" height="10" rx="4" fill="#33333d" stroke="none"/>
  </g>

  <!-- ======== near leg + foot ======== -->
  <path d="M 406,298 C 410,340 414,420 416,470" fill="none" stroke="#f59e2c" stroke-width="9" stroke-linecap="round"/>
  <path d="M 410,470 C 416,462 428,460 438,466 C 445,470 448,474 447,478 L 411,479 Z" fill="#f59e2c"/>
  <g stroke="#d97b1e" stroke-width="1.5" stroke-linecap="round">
    <line x1="424" y1="464" x2="425" y2="478"/>
    <line x1="434" y1="466" x2="434" y2="478"/>
  </g>

  <!-- ======== far wing reaching the handlebar ======== -->
  <path d="M 436,196 C 452,192 464,198 474,210 C 482,220 488,230 493,239 L 487,243 L 485,236 L 479,241 L 477,233 L 471,237 C 462,226 452,216 440,208 C 438,204 436,200 436,196 Z" fill="#ffffff" stroke="#d7e0e8" stroke-width="2"/>
  <g stroke="#cdd8e0" stroke-width="1.8" stroke-linecap="round">
    <line x1="488" y1="236" x2="476" y2="220"/>
    <line x1="480" y1="234" x2="466" y2="214"/>
  </g>

  <!-- ======== pelican body / neck / head ======== -->
  <path d="M 298,254
           C 295,233 306,213 322,202
           C 340,190 360,183 382,181
           C 404,179 424,183 440,192
           C 452,180 462,166 472,152
           C 477,133 488,120 501,120
           C 514,120 522,128 522,139
           C 522,145 520,150 516,153
           C 509,160 499,163 490,161
           C 478,168 467,180 461,193
           C 459,214 455,240 444,260
           C 432,282 408,296 384,300
           C 366,303 350,300 338,292
           C 320,281 306,269 298,254 Z"
        fill="#ffffff" stroke="#d7e0e8" stroke-width="2.5"/>
  <!-- tail feather hints -->
  <g stroke="#d5dee6" stroke-width="2" stroke-linecap="round">
    <line x1="300" y1="252" x2="314" y2="240"/>
    <line x1="300" y1="256" x2="316" y2="250"/>
  </g>

  <!-- folded near wing -->
  <path d="M 404,196
           C 382,196 360,204 344,220
           C 328,236 318,254 312,270
           L 320,274 L 310,278 L 318,284 L 308,288
           C 322,296 344,300 366,294
           C 392,286 408,268 414,244
           C 419,224 416,206 404,196 Z"
        fill="#f2f6f9" stroke="#d7e0e8" stroke-width="2"/>
  <g stroke="#d5dee6" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M 398,212 C 374,216 354,228 342,246"/>
    <path d="M 402,232 C 382,236 364,248 352,264"/>
    <path d="M 396,254 C 380,260 366,270 356,282"/>
  </g>

  <!-- ======== beak + pouch + eye ======== -->
  <!-- pouch -->
  <path d="M 519,147
           C 550,154 584,160 611,161
           C 604,186 574,204 542,199
           C 522,195 512,180 512,164
           C 512,156 515,150 519,147 Z"
        fill="#ff8c42" stroke="#e8712a" stroke-width="2"/>
  <path d="M 522,156 C 548,166 578,171 602,169" fill="none" stroke="#e8712a" stroke-width="1.6" opacity="0.75"/>
  <!-- upper mandible -->
  <path d="M 517,131 C 546,133 580,145 610,157 L 612,161 C 584,158 550,150 519,147 Z" fill="#ffa62b" stroke="#e8892a" stroke-width="1.5"/>
  <path d="M 543,139 q 6,2 10,5" fill="none" stroke="#d97b1e" stroke-width="2" stroke-linecap="round"/>
  <!-- eye -->
  <circle cx="502" cy="137" r="5" fill="#1d2b36"/>
  <circle cx="504" cy="135" r="1.7" fill="#ffffff"/>
  <path d="M 493,127 Q 501,124 509,127" fill="none" stroke="#b9c6cf" stroke-width="2" stroke-linecap="round"/>
</svg>
