<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Pelican Riding a Bicycle</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="100%" stop-color="#E0F0FF"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7CB342"/>
      <stop offset="100%" stop-color="#558B2F"/>
    </linearGradient>
  </defs>

  <!-- Background sky -->
  <rect width="800" height="480" fill="url(#sky)"/>
  <!-- Ground -->
  <rect y="480" width="800" height="120" fill="url(#ground)"/>
  <!-- Road -->
  <rect y="490" width="800" height="40" rx="2" fill="#555"/>
  <line x1="0" y1="510" x2="800" y2="510" stroke="#FFD54F" stroke-width="2" stroke-dasharray="20,15"/>

  <!-- Sun -->
  <circle cx="680" cy="80" r="45" fill="#FDD835" opacity="0.9"/>
  <!-- Sun rays -->
  <g stroke="#FDD835" stroke-width="3" opacity="0.5">
    <line x1="680" y1="20" x2="680" y2="5"/>
    <line x1="680" y1="140" x2="680" y2="155"/>
    <line x1="620" y1="80" x2="605" y2="80"/>
    <line x1="740" y1="80" x2="755" y2="80"/>
    <line x1="638" y1="38" x2="627" y2="27"/>
    <line x1="722" y1="122" x2="733" y2="133"/>
    <line x1="722" y1="38" x2="733" y2="27"/>
    <line x1="638" y1="122" x2="627" y2="133"/>
  </g>

  <!-- Clouds -->
  <g fill="white" opacity="0.8">
    <ellipse cx="150" cy="80" rx="60" ry="25"/>
    <ellipse cx="190" cy="70" rx="40" ry="20"/>
    <ellipse cx="120" cy="75" rx="35" ry="18"/>
    <ellipse cx="500" cy="50" rx="50" ry="20"/>
    <ellipse cx="535" cy="42" rx="35" ry="16"/>
    <ellipse cx="470" cy="45" rx="30" ry="15"/>
  </g>

  <!-- ========== BICYCLE ========== -->
  <g id="bicycle">
    <!-- Rear wheel -->
    <circle cx="310" cy="490" r="55" fill="none" stroke="#333" stroke-width="4"/>
    <circle cx="310" cy="490" r="3" fill="#333"/>
    <!-- Rear spokes -->
    <g stroke="#999" stroke-width="1.2">
      <line x1="310" y1="435" x2="310" y2="545"/>
      <line x1="255" y1="490" x2="365" y2="490"/>
      <line x1="271" y1="451" x2="349" y2="529"/>
      <line x1="349" y1="451" x2="271" y2="529"/>
    </g>
    <!-- Rear tire tread hint -->
    <circle cx="310" cy="490" r="55" fill="none" stroke="#222" stroke-width="6" opacity="0.3"/>

    <!-- Front wheel -->
    <circle cx="520" cy="490" r="55" fill="none" stroke="#333" stroke-width="4"/>
    <circle cx="520" cy="490" r="3" fill="#333"/>
    <!-- Front spokes -->
    <g stroke="#999" stroke-width="1.2">
      <line x1="520" y1="435" x2="520" y2="545"/>
      <line x1="465" y1="490" x2="575" y2="490"/>
      <line x1="481" y1="451" x2="559" y2="529"/>
      <line x1="559" y1="451" x2="481" y2="529"/>
    </g>
    <circle cx="520" cy="490" r="55" fill="none" stroke="#222" stroke-width="6" opacity="0.3"/>

    <!-- Frame -->
    <g stroke="#E53935" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Bottom bracket to seat tube -->
      <line x1="400" y1="470" x2="380" y2="390"/>
      <!-- Bottom bracket to rear axle (chain stay) -->
      <line x1="400" y1="470" x2="310" y2="490"/>
      <!-- Seat tube to rear axle (seat stay) -->
      <line x1="380" y1="390" x2="310" y2="490"/>
      <!-- Bottom bracket to head tube bottom (down tube) -->
      <line x1="400" y1="470" x2="490" y2="400"/>
      <!-- Seat tube top to head tube top (top tube) -->
      <line x1="380" y1="390" x2="490" y2="390"/>
      <!-- Head tube -->
      <line x1="490" y1="390" x2="490" y2="400"/>
      <!-- Fork to front axle -->
      <line x1="490" y1="400" x2="520" y2="490"/>
    </g>

    <!-- Handlebar stem -->
    <line x1="490" y1="390" x2="500" y2="360" stroke="#333" stroke-width="4" stroke-linecap="round"/>
    <!-- Handlebars -->
    <path d="M 480 355 Q 500 345 520 360" fill="none" stroke="#333" stroke-width="5" stroke-linecap="round"/>
    <!-- Handlebar grips -->
    <circle cx="480" cy="355" r="4" fill="#795548"/>
    <circle cx="520" cy="360" r="4" fill="#795548"/>

    <!-- Seat post -->
    <line x1="380" y1="390" x2="375" y2="370" stroke="#333" stroke-width="4" stroke-linecap="round"/>
    <!-- Seat / Saddle -->
    <ellipse cx="375" cy="365" rx="22" ry="7" fill="#4E342E"/>
    <ellipse cx="375" cy="365" rx="20" ry="5" fill="#5D4037"/>

    <!-- Pedal crank -->
    <circle cx="400" cy="470" r="8" fill="#666" stroke="#444" stroke-width="2"/>
    <!-- Crank arm -->
    <line x1="400" y1="470" x2="385" y2="490" stroke="#555" stroke-width="4" stroke-linecap="round"/>
    <!-- Pedal -->
    <rect x="377" y="487" width="16" height="6" rx="2" fill="#777" stroke="#555" stroke-width="1"/>

    <!-- Chain (simplified) -->
    <path d="M 400 478 Q 350 510 310 497" fill="none" stroke="#444" stroke-width="2" stroke-dasharray="3,2"/>
  </g>

  <!-- ========== PELICAN ========== -->
  <g id="pelican">
    <!-- Tail feathers -->
    <path d="M 330 350 Q 300 340 280 360 Q 290 345 310 345 Q 295 350 285 370" fill="#E8DCC8" stroke="#BDB09A" stroke-width="1"/>
    <path d="M 325 355 Q 295 350 278 365" fill="none" stroke="#BDB09A" stroke-width="2"/>

    <!-- Body -->
    <ellipse cx="380" cy="350" rx="65" ry="40" fill="#F5F0E6"/>
    <ellipse cx="380" cy="355" rx="60" ry="35" fill="#FFFDF5"/>
    <!-- Belly highlight -->
    <ellipse cx="385" cy="365" rx="40" ry="20" fill="white" opacity="0.5"/>

    <!-- Wing -->
    <path d="M 350 330 Q 370 310 410 315 Q 430 318 440 330 Q 420 325 395 328 Q 370 332 350 340 Z" fill="#D7CFC0" stroke="#BDB09A" stroke-width="1"/>
    <!-- Wing detail lines -->
    <path d="M 360 335 Q 385 322 420 325" fill="none" stroke="#C5B9A5" stroke-width="1"/>
    <path d="M 365 338 Q 390 328 425 328" fill="none" stroke="#C5B9A5" stroke-width="0.8"/>

    <!-- Neck -->
    <path d="M 420 340 Q 440 320 450 290 Q 455 270 460 250 Q 462 240 465 230" fill="#F5F0E6" stroke="#E8DCC8" stroke-width="2"/>
    <!-- Neck front contour -->
    <path d="M 430 345 Q 445 330 453 300 Q 458 275 462 255 Q 464 245 468 235" fill="none" stroke="#E8DCC8" stroke-width="1.5"/>

    <!-- Head -->
    <ellipse cx="466" cy="218" rx="22" ry="18" fill="#F5F0E6"/>
    <ellipse cx="468" cy="216" rx="20" ry="16" fill="#FFFDF5"/>

    <!-- Eye -->
    <circle cx="475" cy="212" r="5" fill="white"/>
    <circle cx="476" cy="212" r="3.5" fill="#1A1A1A"/>
    <circle cx="477.5" cy="210.5" r="1.2" fill="white"/>

    <!-- Top of head / crest -->
    <path d="M 455 205 Q 460 195 470 200" fill="#F5F0E6" stroke="#E8DCC8" stroke-width="1"/>

    <!-- Beak - upper mandible -->
    <path d="M 488 215 L 555 210 Q 558 212 555 215 L 490 220 Z" fill="#F4A42B" stroke="#E8941E" stroke-width="1"/>
    <!-- Beak - hook at tip -->
    <path d="M 555 210 Q 560 212 558 217 Q 556 215 555 215" fill="#E8941E"/>
    <!-- Beak ridge line -->
    <line x1="490" y1="217" x2="553" y2="212" stroke="#D4880A" stroke-width="0.8"/>

    <!-- Pouch / lower mandible -->
    <path d="M 488 220 Q 500 225 530 222 Q 545 220 555 215 Q 540 240 510 245 Q 495 243 488 235 Z" fill="#F4B94B" opacity="0.7" stroke="#E8941E" stroke-width="1"/>
    <!-- Pouch volume hint -->
    <path d="M 495 230 Q 510 238 530 232" fill="none" stroke="#E8941E" stroke-width="0.8" opacity="0.6"/>

    <!-- Legs -->
    <!-- Left leg (on pedal) -->
    <path d="M 370 380 Q 375 420 385 450 Q 387 470 385 488" fill="none" stroke="#E8941E" stroke-width="4" stroke-linecap="round"/>
    <!-- Right leg (resting on frame) -->
    <path d="M 395 380 Q 405 410 410 440 Q 412 455 408 465" fill="none" stroke="#E8941E" stroke-width="4" stroke-linecap="round"/>

    <!-- Feet -->
    <!-- Left foot on pedal -->
    <path d="M 385 488 L 378 496 M 385 488 L 385 497 M 385 488 L 392 496" stroke="#E8941E" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Right foot -->
    <path d="M 408 465 L 401 473 M 408 465 L 408 474 M 408 465 L 415 473" stroke="#E8941E" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Wing "hand" gripping handlebar -->
    <path d="M 440 330 Q 460 340 480 350" fill="none" stroke="#D7CFC0" stroke-width="3" stroke-linecap="round"/>
    <circle cx="482" cy="352" r="5" fill="#D7CFC0" stroke="#BDB09A" stroke-width="1"/>
  </g>

  <!-- Small motion lines behind bicycle -->
  <g stroke="#999" stroke-width="1.5" opacity="0.4">
    <line x1="230" y1="480" x2="250" y2="480"/>
    <line x1="225" y1="490" x2="248" y2="490"/>
    <line x1="230" y1="500" x2="250" y2="500"/>
  </g>

  <!-- Ground shadow under wheels -->
  <ellipse cx="310" cy="545" rx="50" ry="6" fill="#333" opacity="0.15"/>
  <ellipse cx="520" cy="545" rx="50" ry="6" fill="#333" opacity="0.15"/>
</svg>
