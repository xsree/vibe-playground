<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="500" height="350">
  <defs>
    <radialGradient id="sky" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="100%" stop-color="#4A90D9"/>
    </radialGradient>
    <radialGradient id="grass" cx="50%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#7CC47C"/>
      <stop offset="100%" stop-color="#4A8C3F"/>
    </radialGradient>
  </defs>
  <!-- Sky -->
  <rect width="500" height="350" fill="url(#sky)"/>
  <!-- Ground -->
  <rect x="0" y="260" width="500" height="90" fill="url(#grass)"/>
  <!-- Sun -->
  <circle cx="420" cy="60" r="35" fill="#FFD700" opacity="0.9"/>
  <!-- Clouds -->
  <ellipse cx="100" cy="50" rx="40" ry="20" fill="white" opacity="0.7"/>
  <ellipse cx="130" cy="45" rx="30" ry="18" fill="white" opacity="0.6"/>
  <ellipse cx="280" cy="80" rx="35" ry="16" fill="white" opacity="0.5"/>
  <ellipse cx="310" cy="75" rx="25" ry="14" fill="white" opacity="0.4"/>

  <!-- Bicycle -->
  <g transform="translate(170, 200)">
    <!-- Rear wheel -->
    <circle cx="0" cy="0" r="40" fill="none" stroke="#333" stroke-width="3"/>
    <circle cx="0" cy="0" r="5" fill="#333"/>
    <line x1="0" y1="-40" x2="0" y2="40" stroke="#888" stroke-width="1"/>
    <line x1="-40" y1="0" x2="40" y2="0" stroke="#888" stroke-width="1"/>
    <line x1="-28" y1="-28" x2="28" y2="28" stroke="#888" stroke-width="1"/>
    <line x1="28" y1="-28" x2="-28" y2="28" stroke="#888" stroke-width="1"/>

    <!-- Front wheel -->
    <circle cx="120" cy="0" r="35" fill="none" stroke="#333" stroke-width="3"/>
    <circle cx="120" cy="0" r="4" fill="#333"/>
    <line x1="120" y1="-35" x2="120" y2="35" stroke="#888" stroke-width="1"/>
    <line x1="85" y1="0" x2="155" y2="0" stroke="#888" stroke-width="1"/>
    <line x1="96" y1="-25" x2="144" y2="25" stroke="#888" stroke-width="1"/>
    <line x1="144" y1="-25" x2="96" y2="25" stroke="#888" stroke-width="1"/>

    <!-- Frame -->
    <line x1="0" y1="0" x2="60" y2="-30" stroke="#C41E3A" stroke-width="4"/>
    <line x1="60" y1="-30" x2="120" y2="0" stroke="#C41E3A" stroke-width="4"/>
    <line x1="0" y1="0" x2="60" y2="30" stroke="#C41E3A" stroke-width="4"/>
    <line x1="60" y1="-30" x2="60" y2="30" stroke="#C41E3A" stroke-width="3"/>

    <!-- Seat post & seat -->
    <line x1="30" y1="-25" x2="35" y2="-50" stroke="#333" stroke-width="3"/>
    <ellipse cx="35" cy="-53" rx="18" ry="5" fill="#333"/>

    <!-- Handlebars -->
    <line x1="120" y1="0" x2="120" y2="-25" stroke="#333" stroke-width="3"/>
    <line x1="110" y1="-25" x2="130" y2="-25" stroke="#333" stroke-width="3"/>
    <circle cx="110" cy="-28" r="3" fill="#333"/>
    <circle cx="130" cy="-28" r="3" fill="#333"/>

    <!-- Pedals -->
    <circle cx="30" y="30" r="8" fill="none" stroke="#555" stroke-width="2"/>
    <line x1="30" y1="22" x2="30" y2="38" stroke="#555" stroke-width="2"/>
    <line x1="22" y1="30" x2="38" y2="30" stroke="#555" stroke-width="2"/>

    <!-- Chain -->
    <ellipse cx="15" cy="0" rx="15" ry="10" fill="none" stroke="#999" stroke-width="1.5"/>
  </g>

  <!-- Pelican -->
  <g transform="translate(210, 155)">
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="45" ry="28" fill="#F5F5F5" stroke="#555" stroke-width="2"/>

    <!-- Wing -->
    <ellipse cx="-10" cy="5" rx="25" ry="14" fill="#E8E8E8" stroke="#999" stroke-width="1.5" transform="rotate(-15, -10, 5)"/>

    <!-- Tail -->
    <path d="M-42,-5 Q-55,-15 -50,-25 Q-45,-15 -40,-5" fill="#E0E0E0" stroke="#999" stroke-width="1"/>

    <!-- Neck -->
    <path d="M25,-15 Q35,-40 30,-60 Q28,-70 20,-75" fill="none" stroke="#F5F5F5" stroke-width="18" stroke-linecap="round"/>
    <path d="M25,-15 Q35,-40 30,-60 Q28,-70 20,-75" fill="none" stroke="#555" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Head -->
    <circle cx="18" cy="-82" r="16" fill="#F5F5F5" stroke="#555" stroke-width="2"/>

    <!-- Beak -->
    <path d="M30,-82 L50,-78 L32,-80 Z" fill="#FF8C00" stroke="#CC7000" stroke-width="1"/>
    <path d="M30,-82 L50,-78 L32,-80 Z" fill="#FFA500" opacity="0.5"/>
    <line x1="32" y1="-81" x2="48" y2="-79" stroke="#CC7000" stroke-width="0.8"/>

    <!-- Eye -->
    <circle cx="22" cy="-86" r="4" fill="#333"/>
    <circle cx="23" cy="-87" r="1.5" fill="white"/>

    <!-- Crest / tuft -->
    <path d="M10,-92 Q15,-100 20,-95" fill="none" stroke="#888" stroke-width="2" stroke-linecap="round"/>

    <!-- Legs on pedals -->
    <path d="M-5,20 L-10,32 L-5,35" fill="none" stroke="#F5F5F5" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-5,20 L-10,32 L-5,35" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M5,20 L10,32 L8,35" fill="none" stroke="#F5F5F5" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M5,20 L10,32 L8,35" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Webbed feet on pedal -->
    <path d="M-10,35 L-15,40 L-12,40 L-16,44" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M8,35 L13,40 L10,40 L14,44" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Small flowers on ground -->
  <circle cx="50" cy="270" r="3" fill="#FF69B4"/>
  <circle cx="55" cy="270" r="3" fill="#FFD700"/>
  <circle cx="380" cy="275" r="3" fill="#FF69B4"/>
  <circle cx="385" cy="275" r="3" fill="#FFD700"/>
  <circle cx="440" cy="270" r="3" fill="#FF69B4"/>
  <circle cx="445" cy="270" r="3" fill="#FFD700"/>

  <!-- Label -->
  <text x="250" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#555" opacity="0.7">Pelican Riding a Bicycle</text>
</svg>
