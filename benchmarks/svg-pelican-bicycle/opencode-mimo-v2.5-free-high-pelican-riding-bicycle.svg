<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <!-- Background -->
  <rect width="500" height="400" fill="#87CEEB"/>
  
  <!-- Ground -->
  <rect x="0" y="320" width="500" height="80" fill="#90EE90"/>
  
  <!-- Bicycle Group -->
  <g id="bicycle">
    <!-- Rear Wheel -->
    <circle cx="150" cy="280" r="50" fill="none" stroke="#333" stroke-width="4"/>
    <circle cx="150" cy="280" r="8" fill="#333"/>
    <!-- Rear Spokes -->
    <line x1="150" y1="230" x2="150" y2="330" stroke="#666" stroke-width="2"/>
    <line x1="100" y1="280" x2="200" y2="280" stroke="#666" stroke-width="2"/>
    <line x1="115" y1="245" x2="185" y2="315" stroke="#666" stroke-width="2"/>
    <line x1="185" y1="245" x2="115" y2="315" stroke="#666" stroke-width="2"/>
    
    <!-- Front Wheel -->
    <circle cx="350" cy="280" r="50" fill="none" stroke="#333" stroke-width="4"/>
    <circle cx="350" cy="280" r="8" fill="#333"/>
    <!-- Front Spokes -->
    <line x1="350" y1="230" x2="350" y2="330" stroke="#666" stroke-width="2"/>
    <line x1="300" y1="280" x2="400" y2="280" stroke="#666" stroke-width="2"/>
    <line x1="315" y1="245" x2="385" y2="315" stroke="#666" stroke-width="2"/>
    <line x1="385" y1="245" x2="315" y2="315" stroke="#666" stroke-width="2"/>
    
    <!-- Frame -->
    <line x1="150" y1="280" x2="250" y2="220" stroke="#E74C3C" stroke-width="6"/>
    <line x1="250" y1="220" x2="350" y2="280" stroke="#E74C3C" stroke-width="6"/>
    <line x1="250" y1="220" x2="250" y2="180" stroke="#E74C3C" stroke-width="6"/>
    <line x1="250" y1="180" x2="150" y2="280" stroke="#E74C3C" stroke-width="6"/>
    
    <!-- Seat -->
    <ellipse cx="250" cy="175" rx="25" ry="8" fill="#8B4513"/>
    
    <!-- Handlebars -->
    <line x1="350" y1="280" x2="380" y2="200" stroke="#333" stroke-width="4"/>
    <line x1="360" y1="200" x2="400" y2="190" stroke="#333" stroke-width="6"/>
    <circle cx="400" cy="190" r="6" fill="#333"/>
    
    <!-- Pedals -->
    <line x1="250" y1="280" x2="250" y2="310" stroke="#333" stroke-width="4"/>
    <line x1="230" y1="310" x2="270" y2="310" stroke="#333" stroke-width="6"/>
    <rect x="225" y="305" width="15" height="10" fill="#666"/>
    <rect x="260" y="305" width="15" height="10" fill="#666"/>
    
    <!-- Chain -->
    <ellipse cx="200" cy="280" rx="50" ry="15" fill="none" stroke="#666" stroke-width="3"/>
  </g>
  
  <!-- Pelican Group -->
  <g id="pelican">
    <!-- Body -->
    <ellipse cx="250" cy="155" rx="45" ry="35" fill="#F5F5DC"/>
    
    <!-- Wing -->
    <path d="M220,140 Q200,120 230,110 Q260,100 270,130 Q280,160 250,170 Z" fill="#DDD"/>
    
    <!-- Neck -->
    <path d="M250,130 Q280,100 310,90" stroke="#F5F5DC" stroke-width="15" fill="none"/>
    
    <!-- Head -->
    <circle cx="320" cy="80" r="20" fill="#F5F5DC"/>
    
    <!-- Beak (upper) -->
    <path d="M335,75 L400,70 L335,80 Z" fill="#FF8C00"/>
    
    <!-- Beak (lower with pouch) -->
    <path d="M335,80 L400,75 L380,95 Q350,110 335,90 Z" fill="#FF6347"/>
    
    <!-- Eye -->
    <circle cx="330" cy="72" r="5" fill="#000"/>
    <circle cx="332" cy="70" r="2" fill="#FFF"/>
    
    <!-- Head Tuft -->
    <path d="M310,65 Q305,50 315,55 Q310,45 320,50" stroke="#DDD" stroke-width="3" fill="none"/>
    
    <!-- Leg (on pedal) -->
    <path d="M260,180 Q265,220 250,280" stroke="#FF8C00" stroke-width="8" fill="none"/>
    <path d="M250,280 L240,310" stroke="#FF8C00" stroke-width="6"/>
    
    <!-- Foot on pedal -->
    <path d="M230,310 L250,310 L250,320 L230,320 Z" fill="#FF8C00"/>
  </g>
  
  <!-- Clouds -->
  <g id="clouds" fill="#FFF" opacity="0.8">
    <ellipse cx="80" cy="60" rx="40" ry="25"/>
    <ellipse cx="60" cy="55" rx="30" ry="20"/>
    <ellipse cx="100" cy="55" rx="30" ry="20"/>
    
    <ellipse cx="400" cy="80" rx="35" ry="22"/>
    <ellipse cx="380" cy="75" rx="25" ry="18"/>
    <ellipse cx="420" cy="75" rx="25" ry="18"/>
  </g>
  
  <!-- Sun -->
  <circle cx="450" cy="50" r="30" fill="#FFD700"/>
  <g stroke="#FFD700" stroke-width="3">
    <line x1="450" y1="10" x2="450" y2="0"/>
    <line x1="485" y1="25" x2="495" y2="15"/>
    <line x1="490" y1="50" x2="500" y2="50"/>
    <line x1="485" y1="75" x2="495" y2="85"/>
    <line x1="450" y1="90" x2="450" y2="100"/>
    <line x1="415" y1="75" x2="405" y2="85"/>
    <line x1="410" y1="50" x2="400" y2="50"/>
    <line x1="415" y1="25" x2="405" y2="15"/>
  </g>
</svg>