    <path d="M821 363c17-44 49-65 87-51" fill="none" stroke="#cdbd9f" stroke-width="4" stroke-linecap="round"/>

    <!-- Head -->
    <path d="M919 208c17-42 80-47 102-9 13 23 2 53-20 65-33 19-84 1-86-32-1-8 1-16 4-24z"
