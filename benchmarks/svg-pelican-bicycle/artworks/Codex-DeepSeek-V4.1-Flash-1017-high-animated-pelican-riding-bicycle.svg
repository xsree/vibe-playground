    <g fill="none" stroke="#7c4c35" stroke-width="3" opacity=".8">
      <path d="M969 489h130M974 515h120M980 541h108"/>
      <path d="M985 466l-10 100M1014 466l-4 101M1044 466l3 101M1074 466l9 100"/>
    </g>
    <path d="M951 466c8-12 164-13 173 0" fill="none" stroke="#17353a" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Pelican tail feathers -->
  <g stroke="#17353a" stroke-linejoin="round">
    <path d="M646 403c-62-21-104-4-138 26 46 3 74 16 101 36 8-24 17-43 37-62z"
