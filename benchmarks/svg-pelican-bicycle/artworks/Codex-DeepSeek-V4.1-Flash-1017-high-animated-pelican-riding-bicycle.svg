  <path d="M630 447c12-7 34-7 46 0" fill="none" stroke="#f4e5c7" stroke-width="5" stroke-linecap="round"/>

  <!-- Basket handle -->
  <g fill="none" stroke="#17353a" stroke-linecap="round">
    <path d="M946 468c38-49 123-54 160-4" stroke-width="13"/>
    <path d="M946 468c38-49 123-54 160-4" stroke="#f4e5c7" stroke-width="6"/>
    <path d="M985 441l8-48M1057 441l-8-48" stroke-width="8"/>
  </g>

  <!-- Basket and fish -->
  <g filter="url(#softShadow)">
    <g class="fish-two">
      <path d="M1024 458c29-24 64-21 84 5-23 26-60 30-84 8z" fill="#78b6aa" stroke="#17353a" stroke-width="4"/>
      <path d="M1103 466l28-20-2 25 19 13-38-5" fill="#ed7a50" stroke="#17353a" stroke-width="4" stroke-linejoin="round"/>
      <circle cx="1041" cy="463" r="4" fill="#17353a"/>
    </g>
    <g class="fish-one">
      <path d="M978 472c27-21 57-18 75 3-18 24-52 27-75 8z" fill="#e8b64f" stroke="#17353a" stroke-width="4"/>
