      <path d="M0 0L0-63" stroke="#17353a" stroke-width="10" stroke-linecap="round"/>
      <rect x="-22" y="55" width="44" height="13" rx="5" fill="#ed7a50" stroke="#17353a" stroke-width="4"/>
      <rect x="-22" y="-68" width="44" height="13" rx="5" fill="#f4e5c7" stroke="#17353a" stroke-width="4"/>
    </g>
    <circle r="17" fill="#f4e5c7" stroke="#17353a" stroke-width="6"/>
