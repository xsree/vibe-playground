    <path d="M874 489l-34-44h40" stroke="#17353a" stroke-width="26"/>
    <path d="M874 489l-34-44h40" stroke="#ed7a50" stroke-width="15"/>
    <path d="M932 521l37-64M952 476l25 13" stroke="#17353a" stroke-width="14"/>
    <path d="M932 521l37-64M952 476l25 13" stroke="#f4e5c7" stroke-width="7"/>
    <path d="M690 662c32-51 0-98-56-67-38 21-27 80 20 90 14 3 27-4 36-23z"
          stroke="#17353a" stroke-width="14"/>
    <path d="M690 662c32-51 0-98-56-67-38 21-27 80 20 90 14 3 27-4 36-23z"
          stroke="#e7a84c" stroke-width="5" stroke-dasharray="5 7"/>
    <path d="M472 686L690 620" stroke="#17353a" stroke-width="8"/>
    <path d="M472 686L690 620" stroke="#d2b46f" stroke-width="3" stroke-dasharray="7 5"/>
    <path d="M690 662L716 617" stroke="#17353a" stroke-width="7"/>
  </g>

  <!-- Crank and pedals -->
