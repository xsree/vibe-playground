    <g fill="none" stroke-linecap="round">
      <path d="M706 520c-35 27-36 63-4 90" stroke="#b95143" stroke-width="23"/>
      <path d="M702 610c-12 30-12 49 4 58" stroke="#d77b4f" stroke-width="18"/>
      <path d="M706 668l31 4" stroke="#17353a" stroke-width="11"/>
    </g>

