  <rect x="45" y="45" width="1310" height="910" rx="17" fill="none" stroke="#f8e9cb" stroke-width="3" opacity=".55"/>
  <rect width="1400" height="1000" filter="url(#grain)" opacity=".34" pointer-events="none"/>
</svg>
