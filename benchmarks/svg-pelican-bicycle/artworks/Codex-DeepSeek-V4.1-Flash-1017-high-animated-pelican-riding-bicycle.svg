<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
  <title id="title">A pelican riding a bicycle along the coast</title>
  <desc id="desc">A cream-colored pelican with a long coral beak rides a teal bicycle on a warm coastal road at sunset.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7e7c8"/>
      <stop offset=".48" stop-color="#f9c79f"/>
      <stop offset="1" stop-color="#ee8d6d"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff3b0" stop-opacity=".95"/>
      <stop offset=".58" stop-color="#f6bf61" stop-opacity=".55"/>
      <stop offset="1" stop-color="#f6bf61" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7bb4ae"/>
      <stop offset="1" stop-color="#2f7774"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dda27c"/>
      <stop offset="1" stop-color="#b96f59"/>
    </linearGradient>
    <linearGradient id="body" x1=".15" y1=".08" x2=".82" y2=".9">
      <stop offset="0" stop-color="#fffdf3"/>
      <stop offset=".62" stop-color="#f7ecd2"/>
      <stop offset="1" stop-color="#dfcda8"/>
    </linearGradient>
    <linearGradient id="wing" x1=".1" y1=".05" x2=".9" y2=".95">
      <stop offset="0" stop-color="#fffdf2"/>
      <stop offset=".58" stop-color="#f2e4c3"/>
      <stop offset="1" stop-color="#cdbb99"/>
    </linearGradient>
    <linearGradient id="bill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6bd45"/>
      <stop offset=".58" stop-color="#ef7d4a"/>
      <stop offset="1" stop-color="#d95142"/>
    </linearGradient>
    <linearGradient id="pouch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffbf65"/>
      <stop offset=".52" stop-color="#f28b59"/>
      <stop offset="1" stop-color="#df554d"/>
    </linearGradient>
    <linearGradient id="tealFrame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#378c86"/>
      <stop offset="1" stop-color="#145b5d"/>
    </linearGradient>
    <pattern id="paperDots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="3" r="1.2" fill="#713c38" opacity=".15"/>
      <circle cx="16" cy="14" r=".9" fill="#fff7df" opacity=".18"/>
    </pattern>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="13"/>
      <feOffset dy="17"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .16 0 0 0 0 .17 0 0 0 0 .15 0 0 0 .22 0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" seed="17" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono">
        <feFuncA type="table" tableValues="0 .13"/>
      </feComponentTransfer>
    </filter>
    <style>
      .spin { transform-box: fill-box; }
      .rider-bob {
        animation: riderBob 1.15s ease-in-out infinite;
        transform-origin: 760px 420px;
      }
      .scarf {
        animation: scarfFlap .72s ease-in-out infinite alternate;
        transform-origin: 916px 288px;
      }
      .cloud-a {
        animation: cloudDrift 12s ease-in-out infinite alternate;
      }
      .cloud-b {
        animation: cloudDrift 16s ease-in-out infinite alternate-reverse;
      }
      .sun-halo {
        animation: glow 3.8s ease-in-out infinite;
        transform-origin: 1110px 226px;
      }
      .fish-one {
        animation: fishWiggle .9s ease-in-out infinite alternate;
        transform-origin: 1007px 468px;
      }
      .fish-two {
        animation: fishWiggle 1.1s ease-in-out infinite alternate-reverse;
        transform-origin: 1040px 477px;
      }
      .wing-tip {
        animation: wingTap 1.15s ease-in-out infinite;
        transform-origin: 900px 450px;
      }
      @keyframes riderBob {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-6px) rotate(.55deg); }
      }
      @keyframes scarfFlap {
        from { transform: rotate(-5deg) skewX(-3deg); }
        to { transform: rotate(9deg) skewX(5deg); }
      }
      @keyframes cloudDrift {
        from { transform: translateX(-12px); }
        to { transform: translateX(28px); }
      }
      @keyframes glow {
        0%, 100% { opacity: .72; transform: scale(.97); }
        50% { opacity: 1; transform: scale(1.04); }
      }
      @keyframes fishWiggle {
        from { transform: rotate(-4deg); }
        to { transform: rotate(6deg); }
      }
      @keyframes wingTap {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(-1.2deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .rider-bob, .scarf, .cloud-a, .cloud-b, .sun-halo,
        .fish-one, .fish-two, .wing-tip {
          animation: none;
        }
      }
    </style>
  </defs>

  <!-- Poster ground -->
  <rect width="1400" height="1000" fill="url(#sky)"/>
  <rect width="1400" height="1000" fill="url(#paperDots)"/>

  <!-- Sun and sky -->
  <g class="sun-halo">
    <circle cx="1110" cy="226" r="170" fill="url(#sunGlow)"/>
  </g>
  <circle cx="1110" cy="226" r="91" fill="#f6c967"/>
  <circle cx="1110" cy="226" r="72" fill="#f9d98f" opacity=".72"/>

  <g fill="#fff4dc" opacity=".7">
    <g class="cloud-a">
      <path d="M138 206c22-27 61-25 82-3 19-34 70-34 91 1 28-4 53 15 57 42H117c-7-19 2-34 21-40z"/>
    </g>
    <g class="cloud-b">
      <path d="M1060 110c14-18 39-17 52-2 13-22 45-22 58 1 18-3 35 9 38 27h-165c-5-12 2-21 17-26z"/>
    </g>
    <path d="M770 164c12-16 35-15 46-2 11-19 39-19 50 0 15-2 29 8 32 23H754c-4-10 2-18 16-21z"/>
  </g>

  <g fill="none" stroke="#5b5d55" stroke-linecap="round" stroke-width="3" opacity=".62">
    <path d="M270 326q12-13 24 0 12-13 24 0"/>
    <path d="M329 285q8-9 16 0 8-9 16 0"/>
    <path d="M1188 354q10-11 20 0 10-11 20 0"/>
  </g>

  <!-- Distant coast -->
  <path d="M0 525c105-42 184-45 281-12 99 34 201 14 308-14 118-31 219-22 335 12 139 41 282 33 476-19v222H0z" fill="#b68a72" opacity=".54"/>
  <path d="M0 568c135-28 237-15 341 12 123 31 221 4 357-21 147-27 291-15 414 12 104 23 196 25 288 8v229H0z" fill="url(#sea)"/>

  <g fill="none" stroke="#d7e8d5" stroke-linecap="round" opacity=".72">
    <path d="M58 621c76-17 124-15 189 2" stroke-width="6"/>
    <path d="M287 668c95-22 177-17 260 2" stroke-width="5"/>
    <path d="M786 622c78-13 146-11 223 5" stroke-width="6"/>
    <path d="M1048 679c72-17 139-13 211 4" stroke-width="4"/>
    <path d="M1151 736c70-14 124-12 184 2" stroke-width="3"/>
  </g>
  <g fill="#f8e9cb" opacity=".38">
    <path d="M72 704l115-7-34 8-82 5z"/>
    <path d="M928 716l98-5-27 7-66 4z"/>
    <path d="M251 756l128-7-39 9-89 4z"/>
  </g>

  <!-- Road -->
  <path d="M0 752c231-28 460-32 694-8 284 30 493 29 706-7v263H0z" fill="url(#road)"/>
  <path d="M0 780c275-30 501-23 724-1 227 22 449 19 676-15" fill="none" stroke="#f4cb9a" stroke-width="8" opacity=".55"/>
  <g fill="#f7e1bd" opacity=".62">
    <path d="M60 866h145l-10 12H73z"/>
    <path d="M356 862h145l-10 12H369z"/>
    <path d="M654 862h145l-10 12H667z"/>
    <path d="M952 861h145l-10 12H965z"/>
    <path d="M1243 867h136l-9 12h-117z"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;-250 0" dur="1.7s" repeatCount="indefinite"/>
  </g>

  <g fill="#754d49" opacity=".35">
    <circle cx="164" cy="923" r="3"/>
    <circle cx="233" cy="941" r="2"/>
    <circle cx="487" cy="927" r="4"/>
    <circle cx="558" cy="950" r="2"/>
    <circle cx="821" cy="933" r="3"/>
    <circle cx="1104" cy="942" r="2"/>
    <circle cx="1214" cy="918" r="4"/>
    <circle cx="1345" cy="937" r="2"/>
  </g>

  <!-- Bicycle rear wheel -->
  <g transform="translate(472 686)">
    <circle r="155" fill="#322d2b" opacity=".22"/>
    <animateTransform attributeName="transform" type="translate" values="472 686;472 686" dur="3s" repeatCount="indefinite"/>
  </g>
  <g transform="translate(472 686)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2.35s" repeatCount="indefinite"/>
      <circle r="145" fill="none" stroke="#17353a" stroke-width="18"/>
      <circle r="133" fill="none" stroke="#f7ecd4" stroke-width="5"/>
      <circle r="124" fill="none" stroke="#d9c28f" stroke-width="2" stroke-dasharray="4 8"/>
      <g stroke="#f7ecd4" stroke-width="3">
        <path d="M-125 0H125M0-125V125M-89-89L89 89M89-89L-89 89M-48-116L48 116M48-116L-48 116M-116-48L116 48M116-48L-116 48"/>
