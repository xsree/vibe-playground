<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-label="Pelican riding a bicycle">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6EC6FF"/>
      <stop offset="100%" stop-color="#E8F6FF"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8BC34A"/>
      <stop offset="100%" stop-color="#558B2F"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8E8E8"/>
    </linearGradient>
    <radialGradient id="wheelGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#555"/>
      <stop offset="100%" stop-color="#111"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="600" fill="url(#sky)"/>
  <rect y="490" width="900" height="110" fill="url(#grass)"/>
  <ellipse cx="450" cy="520" rx="360" ry="18" fill="#33691E" opacity="0.25"/>

  <g id="bicycle" filter="url(#shadow)">
    <circle cx="250" cy="440" r="82" fill="url(#wheelGrad)" stroke="#000" stroke-width="2"/>
    <circle cx="250" cy="440" r="62" fill="none" stroke="#B0BEC5" stroke-width="3"/>
    <circle cx="250" cy="440" r="14" fill="#455A64"/>
    <g stroke="#90A4AE" stroke-width="2">
      <line x1="250" y1="378" x2="250" y2="502"/>
      <line x1="188" y1="440" x2="312" y2="440"/>
      <line x1="206" y1="396" x2="294" y2="484"/>
      <line x1="294" y1="396" x2="206" y2="484"/>
    </g>
    <circle cx="250" cy="440" r="86" fill="none" stroke="#263238" stroke-width="8"/>

    <circle cx="650" cy="440" r="82" fill="url(#wheelGrad)" stroke="#000" stroke-width="2"/>
    <circle cx="650" cy="440" r="62" fill="none" stroke="#B0BEC5" stroke-width="3"/>
    <circle cx="650" cy="440" r="14" fill="#455A64"/>
    <g stroke="#90A4AE" stroke-width="2">
      <line x1="650" y1="378" x2="650" y2="502"/>
      <line x1="588" y1="440" x2="712" y2="440"/>
      <line x1="606" y1="396" x2="694" y2="484"/>
      <line x1="694" y1="396" x2="606" y2="484"/>
    </g>
    <circle cx="650" cy="440" r="86" fill="none" stroke="#263238" stroke-width="8"/>

    <g stroke="#1A3A5C" stroke-width="7" stroke-linecap="round" fill="none">
      <line x1="250" y1="440" x2="370" y2="285"/>
      <line x1="370" y1="285" x2="560" y2="270"/>
      <line x1="560" y1="270" x2="450" y2="420"/>
      <line x1="450" y1="420" x2="250" y2="440"/>
      <line x1="370" y1="285" x2="250" y2="440"/>
    </g>
    <line x1="560" y1="270" x2="650" y2="440" stroke="#1A3A5C" stroke-width="7" stroke-linecap="round"/>

    <rect x="355" y="270" width="34" height="12" rx="6" fill="#37474F"/>
    <line x1="560" y1="270" x2="560" y2="232" stroke="#1A3A5C" stroke-width="6" stroke-linecap="round"/>
    <line x1="525" y1="232" x2="595" y2="232" stroke="#1A3A5C" stroke-width="6" stroke-linecap="round"/>
    <circle cx="525" cy="232" r="5" fill="#1A3A5C"/>
    <circle cx="595" cy="232" r="5" fill="#1A3A5C"/>

    <circle cx="450" cy="420" r="16" fill="#455A64" stroke="#000" stroke-width="2"/>
    <g stroke="#455A64" stroke-width="6" stroke-linecap="round">
      <line x1="450" y1="420" x2="492" y2="388"/>
      <line x1="450" y1="420" x2="408" y2="452"/>
    </g>
    <rect x="484" y="380" width="22" height="16" rx="4" fill="#263238" transform="rotate(-35 495 388)"/>
    <rect x="400" y="444" width="22" height="16" rx="4" fill="#263238" transform="rotate(35 411 452)"/>
  </g>

  <g id="pelican">
    <ellipse cx="395" cy="245" rx="78" ry="52" fill="url(#bodyGrad)" stroke="#BDBDBD" stroke-width="2"/>
    <ellipse cx="360" cy="255" rx="46" ry="30" fill="#ECECEC" stroke="#BDBDBD" stroke-width="1.5" transform="rotate(-15 360 255)"/>
    <path d="M 320 235 Q 300 210 315 195 Q 340 195 355 215 Z" fill="#E0E0E0" stroke="#BDBDBD" stroke-width="1.5"/>
    <path d="M 420 205 Q 445 185 475 165" fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round"/>
    <path d="M 420 205 Q 445 185 475 165" fill="none" stroke="#D0D0D0" stroke-width="2" stroke-linecap="round"/>
    <circle cx="482" cy="158" r="34" fill="url(#bodyGrad)" stroke="#BDBDBD" stroke-width="2"/>
    <ellipse cx="490" cy="150" rx="6" ry="7" fill="#111"/>
    <circle cx="492" cy="148" r="2" fill="#FFF"/>
    <path d="M 512 148 L 655 155 L 655 168 L 516 162 Z" fill="#FF8F00" stroke="#E65100" stroke-width="1.5"/>
    <path d="M 512 162 Q 560 205 620 198 Q 645 185 655 168 L 512 162 Z" fill="#FFB74D" stroke="#E65100" stroke-width="1.5"/>
    <path d="M 335 285 Q 360 300 395 290" fill="none" stroke="#E0E0E0" stroke-width="10" stroke-linecap="round"/>
    <g stroke="#FF8F00" stroke-width="5" stroke-linecap="round" fill="none">
      <path d="M 405 285 Q 430 330 460 370"/>
      <path d="M 420 288 Q 440 335 470 375"/>
    </g>
    <path d="M 455 370 L 495 378 L 485 392 L 445 384 Z" fill="#FF8F00" stroke="#E65100" stroke-width="1.5"/>
    <path d="M 400 290 L 365 270 L 330 265" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
    <path d="M 330 265 L 300 255" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
  </g>

  <ellipse cx="450" cy="525" rx="200" ry="10" fill="#000" opacity="0.12"/>
</svg>
