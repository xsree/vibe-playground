<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="600" height="500" role="img" aria-label="A pelican riding a bicycle">
  <defs>
    <!-- Soft sky gradient behind the scene -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bfe3ff"/>
      <stop offset="100%" stop-color="#e8f6ff"/>
    </linearGradient>
    <!-- Ground strip gradient -->
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b7d98a"/>
      <stop offset="100%" stop-color="#8fbf66"/>
    </linearGradient>
    <!-- Wheel hub shine -->
    <radialGradient id="hub" cx="0.35" cy="0.35" r="0.9">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#88909a"/>
    </radialGradient>
    <!-- Body feather shading -->
    <radialGradient id="bodyShade" cx="0.5" cy="0.3" r="0.8">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d8dde3"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="600" height="500" fill="url(#sky)"/>
  <!-- Distant cloud -->
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="110" cy="90" rx="55" ry="22"/>
    <ellipse cx="150" cy="80" rx="40" ry="18"/>
    <ellipse cx="505" cy="120" rx="60" ry="20"/>
    <ellipse cx="545" cy="110" rx="35" ry="15"/>
  </g>
  <!-- Ground -->
  <rect x="0" y="400" width="600" height="100" fill="url(#ground)"/>
  <rect x="0" y="400" width="600" height="6" fill="#a2cf75"/>

  <!-- ============ BICYCLE ============ -->
  <g id="bicycle">
    <!-- Rear wheel -->
    <g id="rear-wheel">
      <circle cx="180" cy="390" r="80" fill="none" stroke="#33373d" stroke-width="10"/>
      <circle cx="180" cy="390" r="72" fill="none" stroke="#d8dde3" stroke-width="3"/>
      <g stroke="#6b7280" stroke-width="4">
        <line x1="180" y1="310" x2="180" y2="470"/>
        <line x1="100" y1="390" x2="260" y2="390"/>
        <line x1="123" y1="333" x2="237" y2="447"/>
        <line x1="237" y1="333" x2="123" y2="447"/>
      </g>
      <circle cx="180" cy="390" r="10" fill="url(#hub)"/>
    </g>

    <!-- Front wheel -->
    <g id="front-wheel">
      <circle cx="420" cy="390" r="80" fill="none" stroke="#33373d" stroke-width="10"/>
      <circle cx="420" cy="390" r="72" fill="none" stroke="#d8dde3" stroke-width="3"/>
      <g stroke="#6b7280" stroke-width="4">
        <line x1="420" y1="310" x2="420" y2="470"/>
        <line x1="340" y1="390" x2="500" y2="390"/>
        <line x1="363" y1="333" x2="477" y2="447"/>
        <line x1="477" y1="333" x2="363" y2="447"/>
      </g>
      <circle cx="420" cy="390" r="10" fill="url(#hub)"/>
    </g>

    <!-- Frame: seat tube, top tube, down tube, chain stay, fork -->
    <g stroke="#c0392b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- seat tube (rear hub to seat) -->
      <line x1="180" y1="390" x2="240" y2="250"/>
      <!-- chain stay (rear hub to bottom bracket) -->
      <line x1="180" y1="390" x2="300" y2="310"/>
      <!-- down tube (bottom bracket to head tube) -->
      <line x1="300" y1="310" x2="420" y2="300"/>
      <!-- top tube (seat to head tube) -->
      <line x1="240" y1="250" x2="405" y2="250"/>
      <!-- seat stay (rear hub to seat) -->
      <line x1="180" y1="390" x2="240" y2="250"/>
      <!-- fork (head tube to front hub) -->
      <line x1="420" y1="300" x2="420" y2="390"/>
    </g>

    <!-- Seat -->
    <ellipse cx="238" cy="242" rx="34" ry="10" fill="#5b4636"/>
    <!-- Bottom bracket / crank -->
    <circle cx="300" cy="310" r="12" fill="#33373d"/>
    <!-- Pedals (left low, right high) -->
    <g stroke="#444a52" stroke-width="6" stroke-linecap="round">
      <line x1="300" y1="310" x2="280" y2="345"/>
      <line x1="270" y1="342" x2="290" y2="348"/>
      <line x1="300" y1="310" x2="318" y2="282"/>
      <line x1="308" y1="278" x2="328" y2="286"/>
    </g>
    <!-- Handlebars -->
    <g stroke="#33373d" stroke-width="8" stroke-linecap="round">
      <line x1="420" y1="300" x2="430" y2="255"/>
      <line x1="404" y1="250" x2="456" y2="250"/>
    </g>
  </g>

  <!-- ============ PELICAN ============ -->
  <g id="pelican">
    <!-- Tail feathers behind body -->
    <path d="M 200 240 Q 150 250 165 290 Q 185 265 205 250 Z" fill="#e8ebef"/>

    <!-- Wing folded at handlebar position (right side visible) -->
    <ellipse cx="330" cy="258" rx="52" ry="20" fill="#c2c9d2" transform="rotate(-12 330 258)"/>

    <!-- Left wing raised near handlebars -->
    <path d="M 370 258 Q 400 230 430 245 Q 405 265 372 270 Z" fill="#d0d6de"/>

    <!-- Body -->
    <ellipse cx="280" cy="250" rx="85" ry="60" fill="url(#bodyShade)" stroke="#b8bfc8" stroke-width="2"/>

    <!-- Neck -->
    <path d="M 330 225 Q 360 230 372 210 Q 382 192 380 175 Q 360 185 340 200 Q 320 210 320 228 Z" fill="#ffffff" stroke="#dfe3e8" stroke-width="2"/>

    <!-- Head -->
    <circle cx="370" cy="172" r="30" fill="#ffffff" stroke="#dfe3e8" stroke-width="2"/>

    <!-- Pelican pouch (gular pouch) under the beak -->
    <path d="M 398 168 Q 430 182 425 196 Q 400 200 386 188 Z" fill="#f5b26b" stroke="#e8a050" stroke-width="2"/>

    <!-- Upper beak (long with hook) -->
    <path d="M 395 165 Q 435 158 462 168 Q 470 172 464 178 Q 435 172 398 176 Z" fill="#f2b84b" stroke="#e0a02e" stroke-width="2"/>
    <path d="M 468 175 L 463 178" stroke="#e0a02e" stroke-width="3" stroke-linecap="round"/>

    <!-- Eye -->
    <circle cx="378" cy="168" r="4" fill="#1f2933"/>
    <circle cx="379" cy="167" r="1.5" fill="#ffffff"/>

    <!-- Legs reaching the pedals -->
    <g stroke="#f2b84b" stroke-width="8" stroke-linecap="round">
      <line x1="300" y1="295" x2="290" y2="345"/>
      <line x1="312" y1="295" x2="318" y2="282"/>
    </g>

    <!-- Webbed feet on pedals -->
    <g fill="#f2b84b">
      <path d="M 278 345 L 300 348 L 292 356 Z"/>
      <path d="M 312 280 L 334 284 L 326 292 Z"/>
    </g>
  </g>

  <!-- Motion lines -->
  <g stroke="#5a6470" stroke-width="3" stroke-linecap="round" opacity="0.5">
    <line x1="70" y1="360" x2="120" y2="360"/>
    <line x1="50" y1="380" x2="90" y2="380"/>
    <line x1="80" y1="340" x2="110" y2="340"/>
  </g>
</svg>
