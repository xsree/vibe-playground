<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">A pelican riding a bicycle at sunset</title>
  <desc id="desc">A hand-drawn editorial illustration of a cheerful white pelican pedaling a blue bicycle along a coastal road.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#183b61"/>
      <stop offset=".52" stop-color="#f07b64"/>
      <stop offset="1" stop-color="#ffd191"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#2a8da2"/>
      <stop offset="1" stop-color="#0f4d6b"/>
    </linearGradient>
    <linearGradient id="bill" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffd45c"/>
      <stop offset="1" stop-color="#ef9c39"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#36c2d3"/>
      <stop offset="1" stop-color="#126aa4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- sky, sun, and distant coast -->
  <rect width="1200" height="900" fill="url(#sky)"/>
  <circle cx="900" cy="184" r="91" fill="#ffe3a3" opacity=".96"/>
  <g fill="none" stroke="#f8b180" stroke-width="11" stroke-linecap="round" opacity=".5">
    <path d="M75 183c42-31 84-31 126 0"/>
    <path d="M184 262c32-24 65-24 97 0"/>
    <path d="M1042 324c29-21 58-21 87 0"/>
  </g>
  <path d="M0 438C128 401 231 436 356 421c149-19 248-88 398-54 136 31 243 93 446 54v274H0z" fill="#2a6f80" opacity=".6"/>
  <path d="M0 482c141-39 254 9 399-11 174-24 263-83 422-53 148 28 251 83 379 49v235H0z" fill="url(#sea)"/>
  <g fill="none" stroke="#a4e6e0" stroke-width="6" opacity=".7">
    <path d="M65 554c79-24 158-24 237 0"/><path d="M816 551c85-24 174-24 266 0"/>
    <path d="M175 618c65-17 132-17 199 0"/><path d="M898 632c63-17 129-17 195 0"/>
  </g>
  <path d="M0 651c173-23 357-17 512 17 197 43 424 45 688-18v250H0z" fill="#e9c77b"/>
  <path d="M0 712c183-31 339-13 496 32 212 61 468 43 704-31v187H0z" fill="#3c4c5d"/>
  <path d="M0 779c181-28 378-10 557 34 220 54 422 42 643-20" fill="none" stroke="#f1d78b" stroke-width="12" stroke-dasharray="42 30"/>

  <!-- cast shadow -->
  <ellipse cx="600" cy="789" rx="350" ry="37" fill="#172636" opacity=".28" filter="url(#shadow)"/>

  <!-- bicycle wheels -->
  <g fill="#dceef0" stroke="#173d55">
    <circle cx="410" cy="699" r="123" stroke-width="18"/>
    <circle cx="827" cy="699" r="123" stroke-width="18"/>
    <circle cx="410" cy="699" r="111" fill="none" stroke="#ffffff" stroke-width="4" opacity=".8"/>
    <circle cx="827" cy="699" r="111" fill="none" stroke="#ffffff" stroke-width="4" opacity=".8"/>
  </g>
  <g stroke="#80acba" stroke-width="4" opacity=".86">
    <path d="M410 588v222M299 699h222M332 621l156 156M488 621L332 777"/>
    <path d="M827 588v222M716 699h222M749 621l156 156M905 621L749 777"/>
  </g>
  <g fill="#f7d85a" stroke="#173d55" stroke-width="8">
    <circle cx="410" cy="699" r="15"/><circle cx="827" cy="699" r="15"/>
  </g>

  <!-- bicycle frame -->
  <g fill="none" stroke="url(#frame)" stroke-width="22" stroke-linejoin="round" stroke-linecap="round">
    <path d="M410 699 529 513 637 699H410l151-1 78-185"/>
    <path d="M637 699 827 699 740 492 561 513"/>
    <path d="M740 492 781 438"/>
  </g>
  <g fill="none" stroke="#173d55" stroke-width="12" stroke-linecap="round">
    <path d="M770 438h89l36-53"/><path d="M894 385h54"/>
    <path d="M506 513h79"/>
  </g>
  <path d="M494 496c16-20 76-20 94 0l-12 18h-71z" fill="#934c3c" stroke="#173d55" stroke-width="8"/>
  <g fill="none" stroke="#173d55" stroke-width="10" stroke-linecap="round">
    <circle cx="637" cy="699" r="38"/><path d="m637 699 55 46m-55-46-55 37"/>
  </g>
  <circle cx="637" cy="699" r="11" fill="#f7d85a" stroke="#173d55" stroke-width="7"/>

  <!-- pelican body and wing -->
  <path d="M412 487c-28-89 8-197 105-228 82-27 181 6 211 84 34 87 4 181-59 226-74 52-214 31-257-82z" fill="#f5f1df" stroke="#173d55" stroke-width="13"/>
  <path d="M475 451c40-55 125-80 181-28 31 29 43 80 19 122-37 64-142 77-203 20-39-37-35-82 3-114z" fill="#d2e7e1" stroke="#173d55" stroke-width="11"/>
  <path d="M476 522c60 19 127 9 183-25-20 52-80 86-143 72-19-5-35-16-40-47z" fill="#8dbbc0" opacity=".85"/>

  <!-- long neck and head -->
  <path d="M530 397c-50-43-48-122-1-170 35-36 90-46 133-20 45 27 60 80 40 130-17 42-58 72-103 80z" fill="#f7f3e6" stroke="#173d55" stroke-width="13"/>
  <path d="M605 244c16-62 61-103 118-98 51 5 83 45 78 90-5 53-50 80-102 75z" fill="#f7f3e6" stroke="#173d55" stroke-width="13"/>
  <path d="M634 215c9-55 44-92 90-100-13 42-20 68-9 107z" fill="#2f6472" stroke="#173d55" stroke-width="10"/>

  <!-- iconic pelican bill and pouch -->
  <path d="M702 227c83-34 176-16 228 36-75 19-145 53-213 104-36-33-42-83-15-140z" fill="url(#bill)" stroke="#173d55" stroke-width="13" stroke-linejoin="round"/>
  <path d="M722 322c57-18 121-44 183-47-19 91-79 131-157 110-27-8-43-31-26-63z" fill="#e99657" stroke="#173d55" stroke-width="11"/>
  <path d="M731 240c55-19 113-19 165 0" fill="none" stroke="#fff0a7" stroke-width="8" stroke-linecap="round" opacity=".9"/>
  <circle cx="710" cy="183" r="17" fill="#173d55"/>
  <circle cx="716" cy="177" r="5" fill="#fff"/>

  <!-- cap, scarf, and hands on handlebars -->
  <path d="M612 146c32-43 95-47 132-2-47 2-91 14-130 37z" fill="#e65c54" stroke="#173d55" stroke-width="10"/>
  <path d="M552 365c34 25 75 35 120 31l-11 37c-44 12-91-1-126-37z" fill="#e65c54" stroke="#173d55" stroke-width="9"/>
  <path d="M657 401c64 13 95 24 116 52" fill="none" stroke="#f7f3e6" stroke-width="30" stroke-linecap="round"/>
  <path d="M657 401c64 13 95 24 116 52" fill="none" stroke="#173d55" stroke-width="11" stroke-linecap="round"/>
  <path d="M764 443c12-11 29-8 36 6l-5 17c-13 4-25-1-31-11z" fill="#f7f3e6" stroke="#173d55" stroke-width="8"/>

  <!-- legs and webbed feet pedaling -->
  <g fill="none" stroke="#f7f3e6" stroke-width="33" stroke-linecap="round" stroke-linejoin="round">
    <path d="M514 544 577 617 680 735"/>
    <path d="M633 553 595 642 578 733"/>
  </g>
  <g fill="none" stroke="#173d55" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <path d="M514 544 577 617 680 735"/>
    <path d="M633 553 595 642 578 733"/>
  </g>
  <g fill="#ef9c39" stroke="#173d55" stroke-width="8" stroke-linejoin="round">
    <path d="M657 735c24-8 43 2 54 19-32 13-54 14-70-3z"/>
    <path d="M550 734c23-11 43-4 56 12-29 17-51 21-69 5z"/>
  </g>

  <!-- a small coastal route marker -->
  <g transform="translate(93 540)">
    <path d="M0 0h94v81H0z" rx="12" fill="#f6e8b5" stroke="#173d55" stroke-width="9"/>
    <path d="M18 24h57M18 48h41" stroke="#e65c54" stroke-width="9" stroke-linecap="round"/>
    <text x="47" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#173d55">COAST</text>
  </g>
</svg>
