<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 700" width="900" height="700" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">鹈鹕骑自行车 · Pelican riding a bicycle</title>
  <desc id="dsc">Hand-written flat illustration: a brown pelican with a huge bill and dangling throat pouch perches on the saddle of a teal road bike, webbed foot on the pedal and wing gripping the handlebar, crossing a sandy plain at sunrise.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCEDF2"/>
      <stop offset="0.55" stop-color="#F0E8D8"/>
      <stop offset="1" stop-color="#F8E9D1"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFE9B8" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#FFD89B" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#FFD89B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFF9EC" stop-opacity="0.78"/>
      <stop offset="0.6" stop-color="#FFF9EC" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#FFF9EC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FBF6EA"/>
      <stop offset="0.55" stop-color="#F3EADA"/>
      <stop offset="1" stop-color="#E5D7BD"/>
    </linearGradient>
    <linearGradient id="wingGrad" x1="0.1" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#8F99A6"/>
      <stop offset="1" stop-color="#5D6774"/>
    </linearGradient>
    <linearGradient id="pouchGrad" x1="0.25" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#F7D183"/>
      <stop offset="0.55" stop-color="#EBBB66"/>
      <stop offset="1" stop-color="#CC9340"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0E5D0"/>
      <stop offset="1" stop-color="#DFD0B4"/>
    </linearGradient>
    <filter id="shadowBlur" x="-40%" y="-120%" width="180%" height="340%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <g id="wheel">
      <circle r="91" fill="none" stroke="#2B3038" stroke-width="14"/>
      <circle r="91" fill="none" stroke="#4A515B" stroke-width="3" stroke-dasharray="2 10" opacity="0.5"/>
      <circle r="83" fill="none" stroke="#CBD1D8" stroke-width="5"/>
      <circle r="79" fill="none" stroke="#D8DDE3" stroke-width="1.5" opacity="0.75"/>
      <g stroke="#AFB8C2" stroke-width="1.8" opacity="0.95">
        <line x1="0" y1="0" x2="80" y2="0"/>
        <line x1="0" y1="0" x2="69.3" y2="40"/>
        <line x1="0" y1="0" x2="40" y2="69.3"/>
        <line x1="0" y1="0" x2="0" y2="80"/>
        <line x1="0" y1="0" x2="-40" y2="69.3"/>
        <line x1="0" y1="0" x2="-69.3" y2="40"/>
        <line x1="0" y1="0" x2="-80" y2="0"/>
        <line x1="0" y1="0" x2="-69.3" y2="-40"/>
        <line x1="0" y1="0" x2="-40" y2="-69.3"/>
        <line x1="0" y1="0" x2="0" y2="-80"/>
        <line x1="0" y1="0" x2="40" y2="-69.3"/>
        <line x1="0" y1="0" x2="69.3" y2="-40"/>
      </g>
      <circle r="9" fill="#8D959E"/>
      <circle r="3.5" fill="#646C76"/>
    </g>
  </defs>

  <!-- ============ BACKDROP ============ -->
  <rect width="900" height="700" fill="url(#sky)"/>
  <circle cx="786" cy="104" r="158" fill="url(#sunGlow)"/>
  <circle cx="786" cy="104" r="40" fill="#FFF1CC" opacity="0.85"/>
  <g fill="#FFFFFF" opacity="0.48">
    <ellipse cx="140" cy="128" rx="52" ry="20"/>
    <ellipse cx="180" cy="118" rx="36" ry="25"/>
    <ellipse cx="102" cy="136" rx="30" ry="14"/>
    <ellipse cx="640" cy="60" rx="38" ry="14"/>
    <ellipse cx="668" cy="52" rx="26" ry="18"/>
    <ellipse cx="614" cy="66" rx="23" ry="11"/>
  </g>
  <path d="M 0,470 C 80,428 172,432 254,470 Z" fill="#D7E4E0" opacity="0.85"/>
  <path d="M 186,470 C 286,420 386,438 478,470 Z" fill="#C8DAD5" opacity="0.8"/>
  <path d="M 428,470 C 566,414 706,428 900,470 Z" fill="#D4E2DE" opacity="0.8"/>
  <rect x="0" y="470" width="900" height="230" fill="url(#groundGrad)"/>
  <rect x="0" y="470" width="900" height="54" fill="#E6D9BE" opacity="0.5"/>
  <circle cx="452" cy="268" r="272" fill="url(#halo)"/>

  <ellipse cx="452" cy="596" rx="236" ry="15" fill="#6E6454" opacity="0.24" filter="url(#shadowBlur)"/>

  <!-- drift lines -->
  <g fill="none" stroke="#AEC0C5" stroke-width="5" stroke-linecap="round" opacity="0.4">
    <path d="M 74,286 C 120,276 164,280 200,294"/>
    <path d="M 56,336 C 110,328 154,332 188,344"/>
  </g>

  <!-- ============ BICYCLE ============ -->
  <g id="bicycle">
    <use xlink:href="#wheel" href="#wheel" x="255" y="495"/>
    <use xlink:href="#wheel" href="#wheel" x="655" y="495"/>

    <!-- far side leg of the pelican (behind the frame) -->
    <path d="M 368,312 C 374,330 379,346 382,362" fill="none" stroke="#DCCDB4" stroke-width="26" stroke-linecap="round"/>
    <path d="M 382,362 C 385,388 387,414 388,438" fill="none" stroke="#AE6F3F" stroke-width="11" stroke-linecap="round"/>
    <circle cx="382" cy="362" r="7" fill="#A76739"/>
    <path d="M 379,436 C 371,437 366,443 368,449 C 375,451 383,449 390,446 L 397,442 C 397,437 390,434 383,435 Z" fill="#AE6F3F"/>

    <!-- chain runs -->
    <g fill="none" stroke="#464D57" stroke-width="4.5" stroke-linecap="round">
      <path d="M 255,481 L 425,436"/>
      <path d="M 255,509 L 425,520"/>
    </g>

    <!-- frame -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 255,495 L 425,478" stroke="#1E6F62" stroke-width="13"/>
      <path d="M 255,495 L 388,366" stroke="#1E6F62" stroke-width="11"/>
      <path d="M 425,478 L 386,352" stroke="#1E6F62" stroke-width="14"/>
      <path d="M 425,478 L 584,360" stroke="#1E6F62" stroke-width="15"/>
      <path d="M 388,360 L 600,318" stroke="#1E6F62" stroke-width="13"/>
      <path d="M 600,318 L 584,362" stroke="#1E6F62" stroke-width="16"/>
      <path d="M 586,358 C 604,402 630,460 655,495" stroke="#1E6F62" stroke-width="12"/>
    </g>
    <g fill="none" stroke="#4FA595" stroke-width="3.5" stroke-linecap="round" opacity="0.85">
      <path d="M 398,354 L 590,318"/>
      <path d="M 432,468 L 578,360"/>
    </g>

    <!-- chainring + rear cog -->
    <g fill="none">
      <circle cx="425" cy="478" r="45" stroke="#6A727C" stroke-width="8" stroke-dasharray="6 11" opacity="0.45"/>
      <circle cx="425" cy="478" r="41" stroke="#7C848E" stroke-width="6"/>
      <circle cx="425" cy="478" r="29" stroke="#9AA2AC" stroke-width="3"/>
      <circle cx="255" cy="495" r="16" stroke="#6A727C" stroke-width="7" stroke-dasharray="4 6"/>
      <circle cx="255" cy="495" r="13" stroke="#7C848E" stroke-width="4"/>
    </g>
    <circle cx="425" cy="478" r="7" fill="#5F6771"/>

    <!-- cranks + pedals -->
    <path d="M 425,478 L 463,511" fill="none" stroke="#8D959E" stroke-width="9" stroke-linecap="round"/>
    <path d="M 425,478 L 387,445" fill="none" stroke="#6E767F" stroke-width="8" stroke-linecap="round"/>
    <rect x="449" y="505" width="31" height="10" rx="5" fill="#39404A"/>
    <rect x="372" y="440" width="26" height="8" rx="4" fill="#565E68"/>

    <!-- seat post + saddle -->
    <path d="M 386,352 L 381,338" fill="none" stroke="#8D959E" stroke-width="9" stroke-linecap="round"/>
    <path d="M 340,340 C 336,326 348,317 367,317 L 398,319 C 413,321 415,329 404,334 L 372,340 Z" fill="#39404A"/>

    <!-- handlebar -->
    <path d="M 600,318 L 626,292" fill="none" stroke="#6E767F" stroke-width="9" stroke-linecap="round"/>
    <path d="M 626,292 C 650,274 682,272 703,286" fill="none" stroke="#7C848E" stroke-width="8" stroke-linecap="round"/>
    <path d="M 686,278 L 704,286" fill="none" stroke="#39404A" stroke-width="13" stroke-linecap="round"/>
  </g>

  <!-- ============ PELICAN ============ -->
  <g id="pelican">
    <!-- tail feathers -->
    <path d="M 306,276 C 274,272 246,284 218,306 L 236,304 L 244,314 L 258,304 L 268,312 L 282,300 C 298,294 306,286 306,276 Z" fill="#6B7582"/>
    <path d="M 300,288 C 276,288 256,296 240,308" fill="none" stroke="#5A6472" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>

    <!-- body -->
    <path d="M 292,296 C 266,250 278,198 324,170 C 370,142 434,146 470,178 C 504,210 508,258 480,290 C 452,320 390,330 344,322 C 318,318 300,310 292,296 Z" fill="url(#bodyGrad)"/>
    <!-- belly shading -->
    <path d="M 316,296 C 344,318 400,328 446,314 C 420,334 356,336 320,318 Z" fill="#DFCFB0" opacity="0.5"/>
    <!-- breast feather hints -->
    <g fill="none" stroke="#DFCFB0" stroke-width="3" stroke-linecap="round" opacity="0.75">
      <path d="M 470,250 C 480,258 484,270 482,282"/>
      <path d="M 454,268 C 464,276 468,288 466,300"/>
    </g>

    <!-- folded far wing over the back -->
    <path d="M 452,176 C 420,142 376,138 344,158 C 314,176 294,204 288,238 C 284,260 290,278 302,290 C 312,282 318,268 320,254 C 330,268 344,280 360,284 C 366,268 370,250 372,232 C 382,246 396,256 412,258 C 418,238 424,214 426,192 C 436,196 446,188 452,176 Z" fill="url(#wingGrad)"/>
    <g fill="none" stroke="#4E5865" stroke-width="3" stroke-linecap="round" opacity="0.4">
      <path d="M 418,184 C 384,194 344,218 316,250"/>
      <path d="M 426,206 C 396,216 362,236 334,262"/>
      <path d="M 428,228 C 404,238 378,252 356,272"/>
    </g>

    <!-- nape crest -->
    <g fill="none" stroke="#F4EBDC" stroke-width="5" stroke-linecap="round">
      <path d="M 502,104 C 489,94 481,81 477,66"/>
      <path d="M 506,116 C 494,112 484,104 477,94"/>
    </g>

    <!-- neck -->
    <path d="M 458,214 C 480,198 500,180 516,160" fill="none" stroke="#F8F2E6" stroke-width="58" stroke-linecap="round"/>
    <path d="M 470,240 C 486,224 500,206 516,190" fill="none" stroke="#E7DAC3" stroke-width="16" stroke-linecap="round" opacity="0.85"/>

    <!-- head -->
    <ellipse cx="536" cy="118" rx="50" ry="42" fill="#FAF4E8" transform="rotate(-7 536 118)"/>
    <ellipse cx="552" cy="106" rx="18" ry="14" fill="#EFE2C8" opacity="0.6"/>

    <!-- bill: upper mandible with hooked tip -->
    <path d="M 570,90 L 710,114 Q 727,118 724,128 Q 721,136 712,136 L 574,122 Z" fill="#F3A93A"/>
    <path d="M 578,92 L 706,118" fill="none" stroke="#FFD07C" stroke-width="2.6" opacity="0.75"/>
    <path d="M 576,121 L 708,135" fill="none" stroke="#A96A18" stroke-width="2.4" opacity="0.8"/>
    <ellipse cx="583" cy="101" rx="4.6" ry="2.6" fill="#C9822A" transform="rotate(12 583 101)"/>

    <!-- bill: gular pouch -->
    <path d="M 574,121 L 706,135 C 700,168 686,198 666,218 C 646,240 620,246 600,232 C 582,218 574,190 572,164 C 571,146 572,132 574,121 Z" fill="url(#pouchGrad)"/>
    <ellipse cx="624" cy="184" rx="26" ry="13" fill="#FBEDC6" opacity="0.45" transform="rotate(8 624 184)"/>
    <path d="M 588,148 C 588,178 596,200 610,216" fill="none" stroke="#C9974E" stroke-width="2.4" stroke-linecap="round" opacity="0.5"/>

    <!-- eye -->
    <circle cx="552" cy="104" r="8.6" fill="#2A2E35"/>
    <circle cx="549.5" cy="101" r="2.8" fill="#FFFFFF" opacity="0.9"/>
    <path d="M 538,92 C 549,87 563,91 572,99" fill="none" stroke="#E2D5BD" stroke-width="3" stroke-linecap="round" opacity="0.75"/>

    <!-- near wing reaching the handlebar -->
    <path d="M 438,204 C 508,196 594,220 664,250 C 692,260 707,272 705,289 C 703,301 684,303 664,295 C 656,291 648,288 640,285 C 630,290 616,292 604,290 C 592,284 580,280 566,276 C 556,282 542,286 530,285 C 520,281 510,277 498,274 C 474,282 450,276 442,262 C 434,248 428,214 438,204 Z" fill="url(#wingGrad)"/>
    <g fill="none" stroke="#4E5865" stroke-width="2.8" stroke-linecap="round" opacity="0.38">
      <path d="M 460,214 C 528,212 592,232 660,258"/>
      <path d="M 468,232 C 530,230 590,248 652,272"/>
    </g>
    <!-- wing tip curling around the grip -->
    <path d="M 690,272 C 705,275 712,288 705,296 C 700,302 690,301 687,294 C 692,290 692,282 687,277 Z" fill="#5D6774"/>
    <path d="M 701,280 C 710,286 711,296 705,302" fill="none" stroke="#767F8B" stroke-width="3.4" stroke-linecap="round"/>

    <!-- near leg: feathered thigh + bare tarsus down to the pedal -->
    <path d="M 396,318 C 412,324 424,338 432,358" fill="none" stroke="#F4EBDC" stroke-width="26" stroke-linecap="round"/>
    <path d="M 432,358 C 446,404 456,452 461,498" fill="none" stroke="#C98A55" stroke-width="12" stroke-linecap="round"/>
    <circle cx="432" cy="358" r="8" fill="#B87A45"/>
    <g fill="none" stroke="#AE6F3F" stroke-width="3" stroke-linecap="round" opacity="0.8">
      <path d="M 439,414 L 455,410"/>
      <path d="M 445,452 L 461,448"/>
      <path d="M 451,484 L 467,480"/>
    </g>
    <!-- webbed foot on the pedal -->
    <path d="M 452,494 C 441,491 430,496 424,504 C 434,510 448,513 460,513 C 473,513 485,509 490,502 C 485,494 471,491 459,494 Z" fill="#C98A55"/>
    <g fill="none" stroke="#AE6F3F" stroke-width="2.6" stroke-linecap="round">
      <path d="M 442,498 L 447,511"/>
      <path d="M 458,496 L 458,512"/>
      <path d="M 473,498 L 468,510"/>
    </g>
  </g>

  <!-- ============ FOREGROUND ============ -->
  <g stroke="#8DA07C" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M 96,606 C 98,596 104,590 112,586"/>
    <path d="M 104,606 C 108,598 114,594 122,592"/>
    <path d="M 792,620 C 794,610 800,604 808,600"/>
    <path d="M 800,620 C 804,612 812,608 820,608"/>
    <path d="M 236,650 C 238,642 244,638 250,636"/>
  </g>
  <g fill="#D5C6A8" opacity="0.9">
    <ellipse cx="176" cy="640" rx="9" ry="4"/>
    <ellipse cx="700" cy="662" rx="11" ry="5"/>
    <ellipse cx="342" cy="672" rx="7" ry="3.5"/>
  </g>
  <g fill="#8DA07C" opacity="0.5">
    <circle cx="150" cy="626" r="3"/>
    <circle cx="742" cy="640" r="2.6"/>
    <circle cx="418" cy="654" r="2.4"/>
  </g>
</svg>
