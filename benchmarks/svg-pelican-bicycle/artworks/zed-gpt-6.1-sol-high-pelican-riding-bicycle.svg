<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title description">
  <title id="title">The scenic route — a pelican riding a bicycle</title>
  <desc id="description">An original hand-drawn vector seaside travel poster. A white pelican with a long golden bill and a deep orange throat pouch rides a coral-red bicycle to the right. One wing holds the handlebars; two orange webbed feet press opposite pedals. Cream-wall spoked wheels, a working-looking diamond frame, chain and curved fenders sit against a circular sea-and-sunset landscape. The caption reads: A little less hurry.</desc>
