<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">骑自行车的鹈鹕</title>
  <desc id="desc">一只白色鹈鹕在城市海滨车道上骑一辆珊瑚色自行车，翅膀收拢，双脚踩在踏板上。</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8f3ff"/>
      <stop offset="0.65" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#fff6e9"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd8e8"/>
      <stop offset="1" stop-color="#56a9c7"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.56" stop-color="#f3f5f8"/>
      <stop offset="1" stop-color="#d2dce6"/>
    </linearGradient>
    <linearGradient id="bill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd89b"/>
      <stop offset="0.45" stop-color="#f9ae63"/>
      <stop offset="1" stop-color="#e37730"/>
    </linearGradient>
    <linearGradient id="bike" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6b5d"/>
      <stop offset="1" stop-color="#db3945"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff5c9"/>
      <stop offset="1" stop-color="#ffdf78"/>
    </radialGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#25596d" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#sky)"/>
  <circle cx="1035" cy="130" r="64" fill="url(#sun)"/>
  <path d="M0 585 C130 562 240 588 360 572 C470 558 610 590 760 582 C890 575 1020 592 1200 568 L1200 650 L0 650 Z" fill="#e8f5f3"/>
  <rect x="0" y="650" width="1200" height="150" fill="url(#sea)"/>
  <path d="M690 512 c-60 18-110 16-161 4-14 50 7 97 54 118 50 22 94-8 102-54 5-31 5-46 5-68z" fill="#d8ecdf"/>
  <path d="M710 550c-45 16-78 18-113 9-10 34 7 66 39 79 36 15 67-10 72-41 3-19 3-28 2-47z" fill="#bcd7bd"/>
  <path d="M418 568c22-26 44-27 61-20 14-28 42-39 70-33 2 34-3 62-26 79-26 19-80 23-105 4-19-15-4-24 0-30z" fill="#edf7ea"/>

  <g stroke-linecap="round" stroke-linejoin="round">
