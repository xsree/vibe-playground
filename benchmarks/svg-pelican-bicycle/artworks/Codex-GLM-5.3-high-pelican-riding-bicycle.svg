    <path d="M485 693h58l45 22-91 10-24-18z" fill="#ffca78"/>
    <path d="M489 697h47l41 17-80 7z" fill="#ffe0ab"/>

    <!-- 手臂与骑行姿态 -->
    <path d="M702 287c26-22 51-31 77-27 8 1 12 9 8 16-13 21-37 41-66 44-28 3-49-9-55-23" fill="#f8fafc"/>
    <path d="M688 291c26-18 48-26 72-23-13 22-35 39-62 41-20 2-36-4-44-14z" fill="#e3eaf0"/>
    <path d="M751 276c12 8 24 14 39 17l7 18-48 12-18-31z" fill="#ffffff"/>
    <path d="M755 279c23 15 36 20 45 18" fill="none" stroke="#c9d5de" stroke-width="7"/>

