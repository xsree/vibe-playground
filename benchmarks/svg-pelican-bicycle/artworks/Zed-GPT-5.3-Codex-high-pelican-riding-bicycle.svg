<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Riding a Bicycle</title>
  <desc id="desc">A hand-drawn style SVG of a pelican pedaling a classic bicycle on a sunny road.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9ad7ff"/>
      <stop offset="65%" stop-color="#d9f1ff"/>
      <stop offset="100%" stop-color="#f2f8ff"/>
    </linearGradient>

    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#81bd66"/>
      <stop offset="100%" stop-color="#4f8c3f"/>
    </linearGradient>

    <radialGradient id="feather" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="68%" stop-color="#f4f0e6"/>
      <stop offset="100%" stop-color="#d7d1c5"/>
    </radialGradient>

    <linearGradient id="beak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffcc66"/>
      <stop offset="100%" stop-color="#ec9840"/>
    </linearGradient>

    <linearGradient id="bikePaint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2f4f88"/>
      <stop offset="100%" stop-color="#1d2f50"/>
    </linearGradient>

    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3f5f8"/>
      <stop offset="100%" stop-color="#c5ccd5"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#1f2a3a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#sky)"/>

  <g fill="#ffffff" opacity="0.75">
    <ellipse cx="250" cy="120" rx="92" ry="34"/>
    <ellipse cx="320" cy="110" rx="74" ry="28"/>
    <ellipse cx="860" cy="150" rx="88" ry="30"/>
    <ellipse cx="925" cy="138" rx="70" ry="24"/>
  </g>

  <circle cx="1040" cy="126" r="42" fill="#ffd25f"/>
  <g stroke="#ffebaa" stroke-linecap="round" stroke-width="5" opacity="0.75">
    <line x1="1040" y1="58" x2="1040" y2="26"/>
    <line x1="1091" y1="75" x2="1118" y2="52"/>
    <line x1="1110" y1="126" x2="1142" y2="126"/>
    <line x1="1091" y1="177" x2="1118" y2="200"/>
    <line x1="1040" y1="194" x2="1040" y2="226"/>
    <line x1="989" y1="177" x2="962" y2="200"/>
    <line x1="970" y1="126" x2="938" y2="126"/>
    <line x1="989" y1="75" x2="962" y2="52"/>
  </g>

  <rect y="560" width="1200" height="240" fill="url(#ground)"/>
  <rect y="612" width="1200" height="188" fill="#5f665f"/>
  <line x1="0" y1="706" x2="1200" y2="706" stroke="#eef1b5" stroke-width="8" stroke-dasharray="42 28" opacity="0.9"/>

  <g transform="translate(230 430)" filter="url(#softShadow)">
    <!-- Wheels -->
    <g id="rear-wheel">
      <circle cx="0" cy="190" r="145" fill="#252c35"/>
      <circle cx="0" cy="190" r="114" fill="url(#rim)"/>
      <circle cx="0" cy="190" r="18" fill="#7d8691"/>
      <g stroke="#98a2ad" stroke-width="4">
        <line x1="0" y1="76" x2="0" y2="304"/>
        <line x1="-114" y1="190" x2="114" y2="190"/>
        <line x1="-81" y1="109" x2="81" y2="271"/>
        <line x1="81" y1="109" x2="-81" y2="271"/>
        <line x1="-40" y1="83" x2="40" y2="297"/>
        <line x1="40" y1="83" x2="-40" y2="297"/>
      </g>
    </g>

    <g id="front-wheel">
      <circle cx="520" cy="190" r="145" fill="#252c35"/>
      <circle cx="520" cy="190" r="114" fill="url(#rim)"/>
      <circle cx="520" cy="190" r="18" fill="#7d8691"/>
      <g stroke="#98a2ad" stroke-width="4">
        <line x1="520" y1="76" x2="520" y2="304"/>
        <line x1="406" y1="190" x2="634" y2="190"/>
        <line x1="439" y1="109" x2="601" y2="271"/>
        <line x1="601" y1="109" x2="439" y2="271"/>
        <line x1="480" y1="83" x2="560" y2="297"/>
        <line x1="560" y1="83" x2="480" y2="297"/>
      </g>
    </g>

    <!-- Bicycle frame -->
    <g stroke="url(#bikePaint)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M0 190 L220 190 L360 84 L520 190"/>
      <path d="M220 190 L150 76 L360 84"/>
      <path d="M220 190 L300 264"/>
      <path d="M150 76 L122 32"/>
      <path d="M122 32 L200 32"/>
      <path d="M360 84 L395 34"/>
      <path d="M395 34 L472 34"/>
      <path d="M388 44 L445 14"/>
    </g>

    <!-- Drivetrain -->
    <circle cx="220" cy="190" r="46" fill="#3a4450" stroke="#9ca5ae" stroke-width="8"/>
    <circle cx="220" cy="190" r="16" fill="#c8ced5"/>
    <path d="M40 192 Q130 155 220 192 Q310 228 390 196" fill="none" stroke="#9f8a58" stroke-width="8"/>
    <g stroke="#303841" stroke-width="10" stroke-linecap="round">
      <line x1="220" y1="190" x2="274" y2="228"/>
      <line x1="220" y1="190" x2="165" y2="153"/>
    </g>
    <g fill="#171a1f">
      <rect x="266" y="224" width="46" height="14" rx="7"/>
      <rect x="126" y="146" width="46" height="14" rx="7"/>
    </g>

    <!-- Pelican -->
    <g transform="translate(210 -38)">
      <ellipse cx="95" cy="145" rx="105" ry="86" fill="url(#feather)" stroke="#8e8a84" stroke-width="4"/>
      <path d="M10 160 Q-45 200 -20 236 Q40 220 54 180 Z" fill="#d9d3c8" stroke="#88847f" stroke-width="4"/>

      <path d="M90 112 Q56 74 80 22 Q123 -26 173 2 Q201 32 188 66 Q175 94 142 112" fill="url(#feather)" stroke="#8e8a84" stroke-width="4"/>
      <ellipse cx="151" cy="42" rx="42" ry="33" fill="url(#feather)" stroke="#8e8a84" stroke-width="4"/>

      <path d="M181 40 Q271 32 330 60 Q270 88 180 72 Z" fill="url(#beak)" stroke="#965d22" stroke-width="4"/>
      <path d="M183 72 Q242 130 322 94 Q255 140 184 114 Z" fill="#f3b45f" stroke="#965d22" stroke-width="4"/>
      <line x1="208" y1="62" x2="322" y2="92" stroke="#8d5a1e" stroke-width="3"/>

      <circle cx="160" cy="36" r="7" fill="#1b232f"/>
      <circle cx="158" cy="34" r="2.5" fill="#ffffff"/>

      <path d="M58 138 Q125 94 178 136 Q143 198 75 206 Q45 182 58 138 Z" fill="#ece7dc" stroke="#8d8a84" stroke-width="4"/>
      <path d="M74 150 Q132 116 170 142 Q133 178 83 186 Z" fill="#b8b2a8" opacity="0.8"/>

      <!-- Legs to pedals -->
      <g stroke="#d08f44" stroke-width="9" stroke-linecap="round" fill="none">
        <path d="M88 210 Q96 242 141 252"/>
        <path d="M129 209 Q168 230 276 232"/>
      </g>
      <g fill="#df9e4e" stroke="#9a652f" stroke-width="3">
        <path d="M133 248 l22 2 l-14 14 z"/>
        <path d="M268 228 l24 2 l-14 16 z"/>
      </g>

      <!-- Rider details -->
      <path d="M130 7 Q168 -10 200 6" fill="none" stroke="#223953" stroke-width="6" stroke-linecap="round"/>
      <path d="M88 126 Q52 116 30 132" fill="none" stroke="#6f6b65" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- Bicycle contact shadows -->
    <ellipse cx="0" cy="346" rx="154" ry="24" fill="#2f363f" opacity="0.32"/>
    <ellipse cx="520" cy="346" rx="154" ry="24" fill="#2f363f" opacity="0.32"/>
  </g>
</svg>
