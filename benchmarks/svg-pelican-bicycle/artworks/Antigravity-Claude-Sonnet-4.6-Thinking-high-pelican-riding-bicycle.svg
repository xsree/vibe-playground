<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" width="520" height="380"
     font-family="sans-serif">

  <!-- ============================================================
       鹈鹕骑自行车 · Pelican Riding a Bicycle
       Model  : Claude Sonnet 4.6 (Thinking)
       Harness: Antigravity
       Date   : 2026-08-31
  ============================================================ -->

  <!-- Background sky gradient -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#c9e8f8"/>
      <stop offset="100%" stop-color="#e8f6fb"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#8BC34A"/>
      <stop offset="100%" stop-color="#558B2F"/>
    </linearGradient>
  </defs>

  <!-- === BACKGROUND === -->
  <rect width="520" height="380" fill="url(#sky)"/>
  <rect x="0" y="320" width="520" height="60" rx="0" fill="url(#groundGrad)"/>
  <rect x="0" y="315" width="520" height="12" fill="#9E9E9E"/>
  <g fill="#FFEB3B" opacity="0.7">
    <rect x="20"  y="319" width="40" height="4" rx="2"/>
    <rect x="100" y="319" width="40" height="4" rx="2"/>
    <rect x="180" y="319" width="40" height="4" rx="2"/>
    <rect x="260" y="319" width="40" height="4" rx="2"/>
    <rect x="340" y="319" width="40" height="4" rx="2"/>
    <rect x="420" y="319" width="40" height="4" rx="2"/>
  </g>
  <g fill="white" opacity="0.85">
    <ellipse cx="80"  cy="60" rx="45" ry="22"/>
    <ellipse cx="115" cy="52" rx="35" ry="20"/>
    <ellipse cx="55"  cy="55" rx="28" ry="16"/>
    <ellipse cx="400" cy="75" rx="50" ry="23"/>
    <ellipse cx="440" cy="65" rx="38" ry="20"/>
    <ellipse cx="368" cy="70" rx="30" ry="17"/>
  </g>

  <!-- ============================================================
       BICYCLE  (bottom bracket center ~247, y=295)
  ============================================================ -->
  <g id="bicycle" stroke="#333" fill="none" stroke-linecap="round" stroke-linejoin="round">

    <!-- Rear wheel -->
    <circle cx="170" cy="295" r="55" stroke="#444" stroke-width="5" fill="#f0f0f0"/>
    <circle cx="170" cy="295" r="48" stroke="#777" stroke-width="2.5"/>
    <g stroke="#555" stroke-width="1.5">
      <line x1="170" y1="247" x2="170" y2="343"/>
      <line x1="122" y1="295" x2="218" y2="295"/>
      <line x1="136" y1="261" x2="204" y2="329"/>
      <line x1="136" y1="329" x2="204" y2="261"/>
    </g>
    <circle cx="170" cy="295" r="7" fill="#555" stroke="none"/>

    <!-- Front wheel -->
    <circle cx="330" cy="295" r="55" stroke="#444" stroke-width="5" fill="#f0f0f0"/>
    <circle cx="330" cy="295" r="48" stroke="#777" stroke-width="2.5"/>
    <g stroke="#555" stroke-width="1.5">
      <line x1="330" y1="247" x2="330" y2="343"/>
      <line x1="282" y1="295" x2="378" y2="295"/>
      <line x1="296" y1="261" x2="364" y2="329"/>
      <line x1="296" y1="329" x2="364" y2="261"/>
    </g>
    <circle cx="330" cy="295" r="7" fill="#555" stroke="none"/>

    <!-- Frame -->
    <circle cx="247" cy="295" r="9" fill="#E53935" stroke="none"/>
    <line x1="247" y1="295" x2="170" y2="295" stroke="#E53935" stroke-width="6"/>
    <line x1="242" y1="210" x2="170" y2="295" stroke="#E53935" stroke-width="5"/>
    <line x1="247" y1="295" x2="242" y2="210" stroke="#E53935" stroke-width="6"/>
    <line x1="313" y1="218" x2="247" y2="295" stroke="#E53935" stroke-width="6"/>
    <line x1="313" y1="218" x2="242" y2="210" stroke="#E53935" stroke-width="5"/>
    <rect x="308" y="210" width="12" height="28" rx="4" fill="#E53935" stroke="none"/>
    <line x1="313" y1="238" x2="330" y2="295" stroke="#E53935" stroke-width="5"/>

    <!-- Handlebar -->
    <line x1="314" y1="215" x2="314" y2="198" stroke="#555" stroke-width="5"/>
    <line x1="298" y1="198" x2="332" y2="198" stroke="#555" stroke-width="5" stroke-linecap="round"/>
    <circle cx="298" cy="198" r="5" fill="#333" stroke="none"/>
    <circle cx="332" cy="198" r="5" fill="#333" stroke="none"/>

    <!-- Seat post and saddle -->
    <line x1="242" y1="210" x2="242" y2="192" stroke="#555" stroke-width="5"/>
    <ellipse cx="242" cy="190" rx="22" ry="7" fill="#4E342E" stroke="#333" stroke-width="1.5"/>

    <!-- Cranks and pedals -->
    <line x1="247" y1="295" x2="268" y2="316" stroke="#444" stroke-width="5"/>
    <rect x="264" y="313" width="14" height="5" rx="2" fill="#222" stroke="none"/>
    <line x1="247" y1="295" x2="226" y2="274" stroke="#444" stroke-width="5"/>
    <rect x="210" y="270" width="14" height="5" rx="2" fill="#222" stroke="none"/>

    <!-- Chain -->
    <path d="M247,295 Q208,320 170,295" stroke="#555" stroke-width="2" fill="none" stroke-dasharray="4 2"/>
  </g>

  <!-- ============================================================
       PELICAN
  ============================================================ -->
  <g id="pelican">

    <!-- Body -->
    <ellipse cx="240" cy="225" rx="45" ry="38"
             fill="white" stroke="#9E9E9E" stroke-width="2"/>

    <!-- Wings -->
    <path d="M210,215 Q175,190 160,175 Q178,178 198,200 Q205,207 210,215Z"
          fill="#B0BEC5" stroke="#78909C" stroke-width="1.5"/>
    <path d="M270,215 Q305,190 322,178 Q306,183 288,205 Q279,210 270,215Z"
          fill="#B0BEC5" stroke="#78909C" stroke-width="1.5"/>

    <!-- Neck -->
    <path d="M240,190 Q248,165 252,148"
          fill="none" stroke="white" stroke-width="18" stroke-linecap="round"/>
    <path d="M240,190 Q248,165 252,148"
          fill="none" stroke="#BDBDBD" stroke-width="20" stroke-linecap="round"
          opacity="0.25"/>

    <!-- Head -->
    <ellipse cx="254" cy="138" rx="24" ry="20"
             fill="white" stroke="#9E9E9E" stroke-width="2"/>

    <!-- Eye -->
    <circle cx="265" cy="132" r="6" fill="#FFF9C4" stroke="#333" stroke-width="1.5"/>
    <circle cx="267" cy="132" r="3" fill="#1A237E"/>
    <circle cx="268" cy="131" r="1" fill="white"/>

    <!-- Upper beak -->
    <path d="M268,136 Q295,130 320,133 Q308,145 270,146Z"
          fill="#F9A825" stroke="#F57F17" stroke-width="1.5"/>

    <!-- Gular pouch -->
    <path d="M268,146 Q295,145 310,142 Q315,155 308,168 Q295,178 272,172 Q262,160 265,148Z"
          fill="#F57F17" stroke="#E65100" stroke-width="1.5"/>
    <path d="M280,150 Q295,149 305,148 Q308,155 302,162"
          fill="none" stroke="#FFCA28" stroke-width="1.5" opacity="0.7"/>

    <!-- Lower mandible -->
    <path d="M268,146 Q285,152 265,152Z"
          fill="#F9A825" stroke="#F57F17" stroke-width="1"/>

    <!-- Head crest -->
    <g fill="#CFD8DC" stroke="#90A4AE" stroke-width="1">
      <ellipse cx="246" cy="122" rx="5" ry="9" transform="rotate(-20,246,122)"/>
      <ellipse cx="253" cy="118" rx="4" ry="8" transform="rotate(-5,253,118)"/>
      <ellipse cx="260" cy="120" rx="4" ry="7" transform="rotate(10,260,120)"/>
    </g>

    <!-- Legs -->
    <line x1="248" y1="258" x2="268" y2="316"
          stroke="#F9A825" stroke-width="6" stroke-linecap="round"/>
    <line x1="232" y1="258" x2="218" y2="272"
          stroke="#F9A825" stroke-width="6" stroke-linecap="round"/>

    <!-- Right webbed foot -->
    <g fill="#F9A825" stroke="#F57F17" stroke-width="1.2">
      <path d="M268,316 Q275,312 280,318 Q273,321 268,316Z"/>
      <path d="M268,316 Q274,322 278,327 Q271,326 268,316Z"/>
      <path d="M268,316 Q262,322 260,328 Q265,325 268,316Z"/>
    </g>

    <!-- Left webbed foot -->
    <g fill="#F9A825" stroke="#F57F17" stroke-width="1.2">
      <path d="M218,272 Q225,268 230,274 Q223,277 218,272Z"/>
      <path d="M218,272 Q224,278 228,283 Q221,282 218,272Z"/>
      <path d="M218,272 Q212,278 210,284 Q215,281 218,272Z"/>
    </g>

    <!-- Wing tip near handlebar -->
    <circle cx="325" cy="180" r="5" fill="#B0BEC5" stroke="#78909C" stroke-width="1.2"/>
  </g>

  <!-- Signature -->
  <text x="260" y="360" text-anchor="middle"
        font-size="11" fill="#555" opacity="0.8">
    Claude Sonnet 4.6 (Thinking) · Antigravity · 2026-08-31
  </text>

</svg>
