<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480">
  <!-- ============== 背景与场景 ============== -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bce4f5"/>
      <stop offset="100%" stop-color="#fff5d8"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#fff7c0"/>
      <stop offset="70%" stop-color="#ffd966"/>
      <stop offset="100%" stop-color="#ffb84d"/>
    </radialGradient>
  </defs>

  <!-- 天空 -->
  <rect width="680" height="480" fill="url(#sky)"/>

  <!-- 远山（两层做景深） -->
  <path d="M0 350 L80 290 L180 320 L280 280 L380 310 L500 280 L600 305 L680 295 L680 410 L0 410 Z"
        fill="#a8d5a0" opacity="0.55"/>
  <path d="M0 380 L100 340 L220 360 L350 335 L470 360 L580 340 L680 355 L680 420 L0 420 Z"
        fill="#8fc880" opacity="0.7"/>

  <!-- 太阳 -->
  <circle cx="570" cy="90" r="55" fill="#fff7c0" opacity="0.3"/>
  <circle cx="570" cy="90" r="42" fill="url(#sun)"/>

  <!-- 云朵 -->
  <g fill="#ffffff" opacity="0.92">
    <ellipse cx="120" cy="80" rx="36" ry="13"/>
    <ellipse cx="150" cy="76" rx="26" ry="11"/>
    <ellipse cx="92" cy="84" rx="20" ry="9"/>

    <ellipse cx="380" cy="55" rx="40" ry="14"/>
    <ellipse cx="412" cy="60" rx="28" ry="11"/>
  </g>

  <!-- 草地 -->
  <rect y="410" width="680" height="70" fill="#9ed182"/>
  <rect y="410" width="680" height="6" fill="#7fc060"/>

  <!-- ============== 自行车 ============== -->
  <g id="bicycle">
    <!-- 后轮 -->
    <g transform="translate(260 380)">
      <circle r="70" fill="#1a252f"/>
      <circle r="62" fill="none" stroke="#bdc3c7" stroke-width="3"/>
      <circle r="58" fill="none" stroke="#7f8c8d" stroke-width="2" stroke-dasharray="3 5"/>
      <g stroke="#95a5a6" stroke-width="1.5">
        <line x1="-55" y1="0" x2="55" y2="0"/>
        <line x1="0" y1="-55" x2="0" y2="55"/>
        <line x1="-39" y1="-39" x2="39" y2="39"/>
        <line x1="-39" y1="39" x2="39" y2="-39"/>
        <line x1="-50" y1="-22" x2="50" y2="22"/>
        <line x1="-50" y1="22" x2="50" y2="-22"/>
      </g>
      <circle r="8" fill="#34495e" stroke="#7f8c8d" stroke-width="1.5"/>
    </g>

    <!-- 前轮 -->
    <g transform="translate(440 380)">
      <circle r="60" fill="#1a252f"/>
      <circle r="52" fill="none" stroke="#bdc3c7" stroke-width="3"/>
      <circle r="48" fill="none" stroke="#7f8c8d" stroke-width="2" stroke-dasharray="3 5"/>
      <g stroke="#95a5a6" stroke-width="1.5">
        <line x1="-45" y1="0" x2="45" y2="0"/>
        <line x1="0" y1="-45" x2="0" y2="45"/>
        <line x1="-32" y1="-32" x2="32" y2="32"/>
        <line x1="-32" y1="32" x2="32" y2="-32"/>
        <line x1="-41" y1="-18" x2="41" y2="18"/>
        <line x1="-41" y1="18" x2="41" y2="-18"/>
      </g>
      <circle r="7" fill="#34495e" stroke="#7f8c8d" stroke-width="1.5"/>
    </g>

    <!-- 车架（红色双三角）-->
    <!-- 后下叉：后轮中心 → 五通 -->
    <line x1="260" y1="380" x2="340" y2="380" stroke="#c0392b" stroke-width="9" stroke-linecap="round"/>
    <!-- 座管/后上叉：后轮中心 → 坐垫 -->
    <line x1="260" y1="380" x2="300" y2="320" stroke="#c0392b" stroke-width="9" stroke-linecap="round"/>
    <!-- 下管：五通 → 头管 -->
    <line x1="340" y1="380" x2="430" y2="290" stroke="#c0392b" stroke-width="9" stroke-linecap="round"/>
    <!-- 上管：坐垫 → 头管 -->
    <line x1="300" y1="320" x2="430" y2="290" stroke="#c0392b" stroke-width="9" stroke-linecap="round"/>
    <!-- 前叉：头管 → 前轮中心 -->
    <line x1="430" y1="290" x2="440" y2="380" stroke="#c0392b" stroke-width="9" stroke-linecap="round"/>

    <!-- 五通（中轴） -->
    <circle cx="340" cy="380" r="8" fill="#7f1d12"/>

    <!-- 牙盘（链轮） -->
    <circle cx="340" cy="380" r="18" fill="none" stroke="#7f8c8d" stroke-width="2.5"/>
    <circle cx="340" cy="380" r="14" fill="none" stroke="#95a5a6" stroke-width="1.5"/>
    <circle cx="340" cy="380" r="6" fill="#34495e"/>
    <g stroke="#95a5a6" stroke-width="1">
      <line x1="340" y1="362" x2="340" y2="358"/>
      <line x1="340" y1="402" x2="340" y2="398"/>
      <line x1="358" y1="380" x2="362" y2="380"/>
      <line x1="322" y1="380" x2="318" y2="380"/>
    </g>

    <!-- 链条 -->
    <path d="M 322 380 L 268 380 M 358 380 L 252 380"
          fill="none" stroke="#7f8c8d" stroke-width="2" stroke-dasharray="3 3"/>

    <!-- 踏板曲柄 + 脚踏 -->
    <line x1="340" y1="380" x2="310" y2="410" stroke="#34495e" stroke-width="6" stroke-linecap="round"/>
    <rect x="296" y="406" width="22" height="8" rx="2" fill="#1a252f" stroke="#7f8c8d" stroke-width="1"/>

    <!-- 坐垫 -->
    <g transform="translate(300 315)">
      <ellipse rx="24" ry="6" fill="#2c3e50"/>
      <ellipse rx="22" ry="4" fill="#1a252f"/>
    </g>

    <!-- 车把 -->
    <g transform="translate(430 290)">
      <line x1="0" y1="0" x2="-5" y2="-25" stroke="#2c3e50" stroke-width="6" stroke-linecap="round"/>
      <line x1="-25" y1="-30" x2="15" y2="-30" stroke="#2c3e50" stroke-width="6" stroke-linecap="round"/>
      <rect x="-32" y="-35" width="10" height="6" rx="2" fill="#c0392b"/>
      <rect x="13" y="-35" width="10" height="6" rx="2" fill="#c0392b"/>
      <path d="M -20 -25 Q -15 -22 -18 -18" stroke="#34495e" stroke-width="2" fill="none"/>
    </g>
  </g>

  <!-- ============== 鹈鹕 ============== -->
  <g id="pelican">
    <!-- 左腿（向下踩踏板） -->
    <path d="M 290 335 Q 300 375 312 410"
          fill="none" stroke="#e67e22" stroke-width="8" stroke-linecap="round"/>
    <!-- 右腿（向后收） -->
    <path d="M 308 335 Q 326 375 338 405"
          fill="none" stroke="#e67e22" stroke-width="8" stroke-linecap="round"/>

    <!-- 脚（橙色蹼） -->
    <ellipse cx="312" cy="412" rx="11" ry="4" fill="#d35400"/>
    <line x1="305" y1="412" x2="304" y2="416" stroke="#d35400" stroke-width="2"/>
    <line x1="312" y1="412" x2="311" y2="416" stroke="#d35400" stroke-width="2"/>
    <line x1="319" y1="412" x2="320" y2="416" stroke="#d35400" stroke-width="2"/>

    <!-- 身体（白，坐于坐垫上方） -->
    <ellipse cx="295" cy="305" rx="55" ry="32" fill="#ffffff" stroke="#aab2b8" stroke-width="1.5"/>
    <ellipse cx="298" cy="320" rx="45" ry="18" fill="#f0f3f5"/>

    <!-- 翅膀（收在身后） -->
    <path d="M 245 295 Q 220 310 230 340 Q 250 332 270 320 Q 260 305 245 295 Z"
          fill="#e0e6e8" stroke="#aab2b8" stroke-width="1.5"/>
    <path d="M 235 305 Q 240 315 248 325" fill="none" stroke="#95a5a6" stroke-width="1.2"/>
    <path d="M 240 300 Q 245 312 255 322" fill="none" stroke="#95a5a6" stroke-width="1.2"/>
    <path d="M 245 296 Q 252 305 262 318" fill="none" stroke="#95a5a6" stroke-width="1.2"/>

    <!-- 脖子（向前上伸展，朝车把方向） -->
    <path d="M 330 290 Q 360 260 380 250 Q 395 255 385 280 Q 360 295 330 305 Z"
          fill="#ffffff" stroke="#aab2b8" stroke-width="1.5"/>
    <path d="M 335 295 Q 360 270 380 258" fill="none" stroke="#e8ecee" stroke-width="1.5"/>

    <!-- 头部 -->
    <ellipse cx="385" cy="245" rx="25" ry="22" fill="#ffffff" stroke="#aab2b8" stroke-width="1.5"/>

    <!-- 头顶羽冠（鹈鹕标志性短羽） -->
    <path d="M 370 226 Q 374 215 380 222 Q 378 228 372 230 Z" fill="#e8ecee" stroke="#aab2b8" stroke-width="0.8"/>
    <path d="M 380 222 Q 386 213 392 220 Q 390 226 384 228 Z" fill="#e8ecee" stroke="#aab2b8" stroke-width="0.8"/>

    <!-- 眼睛 -->
    <circle cx="378" cy="240" r="4.5" fill="#ffffff" stroke="#7f8c8d" stroke-width="0.8"/>
    <circle cx="378" cy="241" r="3" fill="#1a1a1a"/>
    <circle cx="377" cy="240" r="1" fill="#ffffff"/>

    <!-- 大长喙（上喙，橙黄） -->
    <path d="M 388 240 Q 470 230 510 245 Q 480 250 395 252 Q 388 248 388 240 Z"
          fill="#f5b041" stroke="#b9770e" stroke-width="1.5"/>

    <!-- 喙尖小钩 -->
    <path d="M 508 244 Q 516 246 512 252 Q 506 250 503 247 Z" fill="#d68910"/>

    <!-- 下喙 + 标志性喉囊（浅黄袋子） -->
    <path d="M 388 252 Q 425 268 470 262 Q 480 270 470 280 Q 430 290 395 280 Q 385 270 388 252 Z"
          fill="#fde0b0" stroke="#b9770e" stroke-width="1.3"/>

    <!-- 喉囊内部阴影 -->
    <path d="M 405 268 Q 440 280 465 270" fill="none" stroke="#e8a86d" stroke-width="1"/>
    <path d="M 405 273 Q 435 283 460 275" fill="none" stroke="#e8a86d" stroke-width="0.8"/>

    <!-- 上下喙分界线 -->
    <path d="M 390 252 Q 425 254 478 252" fill="none" stroke="#b9770e" stroke-width="1"/>

    <!-- 鼻孔 -->
    <ellipse cx="425" cy="244" rx="2" ry="1" fill="#7d5109"/>

    <!-- 胸前羽毛纹理 -->
    <path d="M 270 320 Q 285 328 300 322" fill="none" stroke="#dde2e4" stroke-width="1"/>
    <path d="M 280 328 Q 295 335 310 328" fill="none" stroke="#dde2e4" stroke-width="1"/>
    <path d="M 290 335 Q 305 340 315 333" fill="none" stroke="#dde2e4" stroke-width="1"/>
  </g>

  <!-- ============== 前景点缀 ============== -->
  <!-- 运动感线条（轮胎后方） -->
  <g stroke="#7fad56" stroke-width="1.5" opacity="0.6" fill="none">
    <line x1="40" y1="445" x2="100" y2="445"/>
    <line x1="120" y1="455" x2="170" y2="455"/>
    <line x1="500" y1="450" x2="560" y2="450"/>
    <line x1="580" y1="460" x2="640" y2="460"/>
  </g>

  <!-- 小草 -->
  <g stroke="#5d8a3a" stroke-width="1.5" fill="none">
    <path d="M 80 478 Q 82 470 85 478"/>
    <path d="M 230 478 Q 232 468 236 478"/>
    <path d="M 480 478 Q 482 470 486 478"/>
    <path d="M 540 478 Q 542 466 546 478"/>
  </g>

  <!-- 小花 -->
  <g>
    <circle cx="180" cy="455" r="3" fill="#ff6b9d"/>
    <circle cx="180" cy="455" r="1" fill="#fff5b8"/>
    <circle cx="430" cy="465" r="3" fill="#b794f4"/>
    <circle cx="430" cy="465" r="1" fill="#fff5b8"/>
  </g>
</svg>
