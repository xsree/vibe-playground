<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Sky background gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8F1F5" />
      <stop offset="100%" stop-color="#CBE0EB" />
    </linearGradient>
    
    <!-- Sunset sun gradient -->
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF275" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#FF8C42" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FF8C42" stop-opacity="0" />
    </radialGradient>

    <!-- Pelican bill gradient -->
    <linearGradient id="billGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB703" />
      <stop offset="100%" stop-color="#FB8500" />
    </linearGradient>

    <!-- Pelican pouch gradient -->
    <linearGradient id="pouchGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD166" />
      <stop offset="100%" stop-color="#FFB703" />
    </linearGradient>

    <!-- Shadow filter for depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="600" fill="url(#skyGrad)" />

  <!-- Large Stylized Sun -->
  <circle cx="400" cy="280" r="180" fill="url(#sunGrad)" />

  <!-- Distant mountains/hills (stylized flat shapes) -->
  <path d="M-50 480 L150 380 L350 480 Z" fill="#B5CAD6" opacity="0.6" />
  <path d="M250 480 L480 340 L700 480 Z" fill="#A8BFCD" opacity="0.7" />
  <path d="M500 480 L680 360 L900 480 Z" fill="#B5CAD6" opacity="0.6" />

  <!-- Stylized clouds -->
  <g fill="#FFFFFF" opacity="0.55">
    <path d="M 120 150 Q 140 130 160 150 Q 180 130 200 150 L 210 150 A 15 15 0 0 1 210 180 L 110 180 A 15 15 0 0 1 120 150 Z" />
    <path d="M 620 120 Q 635 105 650 120 Q 665 105 680 120 L 690 120 A 12 12 0 0 1 690 144 L 610 144 A 12 12 0 0 1 620 120 Z" />
  </g>

  <!-- The Road -->
  <!-- Main Road Bed -->
  <rect x="0" y="470" width="800" height="130" fill="#3D5A80" />
  <!-- Road Surface Highlight -->
  <line x1="0" y1="470" x2="800" y2="470" stroke="#293241" stroke-width="4" />
  <!-- Center dashed line (road marking) -->
  <line x1="0" y1="535" x2="800" y2="535" stroke="#E9C46A" stroke-width="6" stroke-dasharray="30 20" />
  <!-- Ground bushes / flowers at the side -->
  <path d="M -20 470 Q 10 450 40 470 Q 70 445 100 470 Q 130 455 160 470 L 160 490 L -20 490 Z" fill="#2A9D8F" opacity="0.8" />
  <path d="M 640 470 Q 670 450 700 470 Q 730 445 760 470 Q 790 455 820 470 L 820 490 L 640 490 Z" fill="#2A9D8F" opacity="0.8" />

  <!-- Speed / Wind lines (giving a sense of movement) -->
  <g stroke="#FFFFFF" stroke-width="2" opacity="0.6" stroke-linecap="round">
    <line x1="50" y1="220" x2="120" y2="220" />
    <line x1="80" y1="230" x2="140" y2="230" stroke-width="1" />
    <line x1="680" y1="280" x2="750" y2="280" />
    <line x1="660" y1="295" x2="710" y2="295" stroke-width="1.5" />
    <line x1="30" y1="360" x2="90" y2="360" />
  </g>

  <!-- BICYCLE SHADOW -->
  <ellipse cx="400" cy="475" rx="190" ry="12" fill="#223344" opacity="0.4" filter="url(#shadow)" />

  <!-- ==================== BICYCLE ==================== -->
  <g id="bicycle">
    <!-- Back Wheel -->
    <g id="back-wheel">
      <circle cx="280" cy="400" r="70" fill="none" stroke="#2B2D42" stroke-width="12" />
      <circle cx="280" cy="400" r="62" fill="none" stroke="#E5E5E5" stroke-width="4" />
      <!-- Spokes -->
      <g stroke="#8D99AE" stroke-width="1.5">
        <line x1="280" y1="400" x2="280" y2="330" />
        <line x1="280" y1="400" x2="280" y2="470" />
        <line x1="280" y1="400" x2="210" y2="400" />
        <line x1="280" y1="400" x2="350" y2="400" />
        <line x1="280" y1="400" x2="230.5" y2="350.5" />
        <line x1="280" y1="400" x2="329.5" y2="449.5" />
        <line x1="280" y1="400" x2="230.5" y2="449.5" />
        <line x1="280" y1="400" x2="329.5" y2="350.5" />
        <line x1="280" y1="400" x2="253.1" y2="335.2" />
        <line x1="280" y1="400" x2="306.9" y2="464.8" />
        <line x1="280" y1="400" x2="344.8" y2="373.1" />
        <line x1="280" y1="400" x2="215.2" y2="426.9" />
        <line x1="280" y1="400" x2="253.1" y2="464.8" />
        <line x1="280" y1="400" x2="306.9" y2="335.2" />
        <line x1="280" y1="400" x2="344.8" y2="426.9" />
        <line x1="280" y1="400" x2="215.2" y2="373.1" />
      </g>
      <!-- Hub -->
      <circle cx="280" cy="400" r="12" fill="#8D99AE" stroke="#2B2D42" stroke-width="2" />
    </g>

    <!-- Front Wheel -->
    <g id="front-wheel">
      <circle cx="520" cy="400" r="70" fill="none" stroke="#2B2D42" stroke-width="12" />
      <circle cx="520" cy="400" r="62" fill="none" stroke="#E5E5E5" stroke-width="4" />
      <!-- Spokes -->
      <g stroke="#8D99AE" stroke-width="1.5">
        <line x1="520" y1="400" x2="520" y2="330" />
        <line x1="520" y1="400" x2="520" y2="470" />
        <line x1="520" y1="400" x2="450" y2="400" />
        <line x1="520" y1="400" x2="590" y2="400" />
        <line x1="520" y1="400" x2="470.5" y2="350.5" />
        <line x1="520" y1="400" x2="569.5" y2="449.5" />
        <line x1="520" y1="400" x2="470.5" y2="449.5" />
        <line x1="520" y1="400" x2="569.5" y2="350.5" />
        <line x1="520" y1="400" x2="493.1" y2="335.2" />
        <line x1="520" y1="400" x2="546.9" y2="464.8" />
        <line x1="520" y1="400" x2="584.8" y2="373.1" />
        <line x1="520" y1="400" x2="455.2" y2="426.9" />
        <line x1="520" y1="400" x2="493.1" y2="464.8" />
        <line x1="520" y1="400" x2="546.9" y2="335.2" />
        <line x1="520" y1="400" x2="584.8" y2="426.9" />
        <line x1="520" y1="400" x2="455.2" y2="373.1" />
      </g>
      <!-- Hub -->
      <circle cx="520" cy="400" r="12" fill="#8D99AE" stroke="#2B2D42" stroke-width="2" />
    </g>

    <!-- Chain, Sprocket, and Chainstay -->
    <g id="drive-train">
      <!-- Chainring (Front Sprocket) -->
      <circle cx="380" cy="410" r="22" fill="#8D99AE" stroke="#2B2D42" stroke-width="3" />
      <circle cx="380" cy="410" r="14" fill="#CBE0EB" />
      <!-- Rear Cog -->
      <circle cx="280" cy="400" r="10" fill="#8D99AE" stroke="#2B2D42" stroke-width="2" />
      <!-- Chain -->
      <path d="M 280 390 L 380 388 A 22 22 0 0 1 380 432 L 280 410 A 10 10 0 0 1 280 390 Z" fill="none" stroke="#4A4E69" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Bicycle Frame -->
    <!-- We use a sturdy vintage diamond frame in beautiful teal (#2A9D8F) -->
    <g id="frame" stroke="#2A9D8F" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
      <!-- Chain Stay -->
      <line x1="280" y1="400" x2="380" y2="410" />
      <!-- Seat Stay -->
      <line x1="280" y1="400" x2="330" y2="310" />
      <!-- Seat Tube -->
      <line x1="380" y1="410" x2="330" y2="310" />
      <!-- Down Tube -->
      <line x1="380" y1="410" x2="470" y2="290" />
      <!-- Top Tube -->
      <line x1="330" y1="310" x2="470" y2="290" />
      <!-- Head Tube -->
      <line x1="470" y1="290" x2="460" y2="335" stroke-width="12" />
    </g>

    <!-- Front Fork and Stem -->
    <g id="front-fork-stem" stroke="#1D7066" stroke-width="8" stroke-linecap="round">
      <!-- Fork -->
      <line x1="470" y1="290" x2="520" y2="400" />
      <!-- Stem -->
      <line x1="470" y1="290" x2="465" y2="255" />
    </g>

    <!-- Handlebars -->
    <g id="handlebars">
      <!-- Handlebar Curve -->
      <path d="M 465 255 Q 480 250 495 255 Q 505 260 490 270" fill="none" stroke="#2B2D42" stroke-width="6" stroke-linecap="round" />
      <!-- Left side grip (background) -->
      <path d="M 465 255 Q 450 250 440 262" fill="none" stroke="#2B2D42" stroke-width="6" stroke-linecap="round" opacity="0.7" />
      <!-- Grips -->
      <line x1="492" y1="268" x2="482" y2="274" stroke="#E76F51" stroke-width="8" stroke-linecap="round" />
      <line x1="444" y1="258" x2="438" y2="265" stroke="#E76F51" stroke-width="8" stroke-linecap="round" opacity="0.7" />
      <!-- Cute Vintage Bell -->
      <circle cx="482" cy="248" r="7" fill="#E9C46A" stroke="#2B2D42" stroke-width="1.5" />
      <path d="M 482 248 L 486 254" stroke="#2B2D42" stroke-width="1.5" />
    </g>

    <!-- Seat (Saddle) -->
    <g id="seat">
      <!-- Seat Post -->
      <line x1="330" y1="310" x2="330" y2="280" stroke="#8D99AE" stroke-width="6" stroke-linecap="round" />
      <!-- Saddle base -->
      <path d="M 305 278 C 305 278 320 270 345 278 C 355 281 360 286 350 286 L 310 286 C 305 286 305 278 305 278 Z" fill="#764115" stroke="#2B2D42" stroke-width="2.5" stroke-linejoin="round" />
    </g>

    <!-- Rear Carrier/Rack -->
    <path d="M 280 400 L 260 330 L 320 330 L 330 310" fill="none" stroke="#2A9D8F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="260" y1="330" x2="325" y2="330" stroke="#2A9D8F" stroke-width="7" />
  </g>

  <!-- Front Rattan Basket with Flowers -->
  <g id="basket" filter="url(#shadow)">
    <!-- Supports -->
    <line x1="470" y1="290" x2="505" y2="310" stroke="#8D99AE" stroke-width="4" />
    <line x1="520" y1="350" x2="520" y2="325" stroke="#8D99AE" stroke-width="4" />
    
    <!-- Flowers in Basket -->
    <g id="basket-flowers">
      <!-- Green Leaves -->
      <path d="M 500 280 Q 495 265 510 270 Z" fill="#2A9D8F" />
      <path d="M 525 280 Q 535 265 520 270 Z" fill="#2A9D8F" />
      <!-- Red flower -->
      <circle cx="510" cy="275" r="7" fill="#E76F51" />
      <circle cx="510" cy="275" r="3" fill="#E9C46A" />
      <!-- Yellow flower -->
      <circle cx="522" cy="278" r="6" fill="#E9C46A" />
      <circle cx="522" cy="278" r="2" fill="#E76F51" />
      <!-- White flower -->
      <circle cx="502" cy="281" r="5" fill="#FFFFFF" />
      <circle cx="502" cy="281" r="1.5" fill="#E76F51" />
    </g>

    <!-- Basket Body -->
    <path d="M 495 285 L 535 285 L 530 315 C 530 318 528 320 525 320 L 500 320 C 497 320 495 318 495 315 Z" fill="#DDB892" stroke="#7F5539" stroke-width="2" />
    <!-- Basket rim -->
    <rect x="492" y="282" width="46" height="5" rx="2" fill="#B08968" stroke="#7F5539" stroke-width="1.5" />
    <!-- Woven texture lines -->
    <path d="M 500 287 L 500 318 M 510 287 L 510 318 M 520 287 L 520 318 M 530 287 L 528 318" stroke="#7F5539" stroke-width="1" opacity="0.6" />
    <path d="M 495 293 L 533 293 M 495 301 L 531 301 M 495 310 L 529 310" stroke="#7F5539" stroke-width="1" opacity="0.6" />
  </g>

  <!-- ==================== THE PELICAN ==================== -->
  <g id="pelican" filter="url(#shadow)">
    <!-- Back Foot & Leg (drawn behind body) -->
    <g id="back-leg" opacity="0.9">
      <!-- Hip to Knee -->
      <line x1="325" y1="245" x2="310" y2="340" stroke="#FF7000" stroke-width="10" stroke-linecap="round" />
      <!-- Knee to Ankle -->
      <line x1="310" y1="340" x2="340" y2="440" stroke="#FF7000" stroke-width="8" stroke-linecap="round" />
      <!-- Foot on Pedal 2 -->
      <path d="M 340 440 L 320 455 L 360 455 Z" fill="#FF8C00" stroke="#B34E00" stroke-width="1.5" stroke-linejoin="round" />
      <!-- Connection to pedal -->
      <circle cx="340" cy="440" r="4" fill="#FF8C00" />
    </g>

    <!-- Pelican Tail Feathers -->
    <path d="M 285 205 Q 260 200 250 215 Q 258 225 275 222 Q 255 232 262 245 Q 280 238 290 232 Z" fill="#E6EEF4" stroke="#2B2D42" stroke-width="2.5" stroke-linejoin="round" />

    <!-- Pelican Body (Torso) -->
    <path d="M 285 210 C 265 240 285 290 325 285 C 365 280 375 240 370 215 C 365 190 335 185 305 195 C 295 198 288 204 285 210 Z" fill="#FFFFFF" stroke="#2B2D42" stroke-width="3" stroke-linejoin="round" />
    <!-- Feather Shading / Belly highlight -->
    <path d="M 292 225 C 280 250 295 282 325 279 C 355 276 362 250 362 230 C 352 230 338 215 320 220 C 305 225 298 220 292 225 Z" fill="#E6EEF4" />

    <!-- Pelican Neck -->
    <!-- S-curve going from body to head -->
    <path d="M 350 200 C 370 195 385 180 375 150 C 365 120 380 110 375 100" fill="none" stroke="#2B2D42" stroke-width="32" stroke-linecap="round" />
    <!-- White inner neck fill -->
    <path d="M 350 200 C 370 195 385 180 375 150 C 365 120 380 110 375 100" fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" />
    <!-- Neck shadows -->
    <path d="M 363 198 C 378 190 374 175 366 155" fill="none" stroke="#E6EEF4" stroke-width="6" stroke-linecap="round" />

    <!-- Pelican Head -->
    <circle cx="375" cy="95" r="25" fill="#FFFFFF" stroke="#2B2D42" stroke-width="3" />
    <!-- Tuft of feathers at back of head -->
    <path d="M 353 87 Q 338 80 345 92 Q 335 93 350 102" fill="#FFFFFF" stroke="#2B2D42" stroke-width="2.5" stroke-linejoin="round" />
    
    <!-- Cute eye -->
    <circle cx="382" cy="90" r="5" fill="#2B2D42" />
    <circle cx="384" cy="88" r="1.5" fill="#FFFFFF" />
    <path d="M 377 82 Q 382 78 387 82" stroke="#2B2D42" stroke-width="1.5" fill="none" stroke-linecap="round" />

    <!-- Pelican Bill (Big beak) & Throat Pouch -->
    <g id="beak-and-pouch">
      <!-- Throat Pouch (Gular Pouch) -->
      <path d="M 480 105 C 480 130 450 200 395 190 C 365 185 365 145 365 120 L 400 105 Z" fill="url(#pouchGrad)" stroke="#2B2D42" stroke-width="3" stroke-linejoin="round" />
      
      <!-- Upper Beak -->
      <path d="M 388 80 L 485 100 C 490 101 492 105 488 107 L 396 112 Z" fill="url(#billGrad)" stroke="#2B2D42" stroke-width="3" stroke-linejoin="round" />
      <!-- Beak tip hook -->
      <path d="M 485 100 Q 492 102 488 107 Z" fill="#D87A00" stroke="#2B2D42" stroke-width="2" />
      <!-- Nostril -->
      <ellipse cx="405" cy="90" rx="3" ry="1" fill="#7F5539" transform="rotate(11 405 90)" />

      <!-- Fish Tail sticking out of the pouch -->
      <g id="trapped-fish" transform="translate(425, 175) rotate(-25)">
        <path d="M 0 0 C 10 -5 20 -5 30 0 L 32 -10 C 22 -12 12 -8 0 0 Z" fill="#5F9EA0" stroke="#2B2D42" stroke-width="2" />
        <path d="M 30 0 L 45 -12 L 40 -3 L 45 6 L 30 0 Z" fill="#E76F51" stroke="#2B2D42" stroke-width="2" stroke-linejoin="round" />
        <line x1="15" y1="-5" x2="17" y2="-1" stroke="#2B2D42" stroke-width="1.5" />
        <line x1="22" y1="-4" x2="24" y2="0" stroke="#2B2D42" stroke-width="1.5" />
      </g>
    </g>

    <!-- Front Foot & Leg (goes down to top pedal) -->
    <g id="front-leg">
      <path d="M 335 270 L 390 320 L 415 365" fill="none" stroke="#FF7000" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 335 270 L 390 320 L 415 365" fill="none" stroke="#FF8C00" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
      
      <!-- Big Orange Webbed Foot on Pedal 1 -->
      <g transform="translate(415, 365) rotate(15)">
        <path d="M 0 0 C 10 -5 25 -5 35 10 C 25 15 15 15 -5 12 Z" fill="#FF8C00" stroke="#B34E00" stroke-width="1.5" />
        <path d="M 0 0 L 32 8 C 34 8 36 12 33 14 L 3 10 Z" fill="#FF8C00" stroke="#B34E00" stroke-width="1.5" />
        <path d="M 0 0 L 25 -8 C 28 -9 30 -6 28 -3 L 1 5 Z" fill="#FF8C00" stroke="#B34E00" stroke-width="1.5" />
        <path d="M 12 -3 Q 20 0 25 5" fill="none" stroke="#B34E00" stroke-width="1" />
        <path d="M 10 3 Q 18 8 26 10" fill="none" stroke="#B34E00" stroke-width="1" />
      </g>
      <!-- Ankle Joint Bolt -->
      <circle cx="415" cy="365" r="4.5" fill="#E76F51" />
    </g>

    <!-- Foreground Wing (reaching forward to hold handlebars) -->
    <g id="foreground-wing">
      <path d="M 310 205 C 290 220 330 280 380 270 C 420 260 450 275 470 275 C 450 250 410 230 380 215 C 350 200 320 200 310 205 Z" fill="#FFFFFF" stroke="#2B2D42" stroke-width="3" stroke-linejoin="round" />
      <path d="M 335 220 C 340 235 365 260 395 252" fill="none" stroke="#E6EEF4" stroke-width="2.5" />
      <path d="M 355 215 C 360 228 390 248 420 238" fill="none" stroke="#E6EEF4" stroke-width="2.5" />
      <path d="M 470 275 C 465 280 455 280 455 272" fill="none" stroke="#2B2D42" stroke-width="2" />
      <path d="M 470 275 C 475 278 470 285 460 280" fill="none" stroke="#2B2D42" stroke-width="2" />
    </g>
  </g>

  <!-- Foreground Pedal and Crank (drawn over background elements) -->
  <g id="foreground-pedal">
    <line x1="380" y1="410" x2="410" y2="370" stroke="#8D99AE" stroke-width="9" stroke-linecap="round" />
    <line x1="380" y1="410" x2="410" y2="370" stroke="#2B2D42" stroke-width="2" stroke-linecap="round" />
    <circle cx="380" cy="410" r="8" fill="#2B2D42" />
    <circle cx="410" cy="370" r="5" fill="#2B2D42" />
    <!-- Pedal 1 -->
    <rect x="395" y="364" width="30" height="12" rx="4" fill="#E76F51" stroke="#2B2D42" stroke-width="2" transform="rotate(15 410 370)" />
  </g>

  <!-- Background Pedal -->
  <g id="background-pedal" opacity="0.9">
    <line x1="380" y1="410" x2="350" y2="450" stroke="#4A4E69" stroke-width="8" stroke-linecap="round" />
    <rect x="335" y="444" width="30" height="12" rx="4" fill="#4A4E69" stroke="#2B2D42" stroke-width="2" transform="rotate(5 350 450)" />
  </g>

  <!-- Motion Trails / Details -->
  <g fill="#FFFFFF" opacity="0.7">
    <!-- Spinning wheel motion curves -->
    <path d="M 200 400 A 80 80 0 0 1 230 330" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    <path d="M 360 400 A 80 80 0 0 1 330 470" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <path d="M 440 400 A 80 80 0 0 1 470 330" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    <path d="M 600 400 A 80 80 0 0 1 570 470" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />

    <!-- Cute motion sweat droplets -->
    <path d="M 320 90 Q 310 95 305 90 Q 312 85 320 90 Z" fill="#CBE0EB" />
    <path d="M 315 110 Q 305 112 300 108 Q 308 104 315 110 Z" fill="#CBE0EB" />
  </g>

  <!-- Stylized Label -->
  <g transform="translate(400, 50)">
    <rect x="-110" y="0" width="220" height="28" rx="14" fill="#293241" opacity="0.85" />
    <text x="0" y="18" fill="#E9C46A" font-family="'Courier New', Courier, monospace" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="1.5">PELICAN RIDER</text>
  </g>
</svg>
