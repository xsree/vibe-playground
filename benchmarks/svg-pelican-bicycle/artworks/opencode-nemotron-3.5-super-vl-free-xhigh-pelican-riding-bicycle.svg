<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-label="鹈鹕骑自行车">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ec0ee"/>
      <stop offset="100%" stop-color="#e3f4fb"/>
    </linearGradient>
    <linearGradient id="grassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7cb342"/>
      <stop offset="100%" stop-color="#33691e"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <radialGradient id="beakGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb74d"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.25"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="900" height="460" fill="url(#skyGrad)"/>
  <!-- Sun -->
  <circle cx="820" cy="80" r="40" fill="#fff59d" opacity="0.9"/>

  <!-- Ground -->
  <rect y="460" width="900" height="140" fill="url(#grassGrad)"/>

  <!-- Road / path -->
  <rect y="430" width="900" height="40" fill="#455a64"/>
  <path d="M0 450 L900 450" stroke="#fff" stroke-width="3" stroke-dasharray="14 14" opacity="0.6"/>

  <!-- ================= BICYCLE ================= -->
  <g id="bicycle" filter="url(#softShadow)">
    <!-- Rear wheel -->
    <circle cx="270" cy="405" r="55" fill="none" stroke="#1a1a1a" stroke-width="10" stroke-linecap="round"/>
    <circle cx="270" cy="405" r="55" fill="none" stroke="#444" stroke-width="3"/>
    <g stroke="#666" stroke-width="2">
      <line x1="270" y1="350" x2="270" y2="460"/>
      <line x1="215" y1="405" x2="325" y2="405"/>
      <line x1="236" y1="370" x2="304" y2="440"/>
      <line x1="304" y1="370" x2="236" y2="440"/>
    </g>
    <circle cx="270" cy="405" r="8" fill="#333"/>

    <!-- Front wheel -->
    <circle cx="470" cy="405" r="55" fill="none" stroke="#1a1a1a" stroke-width="10" stroke-linecap="round"/>
    <circle cx="470" cy="405" r="55" fill="none" stroke="#444" stroke-width="3"/>
    <g stroke="#666" stroke-width="2">
      <line x1="470" y1="350" x2="470" y2="460"/>
      <line x1="415" y1="405" x2="525" y2="405"/>
      <line x1="436" y1="370" x2="504" y2="440"/>
      <line x1="504" y1="370" x2="436" y2="440"/>
    </g>
    <circle cx="470" cy="405" r="8" fill="#333"/>

    <!-- Frame tubes -->
    <line x1="270" y1="405" x2="355" y2="400" stroke="#2c3e50" stroke-width="9" stroke-linecap="round"/>
    <line x1="270" y1="405" x2="385" y2="320" stroke="#2c3e50" stroke-width="8" stroke-linecap="round"/>
    <line x1="355" y1="400" x2="450" y2="395" stroke="#2c3e50" stroke-width="9" stroke-linecap="round"/>
    <line x1="355" y1="400" x2="385" y2="320" stroke="#2c3e50" stroke-width="8" stroke-linecap="round"/>
    <line x1="385" y1="320" x2="455" y2="365" stroke="#2c3e50" stroke-width="8" stroke-linecap="round"/>
    <line x1="455" y1="365" x2="470" y2="405" stroke="#2c3e50" stroke-width="9" stroke-linecap="round"/>

    <!-- Bottom bracket / crank -->
    <circle cx="355" cy="400" r="10" fill="#444"/>
    <g stroke="#666" stroke-width="5" stroke-linecap="round">
      <line x1="355" y1="400" x2="338" y2="408"/>
      <line x1="355" y1="400" x2="372" y2="392"/>
    </g>
    <!-- Pedals -->
    <rect x="331" y="404" width="16" height="8" rx="2" fill="#555"/>
    <rect x="366" y="388" width="16" height="8" rx="2" fill="#555"/>

    <!-- Handlebars -->
    <line x1="455" y1="365" x2="455" y2="335" stroke="#2c3e50" stroke-width="7" stroke-linecap="round"/>
    <path d="M455 335 Q470 335 485 342" fill="none" stroke="#2c3e50" stroke-width="7" stroke-linecap="round"/>
    <circle cx="455" cy="335" r="7" fill="#333"/>
    <circle cx="485" cy="342" r="7" fill="#333"/>

    <!-- Seat -->
    <ellipse cx="385" cy="316" rx="22" ry="9" fill="#444"/>
    <line x1="385" y1="320" x2="385" y2="326" stroke="#2c3e50" stroke-width="3"/>
  </g>

  <!-- ================= PELICAN ================= -->
  <g id="pelican" filter="url(#softShadow)">
    <!-- Tail feathers -->
    <path d="M318 352 Q295 350 310 370 Q322 365 328 354" fill="#fff" stroke="#ddd" stroke-width="2"/>
    <path d="M314 346 Q292 344 308 362 Q318 358 324 348" fill="#fff" stroke="#ddd" stroke-width="2"/>

    <!-- Body -->
    <ellipse cx="365" cy="350" rx="48" ry="34" fill="url(#bodyGrad)" stroke="#e0e0e0" stroke-width="2"/>

    <!-- Wing -->
    <path d="M385 342 Q410 350 400 375 Q380 368 372 352" fill="none" stroke="#b0b0b0" stroke-width="10" stroke-linecap="round"/>
    <path d="M380 345 Q398 355 392 372 Q378 365 370 350" fill="none" stroke="#999" stroke-width="6" stroke-linecap="round"/>

    <!-- Neck -->
    <path d="M400 332 Q420 320 435 306 Q445 300 452 300" fill="none" stroke="#fff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Head -->
    <ellipse cx="456" cy="296" rx="27" ry="24" fill="url(#bodyGrad)" stroke="#e0e0e0" stroke-width="2"/>
    <!-- Eye -->
    <circle cx="466" cy="290" r="4.5" fill="#222"/>
    <circle cx="467.5" cy="288.5" r="1.6" fill="#fff"/>

    <!-- Beak (upper) -->
    <path d="M478 298 L535 318 L530 326 L480 306 Z" fill="url(#beakGrad)" stroke="#e65100" stroke-width="2"/>
    <!-- Beak (lower pouch) -->
    <path d="M480 306 L528 330 L522 340 L484 316 Z" fill="#ff8f00" stroke="#e65100" stroke-width="2"/>
    <line x1="480" y1="306" x2="522" y2="340" stroke="#e65100" stroke-width="2"/>
    <line x1="488" y1="302" x2="532" y2="322" stroke="#e65100" stroke-width="2"/>

    <!-- Legs -->
    <line x1="354" y1="382" x2="340" y2="406" stroke="#f4a460" stroke-width="7" stroke-linecap="round"/>
    <line x1="376" y1="382" x2="372" y2="400" stroke="#f4a460" stroke-width="7" stroke-linecap="round"/>

    <!-- Feet -->
    <path d="M340 406 L346 408 L344 414 L338 412 Z" fill="#f4a460" stroke="#d87a30" stroke-width="2"/>
    <path d="M372 400 L378 402 L376 408 L370 406 Z" fill="#f4a460" stroke="#d87a30" stroke-width="2"/>
  </g>
</svg>
