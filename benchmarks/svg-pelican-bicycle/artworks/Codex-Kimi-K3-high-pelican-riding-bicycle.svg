<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="A pelican riding a bicycle">
  <title>Pelican Riding a Bicycle</title>
  <desc>A hand-drawn SVG scene: a white pelican with a large orange bill and throat pouch pedals a red diamond-frame bicycle along a grassy path, scarf fluttering behind.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#79c6e6"/>
      <stop offset="0.65" stop-color="#c9ecfa"/>
      <stop offset="1" stop-color="#eefaff"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#93d173"/>
      <stop offset="1" stop-color="#5ba047"/>
    </linearGradient>
    <radialGradient id="sunGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff7c4"/>
      <stop offset="0.55" stop-color="#ffd94d"/>
      <stop offset="1" stop-color="#ffae00"/>
    </radialGradient>
    <linearGradient id="beakGrad" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#ffc14d"/>
      <stop offset="1" stop-color="#ef8c1a"/>
    </linearGradient>
    <linearGradient id="pouchGrad" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#f9d68c"/>
      <stop offset="1" stop-color="#eab356"/>
    </linearGradient>
    <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e4583f"/>
      <stop offset="1" stop-color="#b0301c"/>
    </linearGradient>
  </defs>

  <!-- ============ background ============ -->
  <rect x="0" y="0" width="800" height="600" fill="url(#sky)"/>

  <!-- sun with rays -->
  <g>
    <g stroke="#ffd94d" stroke-width="6" stroke-linecap="round" opacity="0.85">
      <line x1="120" y1="22" x2="120" y2="44"/>
      <line x1="120" y1="152" x2="120" y2="174"/>
      <line x1="44" y1="98" x2="66" y2="98"/>
      <line x1="174" y1="98" x2="196" y2="98"/>
      <line x1="66" y1="44" x2="82" y2="60"/>
      <line x1="158" y1="136" x2="174" y2="152"/>
      <line x1="174" y1="44" x2="158" y2="60"/>
      <line x1="82" y1="136" x2="66" y2="152"/>
    </g>
    <circle cx="120" cy="98" r="46" fill="url(#sunGrad)"/>
  </g>

  <!-- clouds -->
  <g fill="#ffffff" opacity="0.92">
    <ellipse cx="300" cy="86" rx="52" ry="18"/>
    <circle cx="272" cy="74" r="20"/>
    <circle cx="306" cy="66" r="26"/>
    <circle cx="336" cy="78" r="18"/>
  </g>
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="606" cy="60" rx="44" ry="15"/>
    <circle cx="584" cy="50" r="17"/>
    <circle cx="614" cy="43" r="21"/>
    <circle cx="640" cy="54" r="14"/>
  </g>
  <g fill="#ffffff" opacity="0.75">
    <ellipse cx="716" cy="150" rx="34" ry="12"/>
    <circle cx="700" cy="141" r="13"/>
    <circle cx="724" cy="136" r="16"/>
  </g>

  <!-- distant birds -->
  <g stroke="#5b7f95" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M420,120 q8,-8 16,0 q8,-8 16,0"/>
    <path d="M470,100 q6,-6 12,0 q6,-6 12,0"/>
  </g>

  <!-- hills -->
  <path d="M-10,470 L110,352 Q148,318 188,356 L268,470 Z" fill="#a9d6a1"/>
  <path d="M170,470 L318,332 Q358,298 406,342 L520,470 Z" fill="#96c98f"/>
  <path d="M470,470 L600,368 Q634,342 668,372 L770,470 Z" fill="#a9d6a1"/>

  <!-- ground -->
  <rect x="0" y="470" width="800" height="130" fill="url(#grass)"/>
  <path d="M0,470 Q200,458 400,470 T800,466 L800,600 L0,600 Z" fill="#6fae54" opacity="0.5"/>

  <!-- flowers and tufts -->
  <g>
    <g stroke="#3f7a33" stroke-width="3" stroke-linecap="round">
      <path d="M60,560 q4,-14 0,-24"/>
      <path d="M690,566 q-4,-14 2,-24"/>
      <path d="M740,540 q4,-10 0,-18"/>
    </g>
    <g fill="#ff7b9c">
      <circle cx="60" cy="532" r="6"/><circle cx="52" cy="538" r="5"/><circle cx="68" cy="538" r="5"/>
      <circle cx="60" cy="542" r="5"/><circle cx="60" cy="537" r="3" fill="#ffe27a"/>
    </g>
    <g fill="#ffb14d">
      <circle cx="692" cy="538" r="6"/><circle cx="684" cy="544" r="5"/><circle cx="700" cy="544" r="5"/>
      <circle cx="692" cy="543" r="3" fill="#fff3c4"/>
    </g>
    <g stroke="#4c8a3e" stroke-width="4" stroke-linecap="round">
      <path d="M120,585 q6,-16 2,-28"/>
      <path d="M134,588 q2,-14 10,-24"/>
      <path d="M640,592 q-6,-16 -2,-28"/>
    </g>
  </g>

  <!-- motion lines behind the bike -->
  <g stroke="#9dbcc9" stroke-width="6" stroke-linecap="round" opacity="0.8">
    <line x1="96" y1="366" x2="162" y2="366"/>
    <line x1="72" y1="398" x2="150" y2="398"/>
    <line x1="96" y1="430" x2="156" y2="430"/>
  </g>

  <!-- ============ bicycle ============ -->
  <g id="bicycle">
    <!-- rear wheel -->
    <g>
      <circle cx="250" cy="400" r="70" fill="none" stroke="#2f2f2f" stroke-width="10"/>
      <circle cx="250" cy="400" r="58" fill="none" stroke="#cfcfcf" stroke-width="4"/>
      <g stroke="#b5b5b5" stroke-width="3">
        <line x1="250" y1="400" x2="307" y2="400"/>
        <line x1="250" y1="400" x2="290" y2="440"/>
        <line x1="250" y1="400" x2="250" y2="457"/>
        <line x1="250" y1="400" x2="210" y2="440"/>
        <line x1="250" y1="400" x2="193" y2="400"/>
        <line x1="250" y1="400" x2="210" y2="360"/>
        <line x1="250" y1="400" x2="250" y2="343"/>
        <line x1="250" y1="400" x2="290" y2="360"/>
      </g>
      <circle cx="250" cy="400" r="7" fill="#7d7d7d"/>
    </g>
    <!-- front wheel -->
    <g>
      <circle cx="540" cy="400" r="70" fill="none" stroke="#2f2f2f" stroke-width="10"/>
      <circle cx="540" cy="400" r="58" fill="none" stroke="#cfcfcf" stroke-width="4"/>
      <g stroke="#b5b5b5" stroke-width="3">
        <line x1="540" y1="400" x2="597" y2="400"/>
        <line x1="540" y1="400" x2="580" y2="440"/>
        <line x1="540" y1="400" x2="540" y2="457"/>
        <line x1="540" y1="400" x2="500" y2="440"/>
        <line x1="540" y1="400" x2="483" y2="400"/>
        <line x1="540" y1="400" x2="500" y2="360"/>
        <line x1="540" y1="400" x2="540" y2="343"/>
        <line x1="540" y1="400" x2="580" y2="360"/>
      </g>
      <circle cx="540" cy="400" r="7" fill="#7d7d7d"/>
    </g>

    <!-- chain -->
    <g stroke="#8a8a8a" stroke-width="2.5" fill="none">
      <path d="M252,392 L360,397"/>
      <path d="M252,408 L360,413"/>
    </g>

    <!-- frame -->
    <g stroke="url(#frameGrad)" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M250,400 L356,406"/>
      <path d="M250,400 L322,282"/>
      <path d="M356,406 L322,282"/>
      <path d="M356,406 L512,306"/>
      <path d="M330,288 L500,262"/>
      <path d="M500,262 L512,306"/>
      <path d="M512,306 L540,400"/>
    </g>

    <!-- seat -->
    <path d="M298,278 Q318,264 346,272 Q350,284 324,287 Q302,288 298,278 Z" fill="#3a2e28"/>

    <!-- handlebar -->
    <path d="M500,262 L491,227" stroke="url(#frameGrad)" stroke-width="8" stroke-linecap="round"/>
    <path d="M491,227 Q486,211 470,209" stroke="#3a3a3a" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M491,227 Q499,213 514,214" stroke="#3a3a3a" stroke-width="8" fill="none" stroke-linecap="round"/>
    <circle cx="470" cy="209" r="6" fill="#222"/>
    <circle cx="514" cy="214" r="6" fill="#222"/>

    <!-- crankset and pedals -->
    <circle cx="356" cy="406" r="13" fill="#4a4a4a" stroke="#333" stroke-width="3"/>
    <path d="M356,406 L396,376" stroke="#5c5c5c" stroke-width="7" stroke-linecap="round"/>
    <path d="M356,406 L316,436" stroke="#5c5c5c" stroke-width="7" stroke-linecap="round"/>
    <rect x="386" y="368" width="28" height="11" rx="5" fill="#262626" transform="rotate(-10 400 373)"/>
    <rect x="300" y="430" width="28" height="11" rx="5" fill="#262626" transform="rotate(-10 314 435)"/>
  </g>

  <!-- ============ pelican ============ -->
  <g id="pelican">
    <!-- far leg (slightly darker) -->
    <path d="M340,250 C332,292 324,352 319,428" stroke="#d97f26" stroke-width="9" fill="none" stroke-linecap="round"/>
    <g stroke="#d97f26" stroke-width="5" stroke-linecap="round">
      <path d="M319,428 l14,4"/>
      <path d="M319,428 l10,11"/>
      <path d="M319,428 l1,12"/>
    </g>

    <!-- tail feathers -->
    <path d="M296,224 C262,230 238,244 222,262 C244,258 266,256 288,254 Z" fill="#f2efe7" stroke="#d9d3c3" stroke-width="2.5"/>
    <path d="M298,238 C270,246 250,258 238,272" stroke="#d9d3c3" stroke-width="2.5" fill="none"/>

    <!-- near leg -->
    <path d="M356,252 C366,288 378,330 392,368" stroke="#f09a37" stroke-width="10" fill="none" stroke-linecap="round"/>
    <g stroke="#f09a37" stroke-width="5" stroke-linecap="round">
      <path d="M392,368 l15,3"/>
      <path d="M392,368 l11,10"/>
      <path d="M392,368 l3,12"/>
    </g>

    <!-- body -->
    <ellipse cx="362" cy="212" rx="82" ry="56" transform="rotate(-8 362 212)" fill="#ffffff" stroke="#e2dccd" stroke-width="3"/>
    <ellipse cx="372" cy="236" rx="52" ry="26" transform="rotate(-8 372 236)" fill="#f3efe5" opacity="0.8"/>

    <!-- wing sweeping back -->
    <path d="M370,166 C322,118 262,100 204,118 C254,130 300,154 346,196 Z" fill="#f6f3ec" stroke="#d5cfbe" stroke-width="2.5"/>
    <path d="M352,176 C316,144 276,130 238,132 C272,144 306,162 336,190 Z" fill="#e9e4d6"/>
    <path d="M204,118 C226,116 248,119 268,126 C248,131 228,136 212,144 C206,136 203,128 204,118 Z" fill="#b3ac9c"/>
    <path d="M346,196 C306,172 262,152 218,146" stroke="#d5cfbe" stroke-width="2.5" fill="none"/>
    <path d="M338,158 C302,138 262,126 224,124" stroke="#d5cfbe" stroke-width="2.5" fill="none"/>

    <!-- neck -->
    <path d="M408,186 C428,160 436,146 446,132" stroke="#ffffff" stroke-width="26" fill="none" stroke-linecap="round"/>
    <path d="M408,186 C428,160 436,146 446,132" stroke="#e2dccd" stroke-width="26" fill="none" stroke-linecap="round" opacity="0.35" transform="translate(2 4)"/>

    <!-- throat pouch hanging under the bill -->
    <path d="M492,140 C522,150 562,152 598,149 C592,178 562,197 531,193 C505,189 492,168 489,148 Z" fill="url(#pouchGrad)" stroke="#dd9f3e" stroke-width="2.5"/>
    <path d="M505,168 C524,180 552,182 574,172" stroke="#dd9f3e" stroke-width="2" fill="none" opacity="0.7"/>

    <!-- head -->
    <circle cx="463" cy="125" r="30" fill="#ffffff" stroke="#e2dccd" stroke-width="3"/>
    <!-- crest feathers -->
    <g stroke="#e8e3d6" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M453,101 q-3,-10 -12,-13"/>
      <path d="M464,99 q1,-11 9,-15"/>
      <path d="M475,102 q6,-8 14,-10"/>
    </g>

    <!-- upper bill: long with a hooked tip -->
    <path d="M487,114 C532,110 584,122 620,141 C584,140 532,138 489,137 Z" fill="url(#beakGrad)" stroke="#d97b14" stroke-width="2.5"/>
    <path d="M614,137 q13,4 11,15 q-3,7 -10,4 q6,-8 -3,-14 Z" fill="#e07f12" stroke="#c96f0e" stroke-width="2"/>
    <path d="M500,120 L566,129" stroke="#d97b14" stroke-width="2" opacity="0.7"/>

    <!-- eye -->
    <circle cx="474" cy="119" r="6" fill="#20303c"/>
    <circle cx="476.5" cy="116.5" r="2" fill="#ffffff"/>

    <!-- scarf -->
    <ellipse cx="440" cy="152" rx="19" ry="11" transform="rotate(-24 440 152)" fill="#d63b2f"/>
    <path d="M428,158 C390,148 350,156 314,144 C348,140 390,136 426,146 Z" fill="#e85447" stroke="#c93b2c" stroke-width="2"/>
    <path d="M426,166 C396,170 364,182 334,178 C362,168 396,158 424,156 Z" fill="#d63b2f" stroke="#b93225" stroke-width="2"/>
  </g>
</svg>
