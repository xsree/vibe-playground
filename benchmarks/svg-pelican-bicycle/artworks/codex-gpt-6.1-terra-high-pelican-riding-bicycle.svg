<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc">
  <title id="title">海风里的骑行</title>
  <desc id="desc">一只戴着蓝色帽子的鹈鹕骑着红色自行车，沿海岸迎风前行。</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#cce9e5"/><stop offset="1" stop-color="#f7ead0"/></linearGradient>
    <linearGradient id="feather" x2="1" y2="1"><stop stop-color="#fffdf1"/><stop offset="1" stop-color="#cbd8d0"/></linearGradient>
    <linearGradient id="pouch" x2="0" y2="1"><stop stop-color="#f4b858"/><stop offset="1" stop-color="#df7851"/></linearGradient>
    <pattern id="spokes" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#436a68" opacity=".12"/></pattern>
  </defs>
