  <path d="M375 268 Q333 269 292 243 Q300 278 341 292 Q315 294 293 286 Q320 315 376 310Z" fill="#f7f4df" stroke="#26474d" stroke-width="5" stroke-linejoin="round"/>
  <path d="M493 240 Q525 209 520 163 Q519 113 545 91 Q567 72 593 88 Q626 104 620 133 Q616 162 587 179 Q561 196 553 224 Q547 248 564 278 L528 298 Q505 270 493 240Z" fill="url(#feathers)" stroke="#26474d" stroke-width="6" stroke-linejoin="round"/>
  <path d="M522 170 Q536 192 526 221 M542 114 Q528 138 532 157" fill="none" stroke="#cddaca" stroke-width="4" stroke-linecap="round"/>
  <path d="M366 244 C371 211 414 193 468 201 C511 206 550 234 546 276 C541 321 499 345 446 334 C398 325 361 290 366 244Z" fill="url(#feathers)" stroke="#26474d" stroke-width="6"/>
  <path d="M386 278 Q431 310 489 307 Q517 297 531 282" fill="none" stroke="#dce5d2" stroke-width="4" stroke-linecap="round"/>
  <path d="M626 144 C687 156 768 157 807 143 C794 184 769 236 726 257 Q691 274 666 245 Q639 211 626 144Z" fill="url(#pouch)" stroke="#9e623e" stroke-width="5" stroke-linejoin="round"/>
  <path d="M657 174 Q685 232 719 243 Q754 240 783 184" fill="none" stroke="#ffd689" stroke-width="5" opacity=".65" stroke-linecap="round"/>
  <path d="M612 128 Q704 128 811 139 Q824 141 813 152 Q710 169 621 159Z" fill="url(#bill)" stroke="#9e623e" stroke-width="5" stroke-linejoin="round"/>
  <path d="M637 142 Q712 148 789 146" fill="none" stroke="#fff0b2" stroke-width="4" stroke-linecap="round"/>
  <path d="M621 159 Q710 170 808 153" fill="none" stroke="#b77544" stroke-width="3"/>
  <circle cx="585" cy="122" r="10" fill="#fff7dc" stroke="#26474d" stroke-width="3"/>
  <circle cx="587" cy="122" r="4.7" fill="#23444b"/>
  <circle cx="589" cy="120" r="1.5" fill="white"/>
  <path d="M562 104 q15-10 29-5" fill="none" stroke="#26474d" stroke-width="3" stroke-linecap="round"/>
  <path d="M542 87 Q569 56 602 80 L616 96 Q574 89 545 103Z" fill="#3e827e" stroke="#26474d" stroke-width="4" stroke-linejoin="round"/>
  <path d="M550 91 Q576 79 608 92" fill="none" stroke="#a5c7b4" stroke-width="4" stroke-linecap="round"/>
  <path d="M607 94 Q630 92 642 104 Q628 110 612 106Z" fill="#d17b52" stroke="#26474d" stroke-width="3"/>
  <path d="M545 186 Q564 204 598 196 Q606 209 591 224 Q567 225 550 211Z" fill="#d16e4b" stroke="#9e523d" stroke-width="3"/>
  <path d="M547 202 Q527 207 513 204" fill="none" stroke="#d16e4b" stroke-width="11" stroke-linecap="round"/>
  <path d="M407 244 C449 217 499 226 524 254 Q545 275 574 284 L680 289 Q692 288 697 299 L682 309 Q612 313 563 306 Q515 295 489 287 Q440 310 401 285Z" fill="#e7ecdb" stroke="#26474d" stroke-width="5" stroke-linejoin="round"/>
  <path d="M421 262 Q464 248 494 267 M442 281 Q480 278 501 288 M531 277 Q553 294 595 297" fill="none" stroke="#bbccc3" stroke-width="4" stroke-linecap="round"/>
  <path d="M675 291 q20-3 28 4 q5 8-2 13 l-24 2" fill="#f5f1dc" stroke="#26474d" stroke-width="4" stroke-linecap="round"/>

  <!-- Bell, motion, and a small optimistic sign-off. -->
  <path d="M658 313 q4-9 13-8 q9 0 12 8Z" fill="#f5b357" stroke="#23484e" stroke-width="3"/>
  <circle cx="671" cy="318" r="3" fill="#23484e"/>
  <g stroke="#cc8b63" fill="none" stroke-width="4" stroke-linecap="round" opacity=".75">
    <path d="M90 458 h51 M76 486 h69 M856 451 h54 M867 478 h69"/>
  </g>
  <text x="772" y="681" fill="#57716c" font-family="Georgia,serif" font-size="18" font-style="italic">a better way to fly</text>
</svg>
