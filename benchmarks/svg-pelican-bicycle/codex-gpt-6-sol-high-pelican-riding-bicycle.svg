<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Express</title>
  <desc id="desc">A cheerful white pelican pedals a teal bicycle across a sunny coastal road, its enormous golden bill and pouch leading the way.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#d9ece8"/><stop offset="1" stop-color="#fff5dc"/></linearGradient>
    <linearGradient id="feathers" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdf1"/><stop offset=".64" stop-color="#f4f0db"/><stop offset="1" stop-color="#d7dfd0"/></linearGradient>
    <linearGradient id="pouch" x1="0" x2=".9" y2="1"><stop stop-color="#f9c866"/><stop offset=".55" stop-color="#ed9e45"/><stop offset="1" stop-color="#d97840"/></linearGradient>
    <linearGradient id="bill" x2="0" y2="1"><stop stop-color="#ffdc84"/><stop offset="1" stop-color="#eaa65a"/></linearGradient>
    <pattern id="road-dots" width="28" height="18" patternUnits="userSpaceOnUse"><circle cx="4" cy="5" r="1.2" fill="#dfceb0"/><circle cx="20" cy="14" r=".8" fill="#dfceb0"/></pattern>
    <g id="wheel">
      <circle r="108" fill="#fffdf3" stroke="#223f48" stroke-width="12"/>
      <circle r="99" fill="none" stroke="#e0ad70" stroke-width="3"/>
      <g stroke="#90a7a0" stroke-width="2">
        <path d="M0-95V95 M-95 0H95 M-67-67 67 67 M67-67-67 67"/>
        <path d="M-36-88 36 88 M36-88-36 88 M-88-36 88 36 M-88 36 88-36"/>
      </g>
      <circle r="14" fill="#e4a152" stroke="#223f48" stroke-width="5"/>
      <circle r="4" fill="#fff8e8"/>
    </g>
    <filter id="soft" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>

  <!-- Warm, hand-printed coastal poster setting -->
  <rect width="1000" height="700" fill="url(#sky)"/>
  <circle cx="793" cy="133" r="94" fill="#ffd98a" opacity=".75"/>
  <circle cx="793" cy="133" r="116" fill="none" stroke="#e9b970" stroke-width="2" opacity=".38"/>
  <path d="M0 456 Q109 399 219 449 T447 445 Q552 392 674 442 T1000 432 V609 H0Z" fill="#bfd9ca" opacity=".55"/>
  <path d="M0 514 Q139 475 267 505 T527 504 Q679 470 827 501 T1000 492 V609 H0Z" fill="#93bdb0" opacity=".42"/>
  <g fill="none" stroke="#fffdf0" stroke-width="5" stroke-linecap="round" opacity=".9">
    <path d="M87 135 q15-12 30 0 q13-12 27-1 M151 164 q11-8 22 0 q10-8 20 0"/>
    <path d="M761 333 q18-13 36 0 q15-12 29 0 M824 313 q12-9 25 0"/>
  </g>
  <path d="M0 610 Q510 602 1000 610 V700 H0Z" fill="#f6ead0"/>
  <rect y="611" width="1000" height="89" fill="url(#road-dots)"/>
  <path d="M0 608 H1000" stroke="#5d817c" stroke-width="5"/>
  <path d="M66 655 h119 M316 655 h117 M564 655 h117 M815 655 h119" stroke="#e9cc9c" stroke-width="6" stroke-linecap="round"/>
  <ellipse cx="501" cy="613" rx="391" ry="18" fill="#42636a" opacity=".16" filter="url(#soft)"/>

  <!-- Poster lettering and little flying companions -->
  <g fill="#23444b">
    <text x="72" y="78" font-family="Georgia,serif" font-size="27" font-style="italic" letter-spacing="2">THE PELICAN</text>
    <text x="71" y="115" font-family="Arial,sans-serif" font-size="32" font-weight="800" letter-spacing="5">EXPRESS</text>
    <path d="M74 127 h259" stroke="#db8952" stroke-width="4"/>
  </g>
  <text x="76" y="154" fill="#66817b" font-family="Arial,sans-serif" font-size="12" letter-spacing="3">COASTAL DELIVERY · EST. 1924</text>
  <g fill="none" stroke="#507770" stroke-linecap="round" stroke-width="3" opacity=".75"><path d="M383 98 q12-12 24 0 q12-12 24 0 M449 124 q9-8 19 0 q9-8 18 0"/></g>

  <!-- Wheels, mudguards, rack, and the bicycle's clear diamond frame -->
  <use xlink:href="#wheel" transform="translate(250 500)"/>
  <use xlink:href="#wheel" transform="translate(748 500)"/>
  <g fill="none" stroke="#23484e" stroke-linecap="round" stroke-linejoin="round">
    <path d="M144 473 A109 109 0 0 1 349 467 M643 470 A108 108 0 0 1 847 467" stroke-width="8"/>
