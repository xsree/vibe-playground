  <path d="M628 345 652 291 700 288" fill="none" stroke="#23484e" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M694 289 h32" stroke="#d2744a" stroke-width="13" stroke-linecap="round"/>
  <path d="M406 341 400 308" stroke="#23484e" stroke-width="11" stroke-linecap="round"/>
  <path d="M361 315 Q390 306 440 315 Q447 325 428 329 H375 Q359 328 361 315Z" fill="#23484e"/>
  <path d="M365 316 Q397 311 434 317" fill="none" stroke="#d18b5a" stroke-width="3" stroke-linecap="round"/>
  <circle cx="478" cy="500" r="29" fill="#f6ead0" stroke="#23484e" stroke-width="8"/>
  <circle cx="478" cy="500" r="11" fill="#d38c57" stroke="#23484e" stroke-width="4"/>
  <path d="M478 500 508 470 M478 500 448 530" stroke="#23484e" stroke-width="9" stroke-linecap="round"/>
  <path d="M491 470 h39 M428 530 h39" stroke="#23484e" stroke-width="10" stroke-linecap="round"/>
  <path d="M267 500 478 500" stroke="#d19b62" stroke-width="3" stroke-dasharray="7 6" opacity=".9"/>
  <path d="M663 330 690 342" fill="none" stroke="#23484e" stroke-width="5" stroke-linecap="round"/>
  <path d="M689 343 l31-10 14 16-27 8Z" fill="#f4b55e" stroke="#23484e" stroke-width="4"/>
  <circle cx="721" cy="345" r="4" fill="#fff4cf"/>

  <!-- The cyclist's legs reach the two pedals. -->
  <g fill="none" stroke="#e28c57" stroke-linecap="round" stroke-linejoin="round">
    <path d="M423 310 Q448 351 456 404 L508 466" stroke-width="19"/>
    <path d="M399 306 Q406 364 421 411 L448 527" stroke-width="17"/>
  </g>
  <g fill="#edaa67" stroke="#a9573b" stroke-width="4" stroke-linejoin="round">
    <path d="M497 457 q18 4 24 13 q12 5 19 2 q3 10-9 13 h-34 q-15-5-10-15Z"/>
    <path d="M436 516 q17 0 24 11 q12 5 18 3 q3 10-11 13 h-32 q-13-7-11-16Z"/>
  </g>

