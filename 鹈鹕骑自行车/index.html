<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>鹈鹕骑自行车 · SVG 产物对照表</title>
  <link rel="stylesheet" href="gallery.css">
  <script src="gallery-data.js" defer></script>
  <script src="gallery.js" defer></script>
</head>
<body>
  <header>
    <div>
      <p class="eyebrow">SVG COLLECTION / 2026</p>
      <h1>鹈鹕骑自行车</h1>
      <p class="intro">横向对照 Harness，纵向浏览模型与思考强度。点击作品放大。</p>
    </div>
    <p id="summary" class="summary"></p>
  </header>
  <main>
    <section class="toolbar-wrapper" aria-label="画廊索引与筛选">
      <div class="toolbar" role="search">
        <!-- 1. Agent / Harness Custom Select -->
        <div class="custom-select" data-filter="harness" id="select-harness">
          <button type="button" class="select-trigger" aria-haspopup="listbox" aria-expanded="false" id="trigger-harness">
            <span class="select-label">平台</span>
            <span class="select-value">全部 Harness</span>
            <svg class="select-arrow" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="select-dropdown" role="listbox" aria-labelledby="trigger-harness">
            <div class="select-options-list" id="options-harness"></div>
          </div>
        </div>

        <!-- 2. Model Custom Two-Level Select (Vendor -> Model) -->
        <div class="custom-select" data-filter="model" id="select-model">
          <button type="button" class="select-trigger" aria-haspopup="listbox" aria-expanded="false" id="trigger-model">
            <span class="select-label">模型</span>
            <span class="select-value">全部模型</span>
            <svg class="select-arrow" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="select-dropdown model-dropdown" role="listbox" aria-labelledby="trigger-model">
            <div class="model-dropdown-inner">
              <div class="vendor-pane" id="vendor-list"></div>
              <div class="model-pane" id="model-sublist"></div>
            </div>
          </div>
        </div>

        <!-- 3. Reasoning Effort Custom Select (Cascading) -->
        <div class="custom-select" data-filter="effort" id="select-effort">
          <button type="button" class="select-trigger" aria-haspopup="listbox" aria-expanded="false" id="trigger-effort">
            <span class="select-label">思考强度</span>
            <span class="select-value">全部强度</span>
            <svg class="select-arrow" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="select-dropdown" role="listbox" aria-labelledby="trigger-effort">
            <div class="select-options-list" id="options-effort"></div>
          </div>
        </div>

        <!-- 4. SVG Format / Type Filter -->
        <div class="custom-select" data-filter="type" id="select-type">
          <button type="button" class="select-trigger" aria-haspopup="listbox" aria-expanded="false" id="trigger-type">
            <span class="select-label">形态</span>
            <span class="select-value">全部形态</span>
            <svg class="select-arrow" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="select-dropdown" role="listbox" aria-labelledby="trigger-type">
            <div class="select-options-list" id="options-type"></div>
          </div>
        </div>

        <!-- Reset Button -->
        <button type="button" id="btn-reset" class="toolbar-reset" title="重置全部筛选条件">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
          重置
        </button>
      </div>

      <div id="count" class="toolbar-count" role="status"></div>
    </section>

    <div class="matrix" tabindex="0" role="region" aria-label="SVG 对照表，可横向及纵向滚动"><table><caption class="sr-only">每列一个 Harness，每行一个模型与思考强度组合，未收录的组合显示横线。</caption><thead id="head"></thead><tbody id="body"></tbody></table></div>
    <p id="empty" hidden>没有匹配的产物，请调整筛选条件。</p>
    <footer><span>— 表示尚无产物 · SVG 保持原始比例</span><a href="鹈鹕骑自行车提示词.md">测试提示词与结果记录 ↗</a></footer>
  </main>
  <dialog id="viewer"><div class="dialog-bar"><h2 id="viewer-title"></h2><a id="original" target="_blank" rel="noopener">打开 SVG ↗</a><button id="close" aria-label="关闭预览">关闭 ×</button></div><img id="large" alt=""><p id="filename"></p></dialog>
</body>
</html>
