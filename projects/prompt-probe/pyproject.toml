[project]
name = "promptprobe"
version = "0.1.0"
description = "One-shot OpenAI-compatible system prompt capture server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.uv]
package = false
python-downloads = "never"
